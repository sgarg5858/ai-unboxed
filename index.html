<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

  --pos:#1C8C74; --neg:#D0583A; --heat:#D9901C; --heat-soft:#F8E8CC;
  --code-bg:#1B2422; --code-ink:#DDE6E2; --code-dim:#8FA39C; --code-key:#7FC8DD;
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171E1C; --sunk:#1F2826; --ink:#E4ECE9; --muted:#9AA9A4; --line:#2C3835;
  --accent:#4DB3D1; --accent-ink:#8FD3E6; --accent-soft:#163742;
  --pos:#3FC4A3; --neg:#F07D60; --heat:#F0AC40; --heat-soft:#3D2E14;
  --code-bg:#0A0E0D; --code-ink:#DDE6E2; --code-dim:#7C8F89; --code-key:#7FC8DD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171E1C; --sunk:#1F2826; --ink:#E4ECE9; --muted:#9AA9A4; --line:#2C3835;
  --accent:#4DB3D1; --accent-ink:#8FD3E6; --accent-soft:#163742;
  --pos:#3FC4A3; --neg:#F07D60; --heat:#F0AC40; --heat-soft:#3D2E14;
  --code-bg:#0A0E0D; --code-ink:#DDE6E2; --code-dim:#7C8F89; --code-key:#7FC8DD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}

nav.chapters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
nav.chapters button{flex:0 0 auto;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
nav.chapters button b{font-family:var(--f-mono);font-weight:500;font-size:12px;margin-right:6px;color:var(--muted)}
nav.chapters button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.prose code,.k{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.shape{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:4px 10px;margin:4px 0 12px}
pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;border-radius:10px;padding:14px 16px;overflow-x:auto;margin:6px 0 0;max-width:100%}
pre.code .c{color:var(--code-dim)} pre.code .kw{color:var(--code-key)}
.viz{min-width:0;display:flex;flex-direction:column;gap:12px}

.mono{font-family:var(--f-mono);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.ctl output{font-family:var(--f-mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}

.chip{font-family:var(--f-mono);font-size:12.5px;border-radius:6px;padding:3px 7px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid transparent;cursor:default;line-height:1.35;text-align:center}
.chip small{display:block;font-size:10.5px;color:var(--muted)}

.matrix{border-collapse:separate;border-spacing:2px;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.matrix th{font-weight:400;color:var(--muted);padding:2px 6px;text-align:right;white-space:nowrap}
.matrix td{padding:5px 6px;text-align:center;border-radius:4px;min-width:42px}
.scroll{overflow-x:auto;max-width:100%}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px;margin:3px 0}

.bar .t i.off{background:var(--line)}

.stack{display:flex;flex-direction:column;gap:6px}

.stage .mono{color:var(--accent-ink)}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.foot .cnt{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.foot .btn{padding:9px 16px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg .lbl{fill:var(--ink);font-size:12px}
.hm{display:grid;gap:1px}
.hm div{aspect-ratio:1;border-radius:1px}
textarea,input[type=text]{width:100%;font:inherit;font-family:var(--f-mono);font-size:13.5px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}

.stat span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Inside an <span>LLM</span></h1>
    <p class="sub">a forward pass, one tensor at a time · <span class="kbd">←</span> <span class="kbd">→</span> to move</p>
  </header>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  <div class="progress" id="progress"></div>
  <article class="slide" id="slide" aria-live="polite">
    <div class="prose">
      <p class="eyebrow">Chapter 1 · Input</p>
      <h2>Loading the course</h2>
      <p>The slides render as soon as the script runs.</p>
    </div>
    <div class="viz"></div>
  </article>
  <div class="foot">
    <button class="btn" id="prev">← Back</button>
    <span class="cnt" id="cnt"></span>
    <button class="btn" id="next">Next →</button>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const sm=a=>{const m=Math.max(...a),e=a.map(x=>Math.exp(x-m)),s=e.reduce((p,c)=>p+c,0);return e.map(x=>x/s)};
const mm=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
const T=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const f2=x=>(Math.abs(x)<0.005?0:x).toFixed(2);
const vis=t=>t.replace(/^ /,'␣');
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const signCell=v=>`background:color-mix(in srgb, ${v>=0?'var(--pos)':'var(--neg)'} ${Math.round(12+Math.min(1,Math.abs(v))*70)}%, var(--surface));color:var(--ink)`;
const heatCell=v=>`background:color-mix(in srgb, var(--heat) ${Math.round(v*90)}%, var(--surface));color:var(--ink)`;
const code=s=>`<pre class="code">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(#[^\n]*)/g,'<span class="c">$1</span>').replace(/\b(def|class|return|for|in|if|else|import|torch|self)\b/g,'<span class="kw">$1</span>')}</pre>`;
const slider=(id,label,min,max,step,val,fmt)=>`<label class="ctl" for="${id}"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}-o">${fmt?fmt(val):val}</output></label>`;
const human=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));
const bytes=n=>n>=2**30?(n/2**30).toFixed(2)+' GiB':n>=2**20?(n/2**20).toFixed(1)+' MiB':(n/1024).toFixed(0)+' KiB';

/* ---------- tiny attention model used across chapter 3 ---------- */
const TOK=["I"," am"," learning"," artificial"];
const X=[[0.9,0.1,0.3,-0.2],[0.2,0.8,-0.1,0.3],[-0.3,0.4,0.9,0.5],[0.1,-0.2,0.7,1.0]];
const Wq=[[0.6,-0.2,0.1],[0.1,0.5,-0.3],[0.4,0.3,0.8],[-0.2,0.6,0.5]];
const Wk=[[0.5,0.1,-0.2],[-0.1,0.6,0.2],[0.3,0.2,0.9],[0.2,0.4,0.6]];
const Wv=[[0.7,0.0,0.2],[0.1,0.8,-0.1],[0.2,-0.3,0.9],[-0.4,0.5,0.3]];
const Q=mm(X,Wq),K=mm(X,Wk),V=mm(X,Wv);
const S=mm(Q,T(K)).map(r=>r.map(v=>v/Math.sqrt(3)));
const st={causal:true,qrow:3,mi:0,gen:0,temp:1,topk:8,topp:1,lr:0.3,w:-1,path:[-1],pc:{d:768,L:12,V:50257},kv:{L:32,h:8,dh:128,n:8192,b:2},rope:{m:2,n:5},pce:0.25,rmsScale:1,act:'all',moe:[1,5],head:0};
const masked=()=>S.map((r,i)=>r.map((v,j)=>st.causal&&j>i?-Infinity:v));
const weights=()=>masked().map(r=>sm(r.map(v=>v===-Infinity?-1e9:v)));
const matTable=(M,rowL,colL,cellFn)=>`<div class="scroll"><table class="matrix"><tr><th></th>${colL.map(c=>`<th style="text-align:center">${c}</th>`).join('')}</tr>${M.map((r,i)=>`<tr><th>${rowL[i]}</th>${r.map((v,j)=>cellFn(v,i,j)).join('')}</tr>`).join('')}</table></div>`;

/* ---------- toy tokenizer ---------- */
const VOCAB=[" the"," a"," I","I"," am"," is"," are"," learning"," learn","ing"," artificial"," art","ificial"," intelligence"," intellig","ence"," model"," models"," language"," large"," token","s","izer"," un","believ","able"," transform","er","ers"," attention"," neural"," network"," data","."," ,",",","!","?"," hello","Hello"," world"," you"," we"," AI"," GPT"," London"," code"," Java"," Spring"," Boot"," Angular"," front","end"," back"," write"," writing"," read"," reading","ed","ly","est"," low"," new"," wide","tion"," of"," and"," to"," in"," it"," that"," for"," with"," on"," this"," how"," what"," work"," works"," do"," does"," LL","M","Ms"," embed","ding","dings"," train"," training"," predict"," next"," word"," words"," sentence"," text"," machine"," deep"," learned","ify","ize"," re","pre"];
function tokenize(s){const out=[];let i=0;while(i<s.length){let best=null;for(const v of VOCAB){if(s.startsWith(v,i)&&(!best||v.length>best.length))best=v}
 if(best){out.push([best,1000+VOCAB.indexOf(best)*37]);i+=best.length}else{const ch=s[i];out.push([ch,ch.charCodeAt(0)]);i++}}return out}

/* ---------- chapters ---------- */
const CH=[
{id:"map",name:"The big picture",slides:[
 {t:"The whole machine on one screen",
  b:`<p>An LLM is a pure function: a list of integers goes in, a probability distribution over the vocabulary comes out. Text generation is just calling that function in a loop.</p><p>Every stage below transforms one tensor into another. Track the shapes and the architecture stops being mysterious. <code>B</code> is batch size, <code>n</code> is sequence length, <code>d</code> is model width, <code>V</code> is vocabulary size.</p><p>Click a stage to jump to its chapter.</p>`,
  v:()=>`<div class="panel stack">${[["Text","string","in"],["Tokenizer","[B, n] int ids","in"],["Embeddings + position","[B, n, d]","in"],["Transformer block × N","[B, n, d] → [B, n, d]","attn"],["  · attention","mixes across tokens","attn"],["  · MLP","thinks per token","block"],["Final norm + unembed","[B, n, V] logits","out"],["Softmax + sampling","1 next token id","out"]].map(([a,b,c])=>`<div class="stage click" data-go="${c}" role="button" tabindex="0"><span>${a}</span><span class="mono">${b}</span></div>`).join('')}</div><p class="cap">Typical sizes: d = 4,096, N = 32 layers, V = 128,000. Only the last row of logits matters when generating.</p>`,
  code:`def forward(ids):                 # ids: [B, n]
    x = embed(ids) + pos(ids)     # [B, n, d]
    for block in blocks:          # N times
        x = block(x)              # attention + MLP
    logits = unembed(norm(x))     # [B, n, V]
    return logits`,
  init:()=>document.querySelectorAll('[data-go]').forEach(e=>{const go=()=>goto({in:"input",attn:"attention",block:"block",out:"output"}[e.dataset.go],0);e.onclick=go;e.onkeydown=k=>{if(k.key==='Enter')go()}})},
 {t:"Generation is a loop",
  b:`<p>The model predicts one token, appends it, and runs again. That's autoregressive decoding.</p><ul><li><b>Prefill</b>: the whole prompt goes through in one parallel pass. Fast per token, compute-bound.</li><li><b>Decode</b>: each new token needs another pass. Memory-bound, which is why a KV cache (chapter 4) matters so much.</li><li>It stops at a special end-of-sequence token or a max length.</li></ul>`,
  v:()=>`<div class="panel"><div class="row" id="genrow"></div><div class="row" style="margin-top:14px"><button class="btn on" id="genbtn">Run one step</button><button class="btn" id="genrst">Reset</button></div></div><p class="cap" id="gencap"></p>`,
  code:`ids = tokenizer.encode(prompt)
while len(ids) < max_len:
    logits = model(ids)[-1]        # only the last position
    next_id = sample(logits)
    ids.append(next_id)
    if next_id == EOS: break`,
  init:()=>{const P=["I"," am"," learning"],G=[" artificial"," intelligence"," and"," it"," is"," fun","."," <eos>"];
   const draw=()=>{$('#genrow').innerHTML=P.map(t=>`<span class="chip">${vis(t)}</span>`).join('')+G.slice(0,st.gen).map((t,i)=>`<span class="chip ${i===st.gen-1?'hot':''}">${vis(t)}</span>`).join('')+(st.gen<G.length?`<span class="chip dim">?</span>`:'');
    $('#gencap').textContent=st.gen===0?'Prompt only. Step 1 is the prefill pass over all 3 tokens.':st.gen<G.length?`Pass ${st.gen+1} done. Sequence length is now ${3+st.gen}; the model re-reads it all (or reuses its cache).`:'Hit <eos>, so generation stops.'};
   $('#genbtn').onclick=()=>{if(st.gen<G.length)st.gen++;draw()};$('#genrst').onclick=()=>{st.gen=0;draw()};draw()}}
]},
{id:"input",name:"Tokens & embeddings",slides:[
 {t:"Why subwords",
  b:`<p>The model needs a finite vocabulary. Characters give a tiny vocab but long sequences, and attention cost grows with the square of length. Whole words keep sequences short but explode the vocab and break on typos and new words.</p><p>Subwords sit in the middle: frequent words become one token, rare words split into reusable pieces. Modern tokenizers work on <b>bytes</b>, so any string, emoji, or language can be encoded with zero unknown tokens.</p>`,
  v:()=>`<div class="panel stack">${[["Characters","u n b e l i e v a b l e","12 tokens · vocab ≈ 256"],["Words","unbelievable","1 token · vocab in the millions"],["Subwords (BPE)","un · believ · able","3 tokens · vocab ≈ 50k–200k"]].map(([a,b,c],i)=>`<div class="stage ${i===2?'cur':''}"><span><b style="font-weight:500">${a}</b><br><span class="mono" style="color:var(--muted)">${b}</span></span><span class="mono">${c}</span></div>`).join('')}</div><p class="cap">Rule of thumb for English: 1 token ≈ 4 characters ≈ 0.75 words.</p>`},
 {t:"How BPE builds the vocabulary",
  b:`<p>Byte pair encoding is a compression algorithm repurposed. Training it is simple:</p><ul><li>Split the corpus into single bytes.</li><li>Count every adjacent pair. Merge the most frequent pair into a new token.</li><li>Record the merge rule. Repeat until the vocab hits its target size.</li></ul><p>Encoding new text replays those merge rules in order. Click through the merges on a four-word corpus.</p>`,
  v:()=>`<div class="panel"><p class="mono" id="bpem" style="margin:0 0 10px;color:var(--accent-ink)"></p><div id="bpew" class="stack"></div><div class="row" style="margin-top:12px"><button class="btn on" id="bpeb">Apply next merge</button><span class="cap" id="bpev"></span></div></div>`,
  code:`def train_bpe(words, vocab_size):
    merges = []
    while len(vocab) < vocab_size:
        pair = most_frequent_pair(words)   # e.g. ('e','s')
        words = merge(words, pair)         # 'e','s' -> 'es'
        merges.append(pair)
    return merges`,
  init:()=>{const M=[{m:"start: every word split into characters",w:[["l","o","w"],["l","o","w","e","r"],["n","e","w","e","s","t"],["w","i","d","e","s","t"]]},{m:"merge (e, s) → es · seen 2×",w:[["l","o","w"],["l","o","w","e","r"],["n","e","w","es","t"],["w","i","d","es","t"]],h:"es"},{m:"merge (es, t) → est · seen 2×",w:[["l","o","w"],["l","o","w","e","r"],["n","e","w","est"],["w","i","d","est"]],h:"est"},{m:"merge (l, o) → lo · seen 2×",w:[["lo","w"],["lo","w","e","r"],["n","e","w","est"],["w","i","d","est"]],h:"lo"},{m:"merge (lo, w) → low · seen 2×",w:[["low"],["low","e","r"],["n","e","w","est"],["w","i","d","est"]],h:"low"}];
   const draw=()=>{const s=M[st.mi];$('#bpem').textContent=`rule ${st.mi}: ${s.m}`;$('#bpew').innerHTML=s.w.map(w=>`<div class="row">${w.map(t=>`<span class="chip ${t===s.h?'hot':''}">${t}</span>`).join('')}</div>`).join('');$('#bpev').textContent=`vocab: ${11+st.mi} tokens`;$('#bpeb').textContent=st.mi<4?'Apply next merge':'Reset'};
   $('#bpeb').onclick=()=>{st.mi=st.mi<4?st.mi+1:0;draw()};draw()}},
 {t:"Try a tokenizer",
  b:`<p>This is a toy greedy longest-match tokenizer with a ~100-entry vocab, enough to see the behaviour. Real ones (tiktoken, SentencePiece) have 50k–200k entries.</p><p>Things to try:</p><ul><li>Misspell a word, like <code>artifical</code>. It shatters into pieces.</li><li>Remove the space before a word. <code>␣learning</code> and <code>learning</code> are different tokens.</li><li>Type in another language. Unknown bytes fall back to single characters, which is why non-English text often costs more tokens.</li></ul>`,
  v:()=>`<div class="panel"><label for="tokin" class="cap" style="display:block;margin-bottom:6px">Your text</label><textarea id="tokin" rows="2">I am learning artificial intelligence.</textarea><div class="row" id="tokout" style="margin-top:12px"></div><div class="stat" style="margin-top:12px"><div><b id="tokn">0</b><span>tokens</span></div><div><b id="tokr">0</b><span>characters per token</span></div></div></div><p class="cap">Small grey numbers are made-up token IDs. ␣ marks a leading space.</p>`,
  code:`import tiktoken
enc = tiktoken.get_encoding("cl100k_base")
enc.encode("I am learning")     # [40, 1097, 6975]
enc.decode([40, 1097, 6975])    # 'I am learning'`,
  init:()=>{const go=()=>{const s=$('#tokin').value,t=tokenize(s);$('#tokout').innerHTML=t.map(([p,id])=>`<span class="chip">${vis(p)}<small>${id}</small></span>`).join('');$('#tokn').textContent=t.length;$('#tokr').textContent=t.length?(s.length/t.length).toFixed(1):'0'};$('#tokin').oninput=go;go()}},
 {t:"Special tokens and chat templates",
  b:`<p>Some vocabulary entries never appear in normal text. They act as control signals the model learned during training: start of text, end of text, padding, and role markers.</p><p>A chat isn't sent as plain text. It's rendered into a template with role markers, then tokenized. Get the template wrong and a chat model behaves noticeably worse, because it never saw that format in training.</p><p>This is also where the system prompt lives: it's just more tokens at the front of the sequence.</p>`,
  v:()=>`<div class="panel"><div class="row">${[["<|begin|>","s"],["<|system|>","s"],["␣You","t"],["␣are","t"],["␣helpful","t"],["<|end|>","s"],["<|user|>","s"],["Hi","t"],["<|end|>","s"],["<|assistant|>","s"]].map(([t,k])=>`<span class="chip ${k==='s'?'hot':''}">${t.replace(/</g,'&lt;')}</span>`).join('')}</div><p class="cap" style="margin-top:12px">Amber = special tokens. The model's reply is generated right after <span class="k">&lt;|assistant|&gt;</span>. Exact names differ per model family.</p></div>`,
  code:`messages = [{"role": "system", "content": "You are helpful"},
            {"role": "user",   "content": "Hi"}]
ids = tokenizer.apply_chat_template(messages,
        add_generation_prompt=True)`},
 {t:"The embedding table",
  b:`<p>The embedding is a learned matrix <code>E</code> of shape <code>[V, d]</code>. Each token ID selects one row. Mathematically it's a one-hot vector times <code>E</code>; in code it's an array index, so it's essentially free.</p><p>The values start random. Training nudges them so tokens used in similar contexts end up with similar vectors. Nobody hand-designs a "sweetness" column like in the fruit example; meaning is spread across all <code>d</code> dimensions.</p><p>Click a token to see its row selected.</p>`,
  v:()=>`<div class="panel"><div class="row" id="emtok"></div><div id="emtab" style="margin-top:12px"></div></div><p class="cap">GPT-2 small: 50,257 × 768 ≈ 38.6M parameters in this one table. Many models reuse it, transposed, as the output layer (weight tying).</p>`,
  code:`E = torch.nn.Embedding(V, d)      # [V, d] learned
ids = torch.tensor([[40, 939, 6975]])
x = E(ids)                          # [1, 3, d]`,
  init:()=>{let sel=2;const toks=[["I",40],["␣am",939],["␣learning",6975],["␣artificial",21075]];const rows=[[0,"!"],[40,"I"],[939,"␣am"],[6975,"␣learning"],[21075,"␣artificial"],[50256,"<eot>"]];
   const val=(r,c)=>Math.sin(r*0.013+c*1.9)*0.6;
   const draw=()=>{$('#emtok').innerHTML=toks.map(([t,i],k)=>`<button class="btn ${k===sel?'on':''}" data-k="${k}">${t} · ${i}</button>`).join('');
    const id=toks[sel][1];$('#emtab').innerHTML=`<div class="scroll"><table class="matrix"><tr><th>row</th>${[0,1,2,3,4].map(c=>`<th>d${c}</th>`).join('')}<th>…</th></tr>${rows.map(([r,n],ri)=>`<tr><th>${r} ${n.replace(/</g,'&lt;')}</th>${[0,1,2,3,4].map(c=>`<td style="${r===id?heatCell(.6):'color:var(--muted)'}">${f2(val(r,c))}</td>`).join('')}<td style="color:var(--muted)">…</td></tr>${ri===0||ri===4?`<tr><th>⋮</th><td colspan="6" style="color:var(--muted);text-align:left">⋮</td></tr>`:''}`).join('')}</table></div>`;
    document.querySelectorAll('#emtok .btn').forEach(b=>b.onclick=()=>{sel=+b.dataset.k;draw()})};draw()}},
 {t:"What the geometry encodes",
  b:`<p>After training, distance and direction in embedding space carry meaning. Similar words cluster. Some relationships become consistent directions, which is why vector arithmetic like <code>king − man + woman ≈ queen</code> roughly works (the classic word2vec result).</p><p>Similarity is usually measured with cosine similarity, exactly what you computed for the fruits. This is also the core of semantic search and RAG: embed documents, embed the query, find the nearest vectors.</p>`,
  v:()=>`<div class="panel"><svg viewBox="0 0 420 240" width="100%" role="img" aria-label="Embedding space with parallel gender arrows and a fruit cluster"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
   <line x1="70" y1="170" x2="185" y2="170" stroke="var(--heat)" stroke-width="1.6" marker-end="url(#ah)"/><line x1="95" y1="60" x2="210" y2="60" stroke="var(--heat)" stroke-width="1.6" marker-end="url(#ah)"/>
   <line x1="72" y1="160" x2="92" y2="72" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
   ${[[70,170,'man'],[195,170,'woman'],[95,60,'king'],[220,60,'queen'],[320,140,'apple'],[352,168,'banana'],[300,178,'carrot']].map(([x,y,t])=>`<circle cx="${x}" cy="${y}" r="5" fill="${x>280?'var(--pos)':'var(--accent)'}"/><text class="lbl" x="${x}" y="${y+20}" text-anchor="middle">${t}</text>`).join('')}
   <text x="120" y="120">royalty</text><text x="110" y="190">same "gender" direction</text></svg></div><p class="cap">A 2D sketch. Real embeddings have hundreds to thousands of dimensions, and these clean directions are approximate.</p>`,
  code:`def cosine(a, b):
    return (a @ b) / (a.norm() * b.norm())
cosine(E[king] - E[man] + E[woman], E[queen])  # high`},
 {t:"Order matters: positional information",
  b:`<p>Attention compares every token with every other, but by itself it has no idea which came first. Without position, "dog bites man" and "man bites dog" produce the same set of vectors.</p><p>The original Transformer (2017) added a fixed pattern of sine and cosine waves to each embedding. Each dimension pair oscillates at a different frequency, so every position gets a unique fingerprint, and nearby positions look similar.</p>`,
  v:()=>`<div class="panel"><div class="hm" id="pehm" style="grid-template-columns:repeat(32,minmax(0,1fr))"></div><div class="legend" style="margin-top:10px"><span><i style="background:var(--pos)"></i>positive</span><span><i style="background:var(--neg)"></i>negative</span><span>rows: position 0–23 · columns: dims 0–31</span></div></div>`,
  code:`# PE[pos, 2i]   = sin(pos / 10000**(2i/d))
# PE[pos, 2i+1] = cos(pos / 10000**(2i/d))
x = token_embedding + PE[:n]`,
  init:()=>{let h='';for(let p=0;p<24;p++)for(let i=0;i<32;i++){const k=Math.floor(i/2),v=(i%2?Math.cos:Math.sin)(p/Math.pow(10000,2*k/32));h+=`<div style="${signCell(v)}"></div>`}$('#pehm').innerHTML=h}},
 {t:"RoPE: what modern models use",
  b:`<p>Most current open models (Llama, Mistral, Qwen and others) use <b>rotary position embeddings</b>. Nothing is added to the embedding. Instead, inside attention, each query and key vector is rotated by an angle proportional to its position.</p><p>The payoff: the dot product between a query at position <code>m</code> and a key at <code>n</code> depends only on <code>m − n</code>. The model sees relative distance for free. Move both sliders by the same amount and the angle between the arrows stays fixed.</p>`,
  v:()=>`<div class="panel"><svg viewBox="0 0 240 240" width="100%" style="max-width:300px;display:block;margin:0 auto" id="ropesvg" role="img" aria-label="Rotated query and key vectors"></svg>${slider('ropem','query pos m',0,12,1,2)}${slider('ropen','key pos n',0,12,1,5)}<p class="cap" id="ropecap" style="margin-top:8px"></p></div>`,
  code:`def rope(x, pos, theta=10000):
    # rotate each (x[2i], x[2i+1]) pair
    angle = pos / theta**(2*i/d)
    return rotate_pairs(x, angle)
q, k = rope(q, m), rope(k, n)   # then q·k as usual`,
  init:()=>{const draw=()=>{const m=st.rope.m,n=st.rope.n,th=0.45,cx=120,cy=120,R=90,a=m*th,b=n*th+0.3;
   const pt=ang=>[cx+R*Math.cos(ang),cy-R*Math.sin(ang)];const[qx,qy]=pt(a),[kx,ky]=pt(b);
   $('#ropesvg').innerHTML=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)"/><defs><marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><line x1="${cx}" y1="${cy}" x2="${qx}" y2="${qy}" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#ra)"/><line x1="${cx}" y1="${cy}" x2="${kx}" y2="${ky}" stroke="var(--heat)" stroke-width="2.5" marker-end="url(#ra)"/><text class="lbl" x="${cx+(qx-cx)*1.17}" y="${cy+(qy-cy)*1.17}" text-anchor="middle">q</text><text class="lbl" x="${cx+(kx-cx)*1.17}" y="${cy+(ky-cy)*1.17}" text-anchor="middle">k</text>`;
   $('#ropecap').textContent=`m − n = ${m-n}   ·   q·k = ${Math.cos(a-b).toFixed(3)} (depends only on the gap)`;$('#ropem-o').textContent=m;$('#ropen-o').textContent=n};
   $('#ropem').oninput=e=>{st.rope.m=+e.target.value;draw()};$('#ropen').oninput=e=>{st.rope.n=+e.target.value;draw()};$('#ropem').value=st.rope.m;$('#ropen').value=st.rope.n;draw()}},
 {t:"The input is now a matrix",
  b:`<p>Tokenize, look up embeddings, apply position. The output of this chapter is the <b>residual stream</b> <code>x</code>: one <code>d</code>-wide vector per token.</p><p>From here on, every layer reads from this stream and writes back into it. The shape never changes until the very end. That invariant is what lets you stack 32, 80 or 120 identical blocks.</p>`,
  v:()=>`<div class="panel">${TOK.map((t,i)=>`<div class="row" style="flex-wrap:nowrap;margin:4px 0"><span class="mono" style="width:96px;flex:0 0 auto">${vis(t)}</span><div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;flex:1">${Array.from({length:10},(_,k)=>`<div style="height:18px;border-radius:3px;${signCell(Math.sin(i*2.3+k*1.4)*0.9)}"></div>`).join('')}</div></div>`).join('')}<div class="shape" style="margin-top:12px">x : [1, 4, 4096]  ·  batch, tokens, d_model</div></div>`}
]},
{id:"attention",name:"Attention",slides:[
 {t:"The one idea: tokens read from each other",
  b:`<p>Embeddings give each token a context-free meaning. "Bank" has the same vector in "river bank" and "bank account". Attention fixes this: each token builds a new vector by pulling information from the other tokens that matter to it.</p><p>Think of it as a soft, differentiable database lookup. Each token issues a <b>query</b>. Every token advertises a <b>key</b>. The best-matching keys return their <b>values</b>, blended by how well they matched.</p><p>The next five slides compute this end to end on our 4-token sentence with real numbers.</p>`,
  v:()=>`<div class="panel"><svg viewBox="0 0 420 170" width="100%" role="img" aria-label="artificial attends to earlier tokens">${[[0.08,60],[0.12,150],[0.62,250]].map(([w,x])=>`<path d="M ${x} 120 Q ${(x+350)/2} ${120-(350-x)*0.42} 350 120" fill="none" stroke="var(--heat)" stroke-width="${(1+w*8).toFixed(1)}" stroke-opacity="${(0.35+w).toFixed(2)}"/>`).join('')}${TOK.map((t,i)=>{const x=[60,150,250,350][i];return `<rect x="${x-42}" y="124" width="84" height="30" rx="6" fill="${i===3?'var(--heat-soft)':'var(--surface)'}" stroke="${i===3?'var(--heat)':'var(--line)'}"/><text class="lbl" x="${x}" y="143" text-anchor="middle">${vis(t)}</text>`}).join('')}</svg><p class="cap">The query from "artificial" matches the key of "learning" best, so most of its new vector comes from "learning".</p></div>`},
 {t:"Step 1: project into Q, K, V",
  b:`<p>Three learned weight matrices turn every token vector into three new vectors. These are plain matrix multiplies, one per role.</p><ul><li><code>Q = x·Wq</code>: what am I looking for?</li><li><code>K = x·Wk</code>: what do I contain?</li><li><code>V = x·Wv</code>: what will I hand over if picked?</li></ul><p>Here <code>d_model = 4</code> and the head size <code>d_head = 3</code>. Real models use <code>d_head = 64</code> or <code>128</code>.</p>`,
  v:()=>`<div class="panel stack"><p class="cap">Q = X · Wq</p>${matTable(Q,TOK.map(vis),['q0','q1','q2'],v=>`<td style="${signCell(v)}">${f2(v)}</td>`)}<p class="cap">K = X · Wk</p>${matTable(K,TOK.map(vis),['k0','k1','k2'],v=>`<td style="${signCell(v)}">${f2(v)}</td>`)}<p class="cap">V = X · Wv</p>${matTable(V,TOK.map(vis),['v0','v1','v2'],v=>`<td style="${signCell(v)}">${f2(v)}</td>`)}</div>`,
  code:`Wq = nn.Linear(d_model, d_head, bias=False)
q, k, v = Wq(x), Wk(x), Wv(x)    # each [B, n, d_head]`},
 {t:"Step 2: score every pair",
  b:`<p>Dot every query with every key: <code>S = Q·Kᵀ</code>, an <code>n × n</code> matrix. Row <i>i</i> says how relevant each token is to token <i>i</i>.</p><p>Then divide by <code>√d_head</code>. Dot products of long vectors grow large, which pushes softmax into a near one-hot regime where gradients vanish. Scaling keeps the scores in a trainable range.</p><p>This <code>n × n</code> matrix is why attention costs <code>O(n²)</code> in sequence length.</p>`,
  v:()=>`<div class="panel"><p class="cap" style="margin-bottom:8px">S = Q·Kᵀ / √3   (rows = queries, columns = keys)</p>${matTable(S,TOK.map(vis),TOK.map(vis),v=>`<td style="${signCell(v/1.5)}">${f2(v)}</td>`)}</div>`,
  code:`scores = q @ k.transpose(-2, -1)       # [B, n, n]
scores = scores / math.sqrt(d_head)`},
 {t:"Step 3: the causal mask",
  b:`<p>A decoder-only LLM (GPT, Claude, Llama) is trained to predict the next token, so a position must not peek at the future. Every score above the diagonal is set to <code>−∞</code>, which becomes exactly 0 after softmax.</p><p>This mask is the reason a whole training sequence can be processed in parallel: position 3 learns to predict token 4 using only tokens 1–3, all in one pass.</p><p>Encoder models like BERT skip the mask and look both ways. Toggle it to compare.</p>`,
  v:()=>`<div class="panel"><div class="row" style="margin-bottom:12px"><button class="btn" id="mk1">Causal (GPT-style)</button><button class="btn" id="mk0">Bidirectional (BERT-style)</button></div><div id="mkt"></div></div>`,
  code:`mask = torch.triu(torch.ones(n, n), diagonal=1).bool()
scores = scores.masked_fill(mask, float("-inf"))`,
  init:()=>{const draw=()=>{$('#mk1').classList.toggle('on',st.causal);$('#mk0').classList.toggle('on',!st.causal);$('#mkt').innerHTML=matTable(masked(),TOK.map(vis),TOK.map(vis),v=>v===-Infinity?`<td style="background:var(--surface);color:var(--muted)">−∞</td>`:`<td style="${signCell(v/1.5)}">${f2(v)}</td>`)};$('#mk1').onclick=()=>{st.causal=true;draw()};$('#mk0').onclick=()=>{st.causal=false;draw()};draw()}},
 {t:"Step 4: softmax, then blend the values",
  b:`<p>Softmax each row so it becomes a probability distribution summing to 1. These are the attention weights.</p><p>The output for token <i>i</i> is the weighted sum of all value vectors: <code>out = softmax(S)·V</code>. Each token now carries information pulled from its context.</p><p>Pick a query row to see where it looks and what it gets back.</p>`,
  v:()=>`<div class="panel"><div class="row" id="qsel" style="margin-bottom:12px"></div><div id="wt"></div><div id="wbars" style="margin-top:12px"></div><div class="shape" id="wout"></div></div>`,
  code:`weights = scores.softmax(dim=-1)   # rows sum to 1
out = weights @ v                  # [B, n, d_head]`,
  init:()=>{const draw=()=>{const W=weights();$('#qsel').innerHTML=TOK.map((t,i)=>`<button class="btn ${i===st.qrow?'on':''}" data-q="${i}">${vis(t)}</button>`).join('');
   $('#wt').innerHTML=matTable(W,TOK.map(vis),TOK.map(vis),(v,i)=>`<td style="${heatCell(v)};${i===st.qrow?'outline:1.5px solid var(--accent)':'opacity:.55'}">${f2(v)}</td>`);
   const r=W[st.qrow];$('#wbars').innerHTML=r.map((w,j)=>`<div class="bar"><span>${vis(TOK[j])}</span><div class="t"><i style="width:${w*100}%;background:var(--heat)"></i></div><span>${(w*100).toFixed(0)}%</span></div>`).join('');
   const o=V[0].map((_,c)=>r.reduce((s,w,j)=>s+w*V[j][c],0));$('#wout').textContent=`out[${vis(TOK[st.qrow])}] = [${o.map(f2).join(', ')}]`;
   document.querySelectorAll('#qsel .btn').forEach(b=>b.onclick=()=>{st.qrow=+b.dataset.q;draw()})};draw()}},
 {t:"Multi-head attention",
  b:`<p>One attention pattern can't capture everything at once: syntax, coreference, the previous word. So the model runs <code>h</code> heads in parallel, each with its own <code>Wq, Wk, Wv</code> and a smaller <code>d_head = d_model / h</code>. The outputs are concatenated and mixed by an output matrix <code>Wo</code>.</p><p>Interpretability research finds heads that specialise. The patterns here are illustrative of common ones. The "first token" pattern is real and has a name: an <b>attention sink</b>, where heads park weight when nothing else is relevant.</p>`,
  v:()=>`<div class="panel"><div class="row" id="hsel" style="margin-bottom:12px"></div><div id="hmat"></div><p class="cap" id="hcap" style="margin-top:10px"></p></div>`,
  code:`# d_model=4096, h=32  ->  d_head=128
q = q.view(B, n, h, d_head).transpose(1, 2)  # [B, h, n, d_head]
out = attention(q, k, v)                     # per head
out = out.transpose(1, 2).reshape(B, n, d_model)
out = Wo(out)`,
  init:()=>{const L=["<s>","I","␣am","␣learning","␣artificial","␣intellig."];const n=6;
   const mk=f=>Array.from({length:n},(_,i)=>{const r=Array.from({length:n},(_,j)=>j>i?0:f(i,j)+0.04);const s=r.reduce((a,b)=>a+b,0);return r.map(x=>x/s)});
   const H=[["Previous token",mk((i,j)=>j===i-1?1:0),"Each token looks at the one right before it. Builds n-gram-like features."],["Attention sink",mk((i,j)=>j===0?1:0),"Weight parks on the first token when nothing else is useful."],["Self / local",mk((i,j)=>j===i?0.8:i-j===1?0.3:0),"Stays close to itself and its neighbour."],["Semantic",mk((i,j)=>(i===5&&j===4)?1:(i===4&&j===3)?0.9:(i===3&&j===1)?0.6:j===i?0.2:0),"\"intellig.\" reads \"artificial\"; \"artificial\" reads \"learning\"."]];
   const draw=()=>{$('#hsel').innerHTML=H.map((h,i)=>`<button class="btn ${i===st.head?'on':''}" data-h="${i}">Head ${i+1}</button>`).join('');const[nm,M,c]=H[st.head];$('#hmat').innerHTML=matTable(M,L,L,(v,i,j)=>j>i?`<td style="background:var(--surface)"></td>`:`<td style="${heatCell(v)}">${v>0.05?f2(v):''}</td>`);$('#hcap').innerHTML=`<b style="font-weight:500;color:var(--ink)">${nm}.</b> ${c}`;document.querySelectorAll('#hsel .btn').forEach(b=>b.onclick=()=>{st.head=+b.dataset.h;draw()})};draw()}},
 {t:"The cost of attention, and the fixes",
  b:`<p>The score matrix has <code>n²</code> entries per head per layer. Double the context, quadruple the work. Drag the slider to feel it.</p><ul><li><b>FlashAttention</b> computes the exact same result in tiles that fit in fast on-chip memory, never materialising the full matrix. Same maths, far less memory traffic.</li><li><b>Grouped-query attention (GQA)</b>: many query heads share fewer key/value heads, shrinking the KV cache.</li><li><b>Sliding-window</b> and sparse variants limit how far back some layers look.</li></ul>`,
  v:()=>`<div class="panel">${slider('ncx','context n',1,8,1,3,v=>[1024,2048,4096,8192,16384,32768,131072,1048576][v-1].toLocaleString())}<div class="stat" style="margin-top:12px"><div><b id="nsq">0</b><span>scores per head per layer</span></div><div><b id="nmb">0</b><span>naive fp16 score matrix, 32 heads</span></div></div><p class="cap" style="margin-top:10px">Naive memory for one layer's scores. FlashAttention avoids storing this at all.</p></div>`,
  code:`# PyTorch picks a fused kernel (e.g. FlashAttention) when it can
out = F.scaled_dot_product_attention(q, k, v, is_causal=True)`,
  init:()=>{const ns=[1024,2048,4096,8192,16384,32768,131072,1048576];const draw=v=>{const n=ns[v-1];$('#ncx-o').textContent=n.toLocaleString();$('#nsq').textContent=human(n*n);$('#nmb').textContent=bytes(n*n*2*32)};$('#ncx').oninput=e=>draw(+e.target.value);draw(3)}}
]},
{id:"block",name:"The transformer block",slides:[
 {t:"The residual stream",
  b:`<p>The single most useful mental model for a transformer: a wide <b>stream</b> of vectors flows from the bottom to the top. Each sublayer reads from it and <b>adds</b> its result back. Nothing overwrites; everything accumulates.</p><p>Residual connections (<code>x = x + f(x)</code>) also give gradients a straight highway back to the early layers, which is what makes training 100-layer networks possible at all.</p>`,
  v:()=>`<div class="panel"><svg viewBox="0 0 360 300" width="100%" style="max-width:420px;display:block;margin:0 auto" role="img" aria-label="Residual stream with attention and MLP adding into it"><defs><marker id="rs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
   <line x1="90" y1="285" x2="90" y2="18" stroke="var(--accent)" stroke-width="6" stroke-opacity=".35"/><line x1="90" y1="285" x2="90" y2="16" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#rs)"/>
   ${[[200,"Attention","norm → attn"],[95,"MLP","norm → mlp"]].map(([y,a,b])=>`<path d="M 90 ${y+30} L 170 ${y+30}" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#rs)"/><rect x="172" y="${y+8}" width="150" height="44" rx="8" fill="var(--surface)" stroke="var(--line)"/><text class="lbl" x="247" y="${y+27}" text-anchor="middle">${a}</text><text x="247" y="${y+43}" text-anchor="middle">${b}</text><path d="M 247 ${y+8} L 247 ${y-6} L 104 ${y-6}" fill="none" stroke="var(--heat)" stroke-width="1.4" marker-end="url(#rs)"/><circle cx="90" cy="${y-6}" r="9" fill="var(--surface)" stroke="var(--heat)"/><text class="lbl" x="90" y="${y-2}" text-anchor="middle">+</text>`).join('')}
   <text x="20" y="290">x in</text><text x="20" y="22">x out</text></svg></div>`,
  code:`class Block(nn.Module):
    def forward(self, x):
        x = x + self.attn(self.norm1(x))   # read, write back
        x = x + self.mlp(self.norm2(x))
        return x`},
 {t:"Normalisation: LayerNorm and RMSNorm",
  b:`<p>Before each sublayer the vector is normalised so its scale stays stable no matter how much has piled into the stream. This is "pre-norm", the standard in modern LLMs.</p><ul><li><b>LayerNorm</b>: subtract the mean, divide by the standard deviation, then apply a learned scale and shift.</li><li><b>RMSNorm</b>: skip the mean, just divide by the root-mean-square. Cheaper, works as well, used by Llama-family models.</li></ul><p>Scale the input up 10× and watch the output stay the same.</p>`,
  v:()=>`<div class="panel"><div class="row" style="margin-bottom:12px"><button class="btn" id="rs1">Input ×1</button><button class="btn" id="rs10">Input ×10</button></div><div id="rsb"></div></div>`,
  code:`def rms_norm(x, gamma, eps=1e-6):
    rms = x.pow(2).mean(-1, keepdim=True).add(eps).sqrt()
    return x / rms * gamma`,
  init:()=>{const base=[3.2,-1.1,0.4,5.0,-2.6,0.9];const draw=()=>{const x=base.map(v=>v*st.rmsScale),r=Math.sqrt(x.reduce((s,v)=>s+v*v,0)/x.length),y=x.map(v=>v/r);$('#rs1').classList.toggle('on',st.rmsScale===1);$('#rs10').classList.toggle('on',st.rmsScale===10);
   const bars=(a,mx)=>a.map(v=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:center;height:16px;margin:3px 0"><div style="display:flex;justify-content:flex-end">${v<0?`<i style="display:block;height:12px;width:${Math.abs(v)/mx*100}%;background:var(--neg);border-radius:3px 0 0 3px"></i>`:''}</div><div>${v>=0?`<i style="display:block;height:12px;width:${v/mx*100}%;background:var(--pos);border-radius:0 3px 3px 0"></i>`:''}</div></div>`).join('');
   $('#rsb').innerHTML=`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px"><div><p class="cap">input x · rms = ${r.toFixed(1)}</p>${bars(x,55)}</div><div><p class="cap">rms_norm(x)</p>${bars(y,2)}</div></div>`};
   $('#rs1').onclick=()=>{st.rmsScale=1;draw()};$('#rs10').onclick=()=>{st.rmsScale=10;draw()};draw()}},
 {t:"The MLP: where most parameters live",
  b:`<p>Attention moves information <i>between</i> tokens. The MLP (feed-forward network) processes each token <i>on its own</i>: expand to a wider hidden size (typically ~4×), apply a nonlinearity, project back down.</p><p>Roughly two-thirds of a model's parameters sit here. Research suggests MLPs act partly like key-value memories storing facts ("Paris → France").</p><p>Without the nonlinearity, every layer would collapse into a single linear map. Modern models use smooth activations like GELU or SiLU, often in a gated form called <b>SwiGLU</b>.</p>`,
  v:()=>`<div class="panel"><div class="row" id="actsel" style="margin-bottom:10px"></div><svg viewBox="0 0 400 220" width="100%" id="actsvg" role="img" aria-label="Activation function curves"></svg><div class="legend" id="actleg"></div></div>`,
  code:`class SwiGLU(nn.Module):        # Llama-style MLP
    def forward(self, x):          # x: [B, n, d]
        h = F.silu(self.w1(x)) * self.w3(x)   # [B, n, ~2.7d]
        return self.w2(h)                     # back to [B, n, d]`,
  init:()=>{const F={ReLU:x=>Math.max(0,x),GELU:x=>0.5*x*(1+Math.tanh(0.7978845608*(x+0.044715*x**3))),SiLU:x=>x/(1+Math.exp(-x))};const C={ReLU:'var(--muted)',GELU:'var(--accent)',SiLU:'var(--heat)'};
   const sx=x=>40+(x+4)/8*340,sy=y=>180-(y+1)/5*160;
   const draw=()=>{$('#actsel').innerHTML=['all','ReLU','GELU','SiLU'].map(k=>`<button class="btn ${st.act===k?'on':''}" data-a="${k}">${k==='all'?'All':k}</button>`).join('');
    let s=`<line x1="40" y1="${sy(0)}" x2="380" y2="${sy(0)}" stroke="var(--line)"/><line x1="${sx(0)}" y1="20" x2="${sx(0)}" y2="180" stroke="var(--line)"/>`;[-4,-2,0,2,4].forEach(t=>s+=`<text x="${sx(t)}" y="198" text-anchor="middle">${t}</text>`);[0,2,4].forEach(t=>s+=`<text x="32" y="${sy(t)+4}" text-anchor="end">${t}</text>`);
    Object.keys(F).forEach(k=>{if(st.act!=='all'&&st.act!==k)return;let d='';for(let i=0;i<=80;i++){const x=-4+i*0.1;d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(F[k](x)).toFixed(1)}s+=`<path d="${d}" fill="none" stroke="${C[k]}" stroke-width="2.2"/>`});
    $('#actsvg').innerHTML=s;$('#actleg').innerHTML=Object.keys(F).map(k=>`<span><i style="background:${C[k]}"></i>${k}</span>`).join('');document.querySelectorAll('#actsel .btn').forEach(b=>b.onclick=()=>{st.act=b.dataset.a;draw()})};draw()}},
 {t:"Count the parameters yourself",
  b:`<p>Per block: attention has 4 matrices of <code>d × d</code> (Q, K, V, O) = <code>4d²</code>. A 4× MLP has two of <code>d × 4d</code> = <code>8d²</code>. So roughly <code>12d²</code> per layer, plus the embedding table <code>V × d</code>.</p><p>Memory to just hold the weights is parameters × bytes per parameter: 2 bytes in fp16/bf16, 1 in int8, 0.5 in 4-bit quantised formats. That's why quantisation lets big models run on small GPUs.</p><p>Try the presets, then move the sliders.</p>`,
  v:()=>`<div class="panel"><div class="row" style="margin-bottom:12px"><button class="btn" data-p="0">GPT-2 small</button><button class="btn" data-p="1">7B-class</button><button class="btn" data-p="2">70B-class</button></div>${slider('pcd','d_model',0,6,1,0,v=>v)}${slider('pcl','layers N',2,120,1,12)}${slider('pcv','vocab V',0,4,1,1,v=>v)}<div class="stat" style="margin-top:12px"><div><b id="pcp">0</b><span>parameters ≈ 12·N·d² + V·d</span></div><div><b id="pcm">0</b><span>weights in bf16 (4-bit: <span id="pcq"></span>)</span></div></div></div>`,
  code:`params = sum(p.numel() for p in model.parameters())
# 7B params * 2 bytes = ~14 GB just to load in bf16`,
  init:()=>{const D=[768,1024,2048,4096,5120,8192,12288],Vv=[32000,50257,100000,128256,256000];const P=[[0,12,1],[3,32,0],[5,80,3]];
   const draw=()=>{const d=D[st.pc.di],L=st.pc.L,V=Vv[st.pc.vi],p=12*L*d*d+V*d;$('#pcd-o').textContent=d;$('#pcl-o').textContent=L;$('#pcv-o').textContent=human(V);$('#pcp').textContent=human(p);$('#pcm').textContent=bytes(p*2);$('#pcq').textContent=bytes(p*0.5);$('#pcd').value=st.pc.di;$('#pcl').value=L;$('#pcv').value=st.pc.vi};
   if(st.pc.di===undefined){st.pc={di:0,L:12,vi:1}}
   $('#pcd').oninput=e=>{st.pc.di=+e.target.value;draw()};$('#pcl').oninput=e=>{st.pc.L=+e.target.value;draw()};$('#pcv').oninput=e=>{st.pc.vi=+e.target.value;draw()};
   document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const[a,l,v]=P[+b.dataset.p];st.pc={di:a,L:l,vi:v};draw()});draw()}},
 {t:"Stack it N times",
  b:`<p>A model is just the same block repeated, each with its own weights. Early layers tend to handle local syntax and surface features; middle layers build more abstract representations; late layers shape the prediction. These are tendencies from interpretability work, not hard boundaries.</p><p>Because the shape stays <code>[B, n, d]</code>, depth is a single config number. Width (<code>d</code>), depth (<code>N</code>), and heads (<code>h</code>) are the main dials.</p>`,
  v:()=>`<div class="panel stack">${[["Final norm → unembed","[B, n, V]"],["Block 32","prediction-shaping"],["⋮",""],["Block 16","abstract features"],["⋮",""],["Block 2","local syntax"],["Block 1","token-level patterns"],["Embed + position","[B, n, d]"]].map(([a,b],i)=>`<div class="stage ${i===0||i===7?'':'cur'}" style="${a==='⋮'?'background:transparent;border:0;box-shadow:none;padding:0 12px':''}"><span>${a}</span><span class="mono">${b}</span></div>`).join('')}</div>`,
  code:`class LLM(nn.Module):
    def __init__(self, cfg):
        self.embed  = nn.Embedding(cfg.V, cfg.d)
        self.blocks = nn.ModuleList(Block(cfg) for _ in range(cfg.N))
        self.norm   = RMSNorm(cfg.d)
        self.head   = nn.Linear(cfg.d, cfg.V, bias=False)`},
 {t:"Mixture of experts",
  b:`<p>Many frontier models swap the single MLP for a set of <b>experts</b>: several separate MLPs plus a small <b>router</b> that picks the top-k (often 1–2, sometimes 8 out of many more) for each token.</p><p>Total parameters grow a lot, but each token only runs through a few experts, so compute per token stays modest. The trade-offs: all experts still have to sit in memory, and the router needs balancing so it doesn't overload a few favourites.</p><p>Route a new token to see different experts light up.</p>`,
  v:()=>`<div class="panel"><div class="row" id="moet" style="margin-bottom:12px"></div><div id="moeg" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px"></div><p class="cap" style="margin-top:12px" id="moec"></p></div>`,
  code:`gate = router(x).softmax(-1)              # [B, n, n_experts]
w, idx = gate.topk(2, dim=-1)
out = sum(w[..., i] * experts[idx[..., i]](x) for i in range(2))`,
  init:()=>{const toks=["␣learning","␣artificial","␣Paris","␣def","3.14","␣because"];let t=0;const route=k=>{const a=(k*5+1)%8,b=(k*3+4)%8;return[a,b===a?(b+1)%8:b]};
   const draw=()=>{const[a,b]=route(t);$('#moet').innerHTML=toks.map((x,i)=>`<button class="btn ${i===t?'on':''}" data-t="${i}">${x}</button>`).join('');$('#moeg').innerHTML=Array.from({length:8},(_,i)=>`<div style="border-radius:8px;padding:10px 6px;text-align:center;font-family:var(--f-mono);font-size:12px;border:1px solid ${i===a||i===b?'var(--heat)':'var(--line)'};background:${i===a||i===b?'var(--heat-soft)':'var(--surface)'};color:${i===a||i===b?'var(--ink)':'var(--muted)'}">expert ${i}${i===a?'<br>w 0.71':i===b?'<br>w 0.29':'<br>idle'}</div>`).join('');$('#moec').textContent=`2 of 8 experts active: 25% of MLP compute per token, 100% of MLP weights in memory.`;document.querySelectorAll('#moet .btn').forEach(x=>x.onclick=()=>{t=+x.dataset.t;draw()})};draw()}}
]},
{id:"output",name:"Output & inference",slides:[
 {t:"From vectors to logits",
  b:`<p>After the last block and a final norm, each position's vector is multiplied by the unembedding matrix <code>[d, V]</code>. Out comes one raw score, a <b>logit</b>, for every token in the vocabulary.</p><p>At inference only the last position is needed. During training every position's logits are used, each predicting the token that follows it.</p><p>Logits are unbounded and can be negative. Higher means "more likely next".</p>`,
  v:()=>`<div class="panel"><p class="cap" style="margin-bottom:8px">logits after "I am learning artificial" (top 8 of ~128,000)</p><div id="lgt"></div></div>`,
  code:`h = norm(x)[:, -1, :]          # last position: [B, d]
logits = h @ W_unembed         # [B, V]`,
  init:()=>{$('#lgt').innerHTML=CANDS.map(([w,l])=>`<div class="bar"><span>${w}</span><div class="t"><i style="width:${Math.max(0,l/8*100)}%"></i></div><span>${l.toFixed(1)}</span></div>`).join('')}},
 {t:"Softmax and temperature",
  b:`<p>Softmax turns logits into probabilities: <code>p = exp(z / T) / Σ exp(z / T)</code>.</p><p><b>Temperature</b> <code>T</code> divides the logits first.</p><ul><li><code>T → 0</code>: the top token takes everything. Deterministic, repetitive.</li><li><code>T = 1</code>: the distribution the model actually learned.</li><li><code>T &gt; 1</code>: flatter, more surprising, more mistakes.</li></ul>`,
  v:()=>`<div class="panel">${slider('tmp','temperature T',0.1,2.5,0.05,1,v=>(+v).toFixed(2))}<div id="tmpb" style="margin-top:12px"></div></div>`,
  code:`probs = (logits / T).softmax(-1)
next_id = probs.argmax()            # greedy, same as T -> 0`,
  init:()=>{const draw=()=>{const p=sm(CANDS.map(c=>c[1]/st.temp));$('#tmp-o').textContent=st.temp.toFixed(2);$('#tmpb').innerHTML=CANDS.map(([w],i)=>`<div class="bar"><span>${w}</span><div class="t"><i style="width:${p[i]*100}%"></i></div><span>${(p[i]*100).toFixed(1)}%</span></div>`).join('')};$('#tmp').value=st.temp;$('#tmp').oninput=e=>{st.temp=+e.target.value;draw()};draw()}},
 {t:"Sampling strategies",
  b:`<p>After temperature, the long tail is usually trimmed before drawing a random token.</p><ul><li><b>Top-k</b>: keep only the k most likely tokens.</li><li><b>Top-p</b> (nucleus): keep the smallest set whose probabilities add up to p. Adapts to how confident the model is.</li><li><b>Greedy</b>: always take the top token (top-k = 1).</li></ul><p>Renormalise what's left, then sample. Hit sample a few times.</p>`,
  v:()=>`<div class="panel">${slider('tk','top-k',1,8,1,8)}${slider('tpp','top-p',0.3,1,0.05,1,v=>(+v).toFixed(2))}<div id="spb" style="margin-top:12px"></div><div class="row" style="margin-top:12px"><button class="btn on" id="spgo">Sample 10 tokens</button></div><div class="row" id="spout" style="margin-top:10px"></div></div>`,
  code:`probs = (logits / T).softmax(-1)
probs = top_k(probs, k)      # zero all but k largest
probs = top_p(probs, p)      # keep smallest set with sum >= p
next_id = torch.multinomial(probs / probs.sum(), 1)`,
  init:()=>{const keep=()=>{const p=sm(CANDS.map(c=>c[1]));let cum=0;return p.map((v,i)=>{const ok=i<st.topk&&cum<st.topp-1e-9;cum+=v;return ok?v:0})};
   const draw=()=>{const k=keep(),s=k.reduce((a,b)=>a+b,0);$('#tk-o').textContent=st.topk;$('#tpp-o').textContent=st.topp.toFixed(2);$('#spb').innerHTML=CANDS.map(([w],i)=>`<div class="bar"><span style="${k[i]?'':'color:var(--muted);text-decoration:line-through'}">${w}</span><div class="t"><i class="${k[i]?'':'off'}" style="width:${(k[i]?k[i]/s:sm(CANDS.map(c=>c[1]))[i])*100}%"></i></div><span>${k[i]?(k[i]/s*100).toFixed(1)+'%':'cut'}</span></div>`).join('')};
   $('#tk').value=st.topk;$('#tpp').value=st.topp;$('#tk').oninput=e=>{st.topk=+e.target.value;draw()};$('#tpp').oninput=e=>{st.topp=+e.target.value;draw()};
   $('#spgo').onclick=()=>{const k=keep(),s=k.reduce((a,b)=>a+b,0),out=[];for(let n=0;n<10;n++){let r=Math.random()*s,i=0;while(i<k.length-1&&r>k[i]){r-=k[i];i++}out.push(CANDS[i][0])}$('#spout').innerHTML=out.map(w=>`<span class="chip">${w}</span>`).join('')};draw()}},
 {t:"The KV cache",
  b:`<p>During decoding, the keys and values of earlier tokens never change, because the causal mask means they can't see later tokens. So instead of recomputing them every step, they're stored. Each new step only computes Q, K, V for the one new token and attends over the cache.</p><p>This turns each decode step from <code>O(n²)</code> into <code>O(n)</code> work, but the cache costs memory per token, per layer. For long contexts it often exceeds the model weights themselves. GQA (fewer KV heads) and quantised caches exist to shrink it.</p>`,
  v:()=>`<div class="panel">${slider('kvl','layers',8,96,4,32)}${slider('kvh','KV heads',1,64,1,8)}${slider('kvd','head dim',64,256,64,128)}${slider('kvn','context tokens',0,6,1,3,v=>v)}<div class="stat" style="margin-top:12px"><div><b id="kvt">0</b><span>per token</span></div><div><b id="kva">0</b><span>whole context, bf16, batch 1</span></div></div><p class="cap" style="margin-top:10px">size = 2 (K and V) × layers × kv_heads × head_dim × tokens × 2 bytes. Defaults match a typical 8B model with GQA.</p></div>`,
  code:`# decode step with cache
q, k, v = proj(x_new)                 # only the new token
cache_k = torch.cat([cache_k, k], dim=2)
cache_v = torch.cat([cache_v, v], dim=2)
out = attention(q, cache_k, cache_v)`,
  init:()=>{const N=[1024,4096,8192,32768,131072,200000,1000000];if(st.kv.ni===undefined)st.kv.ni=2;
   const draw=()=>{const{L,h,dh}=st.kv,n=N[st.kv.ni],per=2*L*h*dh*2;$('#kvl-o').textContent=L;$('#kvh-o').textContent=h;$('#kvd-o').textContent=dh;$('#kvn-o').textContent=n.toLocaleString();$('#kvt').textContent=bytes(per);$('#kva').textContent=bytes(per*n)};
   $('#kvl').value=st.kv.L;$('#kvh').value=st.kv.h;$('#kvd').value=st.kv.dh;$('#kvn').value=st.kv.ni;
   $('#kvl').oninput=e=>{st.kv.L=+e.target.value;draw()};$('#kvh').oninput=e=>{st.kv.h=+e.target.value;draw()};$('#kvd').oninput=e=>{st.kv.dh=+e.target.value;draw()};$('#kvn').oninput=e=>{st.kv.ni=+e.target.value;draw()};draw()}},
 {t:"What the context window really is",
  b:`<p>The context window is the maximum sequence length <code>n</code> the model was trained (or extended) to handle. Everything the model "knows" about your conversation must fit in it: system prompt, history, documents, tool results, and its own output so far.</p><ul><li>There's no hidden memory between calls. Chat apps resend the history every turn.</li><li>Cost and latency scale with context, through both attention and the KV cache.</li><li>Prompt caching reuses the KV cache of an unchanged prefix across requests, which is why stable system prompts are cheaper.</li></ul><p>For an engineer, the useful framing: the model is stateless; the context is the entire state.</p>`,
  v:()=>`<div class="panel stack">${[["System prompt","cached prefix",22],["Conversation history","grows each turn",38],["Retrieved docs / tool output","often the biggest",28],["Model's reply so far","generated",12]].map(([a,b,w])=>`<div><div class="row" style="justify-content:space-between;font-size:13px"><span>${a}</span><span class="mono" style="color:var(--muted)">${b}</span></div><div style="height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:4px"><i style="display:block;height:100%;width:${w}%;background:var(--accent)"></i></div></div>`).join('')}<p class="cap">All of it is one token sequence. Illustrative proportions.</p></div>`}
]},
{id:"training",name:"Training",slides:[
 {t:"The objective: predict the next token",
  b:`<p>Pretraining has one goal. Take a chunk of text, shift it by one position, and at every position predict the following token.</p><p>Thanks to the causal mask, a 4,096-token sequence gives 4,096 training examples in a single forward pass. No labels are needed; the text labels itself. That's what lets training scale to trillions of tokens.</p>`,
  v:()=>`<div class="panel"><div class="scroll"><table class="matrix"><tr><th>input</th>${["I","␣am","␣learning","␣artificial"].map(t=>`<td style="background:var(--accent-soft);color:var(--accent-ink)">${t}</td>`).join('')}</tr><tr><th>target</th>${["␣am","␣learning","␣artificial","␣intelligence"].map(t=>`<td style="${heatCell(.45)}">${t}</td>`).join('')}</tr></table></div><p class="cap" style="margin-top:10px">One sequence, four predictions, one pass.</p></div>`,
  code:`ids = tokenize(text)                    # [n+1]
inputs, targets = ids[:-1], ids[1:]     # shift by one
logits = model(inputs)                  # [n, V]`},
 {t:"Cross-entropy loss",
  b:`<p>The loss at each position is <code>−log p(correct token)</code>, averaged across all positions.</p><ul><li>Correct token got 90%: loss 0.11. Small.</li><li>Correct token got 1%: loss 4.6. Big.</li></ul><p>It punishes confident wrong answers hard. A model that guesses uniformly over a 50k vocab scores <code>log(50,000) ≈ 10.8</code>; well-trained models reach around 2 or lower on typical web text. <b>Perplexity</b> is <code>e^loss</code>: roughly "how many tokens the model is torn between".</p>`,
  v:()=>`<div class="panel">${slider('ce','p(correct)',0.01,1,0.01,0.25,v=>(+v).toFixed(2))}<svg viewBox="0 0 400 200" width="100%" id="cesvg" role="img" aria-label="Loss curve minus log p"></svg><div class="stat"><div><b id="cel">0</b><span>loss = −ln p</span></div><div><b id="cep">0</b><span>perplexity = e^loss</span></div></div></div>`,
  code:`loss = F.cross_entropy(logits.view(-1, V), targets.view(-1))`,
  init:()=>{const sx=p=>40+p*340,sy=l=>170-Math.min(l,5)/5*150;const draw=()=>{const p=st.pce,l=-Math.log(p);let d='';for(let i=1;i<=100;i++){const q=i/100;d+=(i>1?'L':'M')+sx(q).toFixed(1)+' '+sy(-Math.log(q)).toFixed(1)}
   $('#cesvg').innerHTML=`<line x1="40" y1="170" x2="380" y2="170" stroke="var(--line)"/><line x1="40" y1="20" x2="40" y2="170" stroke="var(--line)"/>${[0,0.5,1].map(t=>`<text x="${sx(t)}" y="188" text-anchor="middle">${t}</text>`).join('')}${[0,2.5,5].map(t=>`<text x="32" y="${sy(t)+4}" text-anchor="end">${t}</text>`).join('')}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${sx(p)}" cy="${sy(l)}" r="6" fill="var(--heat)"/>`;
   $('#ce-o').textContent=p.toFixed(2);$('#cel').textContent=l.toFixed(2);$('#cep').textContent=Math.exp(l).toFixed(1)};$('#ce').value=st.pce;$('#ce').oninput=e=>{st.pce=+e.target.value;draw()};draw()}},
 {t:"Backprop and gradient descent",
  b:`<p>Backpropagation computes, for every one of the billions of weights, how much the loss would change if that weight moved a little: the <b>gradient</b>. It's the chain rule applied mechanically backwards through the graph; frameworks do it automatically.</p><p>Gradient descent then steps every weight a little downhill: <code>w ← w − lr · grad</code>. The learning rate is the critical knob. Too small and training crawls; too big and it overshoots and diverges.</p><p>Try lr 0.1, then 0.9, then 1.05.</p>`,
  v:()=>`<div class="panel">${slider('lr','learning rate',0.05,1.1,0.05,0.3,v=>(+v).toFixed(2))}<svg viewBox="0 0 400 210" width="100%" id="gdsvg" role="img" aria-label="Loss bowl with descent steps"></svg><div class="row"><button class="btn on" id="gdstep">Take a step</button><button class="btn" id="gdrst">Reset</button><span class="cap" id="gdcap"></span></div></div>`,
  code:`loss.backward()                  # fills p.grad for every weight
with torch.no_grad():
    for p in model.parameters():
        p -= lr * p.grad         # real code: optimizer.step()
model.zero_grad()`,
  init:()=>{const f=w=>(w-3)**2,sx=w=>40+(w+2)/10*340,sy=l=>185-Math.min(l,30)/30*165;const draw=()=>{let d='';for(let i=0;i<=100;i++){const w=-2+i*0.1;d+=(i?'L':'M')+sx(w).toFixed(1)+' '+sy(f(w)).toFixed(1)}
   const pts=st.path.filter(w=>w>-2.5&&w<8.5);let s=`<line x1="40" y1="185" x2="380" y2="185" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="${sx(3)}" y="202" text-anchor="middle">min</text>`;
   for(let i=1;i<pts.length;i++)s+=`<line x1="${sx(pts[i-1])}" y1="${sy(f(pts[i-1]))}" x2="${sx(pts[i])}" y2="${sy(f(pts[i]))}" stroke="var(--heat)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
   pts.forEach((w,i)=>s+=`<circle cx="${sx(w)}" cy="${sy(f(w))}" r="${i===pts.length-1?6:3}" fill="var(--heat)"/>`);$('#gdsvg').innerHTML=s;
   const w=st.path[st.path.length-1];$('#gdcap').textContent=`step ${st.path.length-1} · loss ${f(w)>999?'diverged':f(w).toFixed(3)}`;$('#lr-o').textContent=st.lr.toFixed(2)};
   $('#lr').value=st.lr;$('#lr').oninput=e=>{st.lr=+e.target.value;st.path=[-1];draw()};$('#gdstep').onclick=()=>{const w=st.path[st.path.length-1];st.path.push(w-st.lr*2*(w-3));draw()};$('#gdrst').onclick=()=>{st.path=[-1];draw()};draw()}},
 {t:"The real training loop",
  b:`<p>In practice it's the same loop, wrapped in serious engineering:</p><ul><li><b>AdamW</b> optimiser: per-weight adaptive step sizes with momentum, plus weight decay.</li><li><b>Learning-rate schedule</b>: warm up from near zero, then decay (cosine is common).</li><li><b>Mixed precision</b>: bf16 maths with fp32 master weights.</li><li><b>Parallelism</b>: data, tensor, pipeline, and expert parallelism across thousands of GPUs, because the model, its gradients and optimiser state don't fit on one.</li><li><b>Gradient clipping</b> to survive the occasional loss spike.</li></ul>`,
  v:()=>`<div class="panel"><svg viewBox="0 0 400 200" width="100%" role="img" aria-label="Typical loss curve falling quickly then flattening">${(()=>{const sx=t=>40+t*340,sy=l=>170-(l-1.6)/(10.8-1.6)*150;let d='';for(let i=0;i<=120;i++){const t=i/120,l=1.8+9*Math.exp(-t*9)+0.35*Math.exp(-t*1.5)+(i%7===3?0.08:0)*(1-t);d+=(i?'L':'M')+sx(t).toFixed(1)+' '+sy(l).toFixed(1)}return `<line x1="40" y1="170" x2="380" y2="170" stroke="var(--line)"/><line x1="40" y1="20" x2="40" y2="170" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="44" y="16">loss</text><text x="380" y="188" text-anchor="end">training tokens →</text><text x="${sx(.02)+6}" y="${sy(10.6)}">≈ ln V at start</text>`})()}</svg><p class="cap">Illustrative shape: steep early drop, then a long slow grind. Scaling laws show loss falls predictably as you add parameters, data and compute.</p></div>`,
  code:`opt = torch.optim.AdamW(model.parameters(), lr=3e-4, weight_decay=0.1)
for step, (x, y) in enumerate(loader):
    loss = F.cross_entropy(model(x).flatten(0, 1), y.flatten())
    loss.backward()
    torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
    opt.step(); sched.step(); opt.zero_grad()`},
 {t:"From text predictor to assistant",
  b:`<p>A pretrained base model just continues text. Ask it a question and it may reply with three more questions. Turning it into a helpful assistant takes more stages:</p><ul><li><b>Supervised fine-tuning (SFT)</b>: train on curated conversations in the chat template. Same loss, usually counted only on the assistant's tokens.</li><li><b>Preference tuning</b>: show pairs of responses with one judged better, and push the model toward the preferred style. Methods include RLHF (a learned reward model + reinforcement learning), RLAIF (AI-generated feedback, for example against a written set of principles) and DPO (optimises preferences directly).</li><li><b>RL on verifiable tasks</b>: reward correct maths answers or passing tests. A big driver of recent reasoning models.</li></ul>`,
  v:()=>`<div class="panel stack">${[["Pretraining","trillions of tokens of text","base model"],["SFT","curated dialogues","follows instructions"],["Preference tuning","ranked response pairs","helpful, safer style"],["RL on tasks","checkable rewards","better reasoning"]].map(([a,b,c],i)=>`<div class="stage ${i===0?'cur':''}"><span><b style="font-weight:500">${a}</b><br><span class="cap">${b}</span></span><span class="mono">→ ${c}</span></div>`).join('')}<p class="cap">Pretraining is the vast majority of the compute. The later stages are small by comparison but change behaviour dramatically.</p></div>`},
 {t:"Where to go from here",
  b:`<p>You've now seen every component in a modern decoder-only LLM. The best way to lock it in as an engineer is to build one.</p><ul><li><b>Andrej Karpathy, "Let's build GPT" and nanoGPT</b>: a GPT in a few hundred lines of PyTorch.</li><li><b>"Attention Is All You Need"</b> (Vaswani et al., 2017): the original paper, readable after this course.</li><li><b>Jay Alammar, "The Illustrated Transformer"</b>: more diagrams of the same ideas.</li><li><b>Anthropic's interpretability research</b>: what's actually happening inside the residual stream.</li></ul><p>A good exercise: implement the 4-token attention from chapter 2 in plain Java or TypeScript with nested arrays and check your numbers match these slides.</p>`,
  v:()=>`<div class="panel"><p class="cap" style="margin-bottom:8px">The whole forward pass, minus the boilerplate</p>${code(`x = embed(ids)                          # [B, n, d]
for blk in blocks:
    h = rms_norm(x)
    q, k, v = rope(Wq(h)), rope(Wk(h)), Wv(h)
    a = softmax(mask(q @ k.T / sqrt(d_head))) @ v
    x = x + Wo(a)                       # residual
    x = x + mlp(rms_norm(x))            # residual
logits = rms_norm(x)[-1] @ W_unembed    # [V]
next_id = sample(logits / T, top_p=0.9)`)}</div>`}
]}
];
const CANDS=[["intelligence",7.6],["neural nets",4.6],["life",4.2],["languages",3.9],["sweeteners",3.4],["flowers",2.6],["grass",1.6],["banana",0.9]];

/* ---------- router ---------- */
let ci=0,si=0;
const chapNav=$('#chapters');
chapNav.innerHTML=CH.map((c,i)=>`<button data-c="${i}"><b>${String(i).padStart(2,'0')}</b>${c.name}</button>`).join('');
chapNav.querySelectorAll('button').forEach(b=>b.onclick=()=>goto(CH[+b.dataset.c].id,0));
function goto(id,s){const i=CH.findIndex(c=>c.id===id);ci=i<0?0:i;si=s||0;if(location.hash!=='#'+CH[ci].id)history.replaceState(null,'','#'+CH[ci].id);render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
 const c=CH[ci],s=c.slides[si];
 chapNav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===ci));
 $('#progress').innerHTML=c.slides.map((_,i)=>`<button class="${i<=si?'done':''}" aria-label="Slide ${i+1}" data-s="${i}"></button>`).join('');
 $('#progress').querySelectorAll('button').forEach(b=>b.onclick=()=>{si=+b.dataset.s;render()});
 $('#slide').innerHTML=`<div class="prose"><p class="eyebrow">Chapter ${ci} · ${c.name}</p><h2>${s.t}</h2>${s.b}${s.code?code(s.code):''}</div><div class="viz">${s.v?s.v():''}</div>`;
 $('#cnt').textContent=`${si+1} / ${c.slides.length}`;
 const last=ci===CH.length-1&&si===c.slides.length-1;
 $('#next').textContent=si<c.slides.length-1?'Next →':last?'Back to start ↺':`Chapter ${ci+1} →`;
 $('#prev').disabled=ci===0&&si===0;$('#prev').style.opacity=ci===0&&si===0?.4:1;
 if(s.init)s.init();
}
function step(d){const c=CH[ci];if(d>0){if(si<c.slides.length-1)si++;else if(ci<CH.length-1){ci++;si=0}else{ci=0;si=0}}else{if(si>0)si--;else if(ci>0){ci--;si=CH[ci].slides.length-1}}history.replaceState(null,'','#'+CH[ci].id);render();$('#slide').scrollIntoView({block:'nearest'})}
$('#next').onclick=()=>step(1);$('#prev').onclick=()=>step(-1);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);const i=CH.findIndex(c=>c.id===id);if(i>=0&&i!==ci){ci=i;si=0;render()}});
const start=CH.findIndex(c=>c.id===location.hash.slice(1));ci=start<0?0:start;render();
})();
</script>
