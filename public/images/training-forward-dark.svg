<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The forward pass: make a guess</title>
  <desc id="d">Four boxes left to right. Words in: “The sky is”. Numbers: each token becomes a vector. Layers: the vectors are multiplied by the weights, layer after layer. Guess out: a badly tuned model gives “banana” 85% and “blue” only 5%. An arrow underneath shows the data flows one way, input to output.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="400" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">The forward pass: make a guess</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The prompt runs through the model once, front to back, and comes out as probabilities.</text>
  <rect class="card" x="40" y="120" width="240" height="170" rx="10"/>
  <text x="160" y="152" text-anchor="middle" class="muted head" font-size="12">WORDS IN</text>
  <text x="160" y="210" text-anchor="middle" class="ink" font-size="19" font-weight="700">“The sky is”</text>
  <text x="160" y="262" text-anchor="middle" class="muted" font-size="13">the prompt</text>
  <rect class="card" x="330" y="120" width="240" height="170" rx="10"/>
  <text x="450" y="152" text-anchor="middle" class="muted head" font-size="12">NUMBERS</text>
  <text x="450" y="210" text-anchor="middle" class="ink" font-size="19" font-weight="700">[0.12, −0.8, …]</text>
  <text x="450" y="262" text-anchor="middle" class="muted" font-size="13">one vector per token</text>
  <rect class="card" x="620" y="120" width="240" height="170" rx="10"/>
  <text x="740" y="152" text-anchor="middle" class="muted head" font-size="12">LAYERS</text>
  <text x="740" y="210" text-anchor="middle" class="ink" font-size="19" font-weight="700">× weights</text>
  <text x="740" y="262" text-anchor="middle" class="muted" font-size="13">every layer, in order</text>
  <path class="line" d="M286 205 H 324" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M576 205 H 614" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M866 205 H 904" fill="none" marker-end="url(#a)"/>
  <rect class="negsoft" x="910" y="120" width="250" height="170" rx="10" stroke-width="1.5"/>
  <text x="1035" y="152" text-anchor="middle" class="negink head" font-size="12">GUESS OUT</text>
  <text x="1035" y="210" text-anchor="middle" class="negink" font-size="21" font-weight="700">banana  85%</text>
  <text x="1035" y="238" text-anchor="middle" class="muted" font-size="14">blue  5%</text>
  <text x="1035" y="266" text-anchor="middle" class="negink" font-size="13">a badly tuned model</text>
  <rect class="accsoft" x="40" y="316" width="1120" height="60" rx="8" stroke-width="1.5"/>
  <path class="sacc" d="M80 346 H 1120" fill="none" marker-end="url(#aa)"/>
  <rect class="accsoft" x="420" y="330" width="360" height="32" rx="6"/>
  <text x="600" y="352" text-anchor="middle" class="accink" font-size="15" font-weight="700">one direction: input → output</text>
</svg>
