<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Six places RAG can go wrong</title>
  <desc id="d">Six failure points along the pipeline. 1, not in the index: the document was never added, or is out of date; check whether the source is there. 2, split badly: the answer is cut across two chunks; check by reading your chunks. 3, not retrieved: search ranks it too low; measure recall at k. 4, cut from the prompt: it fell below the top k or out of the token budget; check what the model actually saw. 5, ignored or misread: the model answers from memory or blends sources; measure faithfulness. 6, off the question: true to the text but not what was asked; measure answer relevance. Failures 1 to 4 are retrieval problems: the model never saw the right text, so fix the index, chunks or search. Failures 5 and 6 are generation problems: the right text was there, so fix the prompt or model. Debug in order, first what was retrieved, then what was generated: a good model can't answer from the wrong text, so most RAG fixes are retrieval fixes.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
  </defs>
  <rect class="bg" width="1200" height="510" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Six places RAG can go wrong</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">When an answer is wrong, find the step that broke before changing anything.</text>
  <rect class="card" x="50" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="134" cy="128" r="12"/>
  <text x="134" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">1</text>
  <text x="134" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Not in the index</text>
  <text x="134" y="190" text-anchor="middle" class="muted" font-size="12.5">never added, or</text>
  <text x="134" y="207" text-anchor="middle" class="muted" font-size="12.5">out of date</text>
  <line class="thin" x1="66" y1="236" x2="202" y2="236"/>
  <text x="134" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Check: is the</text>
  <text x="134" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">source there?</text>
  <line class="line" x1="220" y1="224" x2="234" y2="224" marker-end="url(#a)"/>
  <rect class="card" x="236" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="320" cy="128" r="12"/>
  <text x="320" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">2</text>
  <text x="320" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Split badly</text>
  <text x="320" y="190" text-anchor="middle" class="muted" font-size="12.5">answer cut across</text>
  <text x="320" y="207" text-anchor="middle" class="muted" font-size="12.5">two chunks</text>
  <line class="thin" x1="252" y1="236" x2="388" y2="236"/>
  <text x="320" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Check: read</text>
  <text x="320" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">your chunks</text>
  <line class="line" x1="406" y1="224" x2="420" y2="224" marker-end="url(#a)"/>
  <rect class="card" x="422" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="506" cy="128" r="12"/>
  <text x="506" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">3</text>
  <text x="506" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Not retrieved</text>
  <text x="506" y="190" text-anchor="middle" class="muted" font-size="12.5">search ranks it</text>
  <text x="506" y="207" text-anchor="middle" class="muted" font-size="12.5">too low</text>
  <line class="thin" x1="438" y1="236" x2="574" y2="236"/>
  <text x="506" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Measure:</text>
  <text x="506" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">recall@k</text>
  <line class="line" x1="592" y1="224" x2="606" y2="224" marker-end="url(#a)"/>
  <rect class="card" x="608" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="692" cy="128" r="12"/>
  <text x="692" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">4</text>
  <text x="692" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Cut from prompt</text>
  <text x="692" y="190" text-anchor="middle" class="muted" font-size="12.5">below the top-k,</text>
  <text x="692" y="207" text-anchor="middle" class="muted" font-size="12.5">or out of budget</text>
  <line class="thin" x1="624" y1="236" x2="760" y2="236"/>
  <text x="692" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Check: what the</text>
  <text x="692" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">model actually saw</text>
  <line class="line" x1="778" y1="224" x2="792" y2="224" marker-end="url(#a)"/>
  <rect class="card" x="794" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="878" cy="128" r="12"/>
  <text x="878" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">5</text>
  <text x="878" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Ignored or misread</text>
  <text x="878" y="190" text-anchor="middle" class="muted" font-size="12.5">answers from memory,</text>
  <text x="878" y="207" text-anchor="middle" class="muted" font-size="12.5">or blends sources</text>
  <line class="thin" x1="810" y1="236" x2="946" y2="236"/>
  <text x="878" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Measure:</text>
  <text x="878" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">faithfulness</text>
  <line class="line" x1="964" y1="224" x2="978" y2="224" marker-end="url(#a)"/>
  <rect class="card" x="980" y="128" width="168" height="192" rx="12"/>
  <circle class="neg" cx="1064" cy="128" r="12"/>
  <text x="1064" y="132.5" text-anchor="middle" class="onacc" font-size="13" font-weight="700">6</text>
  <text x="1064" y="166" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Off the question</text>
  <text x="1064" y="190" text-anchor="middle" class="muted" font-size="12.5">true to the text, but</text>
  <text x="1064" y="207" text-anchor="middle" class="muted" font-size="12.5">not what was asked</text>
  <line class="thin" x1="996" y1="236" x2="1132" y2="236"/>
  <text x="1064" y="264" text-anchor="middle" class="accink" font-size="13" font-weight="700">Measure: answer</text>
  <text x="1064" y="283" text-anchor="middle" class="accink" font-size="13" font-weight="700">relevance</text>
  <path class="sheat" d="M54 336 V 346 H 780 V 336"/>
  <text x="417" y="370" text-anchor="middle" class="heatink head" font-size="13">RETRIEVAL PROBLEMS (1–4)</text>
  <text x="417" y="390" text-anchor="middle" class="ink" font-size="13">The model never saw the right text. Fix the index, chunks or search.</text>
  <path class="sneg" d="M794 336 V 346 H 1150 V 336"/>
  <text x="972" y="370" text-anchor="middle" class="negink head" font-size="13">GENERATION PROBLEMS (5–6)</text>
  <text x="972" y="390" text-anchor="middle" class="ink" font-size="13">The right text was there. Fix the prompt or model.</text>
  <rect class="accsoft" x="40" y="414" width="1120" height="66" rx="12"/>
  <text x="60" y="442" text-anchor="start" class="accink" font-size="15" font-weight="700">Debug in order: first check what was retrieved, then what was generated.</text>
  <text x="60" y="464" text-anchor="start" class="ink" font-size="13.5">A good model can't answer from the wrong text, so most RAG fixes are retrieval fixes.</text>

</svg>
