<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Batching and the KV cache</title>
  <desc id="d">Batching and the KV cache on one GPU running Llama 3 8B for three people, Ana, Ben and Kai. Left, GPU memory of 80 GB: one copy of the 16 GB weights, shared by everyone, then a separate KV cache for each person, of different lengths, and free space with room for about 500,000 tokens of cache, at about 128 KB per token. Middle, one decode step: the newest token of each conversation is stacked into a batch table, one row per person, 64 by 4,096; it is multiplied by a tile of weights that crosses the link once, giving 64 results; row 1 of the result comes only from row 1 of the input. Right, attention: each person's query reads only that person's own cache, at token 50, token 3,000 and token 900; an arrow from Ana's query to Ben's cache is crossed out, because a row never reads another conversation's cache. Bottom, continuous batching over nine steps: Ana and Kai continue every step; Ben's answer ends at step 4 and Ben leaves; a new request is prefilled at step 6 and joins from step 7. PagedAttention keeps each cache in 16-token blocks with one block table per conversation, and identical starting text such as a shared system prompt can share its blocks.</desc>
