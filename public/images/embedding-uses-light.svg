<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">What embeddings are used for</title>
  <desc id="d">Embeddings turn everything into vectors, so many tasks become one question: what is close to this? Recommendations: a video you watched, then the nearest videos, gives "Up next". Search and RAG: your question, then the nearest chunks, gives the answer from your PDFs. Clustering: 10,000 student questions grouped by close vectors give the 12 topics people ask about.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <rect class="bg" width="1200" height="400" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">One idea, many uses</text>
  <text x="40" y="78" class="muted" font-size="15">Turn things into vectors, then find what is close. Each card: the input, the comparison, the result.</text>
  <rect class="accsoft" x="440" y="104" width="320" height="64" rx="14" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" class="accink" font-size="17" font-weight="700">Everything becomes a vector</text>
  <text x="600" y="154" text-anchor="middle" class="ink" font-size="13">then every task asks: what is close to this?</text>
  <rect class="card" x="40" y="196" width="360" height="150" rx="12"/>
  <text x="60" y="228" text-anchor="start" class="accink" font-size="16" font-weight="700">Recommendations</text>
  <rect class="sunk" x="60" y="244" width="320" height="30" rx="8"/>
  <text x="74" y="264" text-anchor="start" class="ink" font-size="13.5" font-weight="600">video you watched</text>
  <text x="74" y="296" text-anchor="start" class="muted mono" font-size="12.5">→ nearest videos</text>
  <rect class="possoft" x="60" y="308" width="320" height="28" rx="8" stroke-width="1.5"/>
  <text x="74" y="327" text-anchor="start" class="posink" font-size="13.5" font-weight="700">“Up next”</text>
  <circle class="acc" cx="340" cy="218" r="4" opacity="1"/>
  <circle class="acc" cx="352" cy="226" r="4" opacity="1"/>
  <circle class="acc" cx="362" cy="214" r="4" opacity="1"/>
  <circle class="muted" cx="374" cy="224" r="4" opacity="0.5"/>
  <rect class="card" x="420" y="196" width="360" height="150" rx="12"/>
  <text x="440" y="228" text-anchor="start" class="accink" font-size="16" font-weight="700">Search and RAG</text>
  <rect class="sunk" x="440" y="244" width="320" height="30" rx="8"/>
  <text x="454" y="264" text-anchor="start" class="ink" font-size="13.5" font-weight="600">your question</text>
  <text x="454" y="296" text-anchor="start" class="muted mono" font-size="12.5">→ nearest chunks</text>
  <rect class="possoft" x="440" y="308" width="320" height="28" rx="8" stroke-width="1.5"/>
  <text x="454" y="327" text-anchor="start" class="posink" font-size="13.5" font-weight="700">the answer, from your PDFs</text>
  <circle class="acc" cx="720" cy="218" r="4" opacity="1"/>
  <circle class="acc" cx="732" cy="226" r="4" opacity="1"/>
  <circle class="acc" cx="742" cy="214" r="4" opacity="1"/>
  <circle class="muted" cx="754" cy="224" r="4" opacity="0.5"/>
  <rect class="card" x="800" y="196" width="360" height="150" rx="12"/>
  <text x="820" y="228" text-anchor="start" class="accink" font-size="16" font-weight="700">Clustering</text>
  <rect class="sunk" x="820" y="244" width="320" height="30" rx="8"/>
  <text x="834" y="264" text-anchor="start" class="ink" font-size="13.5" font-weight="600">10,000 student questions</text>
  <text x="834" y="296" text-anchor="start" class="muted mono" font-size="12.5">→ groups of close vectors</text>
  <rect class="possoft" x="820" y="308" width="320" height="28" rx="8" stroke-width="1.5"/>
  <text x="834" y="327" text-anchor="start" class="posink" font-size="13.5" font-weight="700">the 12 topics people ask about</text>
  <circle class="acc" cx="1100" cy="218" r="4" opacity="1"/>
  <circle class="acc" cx="1112" cy="226" r="4" opacity="1"/>
  <circle class="acc" cx="1122" cy="214" r="4" opacity="1"/>
  <circle class="muted" cx="1134" cy="224" r="4" opacity="0.5"/>
  <text x="40" y="384" class="muted" font-size="11.5">The topic count is illustrative.</text>
</svg>
