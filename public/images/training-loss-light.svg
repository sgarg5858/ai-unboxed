<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The loss: one number for “how wrong”</title>
  <desc id="d">Formula at the top: loss equals minus the log of the probability the model gave to the right answer. Left, a badly tuned model gives “blue” a probability of 0.05 after “The sky is”: loss 3.00, high. Right, a better tuned model gives “blue” 0.70: loss 0.36, low. Being confidently wrong costs the most: a probability of 0.0001 gives a loss of 9.2.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="430" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">The loss: one number for “how wrong”</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Look at the probability the model gave the word that really came next. Low probability, high loss.</text>
  <rect class="accsoft" x="40" y="100" width="1120" height="48" rx="8" stroke-width="1.5"/>
  <text x="600" y="131" text-anchor="middle" class="accink" font-size="17" font-weight="700">loss = −log( probability the model gave to the right answer )</text>
  <rect class="card" x="40" y="168" width="540" height="210" rx="10"/>
  <text x="60" y="198" text-anchor="start" class="muted head" font-size="12">BADLY TUNED</text>
  <text x="60" y="240" text-anchor="start" class="ink" font-size="18" font-weight="700">“The sky is …”   p(blue) = 0.05</text>
  <text x="60" y="284" text-anchor="start" class="muted" font-size="13.5">loss</text>
  <rect class="sunk" x="110" y="270" width="440" height="18" rx="6"/>
  <rect class="neg" x="110" y="270" width="412.5" height="18" rx="6"/>
  <text x="60" y="330" text-anchor="start" class="negink" font-size="30" font-weight="700">3.00</text>
  <text x="150" y="328" text-anchor="start" class="negink" font-size="15" font-weight="600">high loss: very wrong</text>
  <rect class="card" x="620" y="168" width="540" height="210" rx="10"/>
  <text x="640" y="198" text-anchor="start" class="muted head" font-size="12">BETTER TUNED</text>
  <text x="640" y="240" text-anchor="start" class="ink" font-size="18" font-weight="700">“The sky is …”   p(blue) = 0.70</text>
  <text x="640" y="284" text-anchor="start" class="muted" font-size="13.5">loss</text>
  <rect class="sunk" x="690" y="270" width="440" height="18" rx="6"/>
  <rect class="pos" x="690" y="270" width="49.5" height="18" rx="6"/>
  <text x="640" y="330" text-anchor="start" class="posink" font-size="30" font-weight="700">0.36</text>
  <text x="730" y="328" text-anchor="start" class="posink" font-size="15" font-weight="600">low loss: nearly right</text>
  <text x="600" y="408" text-anchor="middle" class="muted" font-size="14">Confidently wrong costs the most: if the right word gets p = 0.0001, the loss is 9.2.</text>
</svg>
