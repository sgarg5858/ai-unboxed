<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How position reaches the model</title>
  <desc id="d">How position reaches the model, for the sentence "dog bites man". Each token, dog at position 0, bites at position 1 and man at position 2, looks up its token vector, which says what the word is. A position vector for its slot, which says where it sits, is added to it. The sum is the input vector, what plus where, one per token. The transformer model gets all three input vectors at once, side by side, so order now lives inside the numbers. Position vectors are fixed per slot: every sentence's first token gets the same position-0 vector. Side panel: in "man bites dog", dog is at position 2. Its token vector is the same, but position 2's vector differs from position 0's, so "dog at 0" and "dog at 2" become different input vectors, and the model can learn who bit whom. Models that use RoPE skip this addition and turn vectors inside attention instead. Values are illustrative.</desc>
