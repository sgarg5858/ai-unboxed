<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Feed-forward layer</title>
  <desc id="d">The feed-forward layer for the token "it" in "The cat sat because it was tired". Its 768 numbers fan out into 3,072 detectors, four times wider, each checking for one meaning. For "it", the detectors for a pronoun, refers to an animal, one thing, and subject of a verb fire. Others, such as about food, past tense, a place and a number, come out negative and are switched to 0. Only the detectors that fired feed the shrink step, which squeezes them back into 768 numbers: an update meaning an animal, one thing, the subject, which is added to "it"'s vector. The same network runs on every token at once. Sizes from GPT-2; detector names and values are illustrative.</desc>
