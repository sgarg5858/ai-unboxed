<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Feed-forward layer</title>
  <desc id="d">The feed-forward layer for the token "it". Its vector, 768 numbers, is expanded to 3,072 numbers, four times wider. A simple rule keeps the strong signals and switches the rest down: some middle cells light up, others go grey. Then it is shrunk back to 768 numbers, giving an update that is added to "it"’s vector. Behind it, identical copies run for "cat" and "The": the same network runs on every token at the same time. Sizes from GPT-2; values are illustrative.</desc>
