<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Where the weights live, and how GPUs share them</title>
  <desc id="d">Top left, where the weights live: a file on disk, the shelf, is read into main memory, the desk, then copied into GPU memory, the cook's hands, right next to the chips that do the maths. Top right, why one GPU isn't enough, for Llama 2 7B with 6.7 billion weights: running it needs 2 bytes per weight, 13.5 GB, which fits under one GPU's 80 GB. Training needs 16 bytes per weight, about 108 GB, which goes past 80 GB. Bottom, four ways to share the work. Full copies (data parallel): every GPU holds the whole model and takes a quarter of the batch, then they average gradients. Share it out (sharded): each GPU stores one quarter and borrows the rest when needed. Strips (tensor parallel): one big table is cut into column strips, one per GPU, inside one server. Stages (pipeline parallel): GPU 1 runs layers 1 to 8, GPU 2 layers 9 to 16, and so on, like an assembly line.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
  <rect class="bg" x="0" y="0" width="1200" height="500" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Where the weights live, and how GPUs share them</text>
  <text x="40" y="78" class="muted" font-size="15">Llama 2 7B: 6.7 billion weights.</text>
  <rect class="card" x="40" y="98" width="560" height="160" rx="10"/>
  <text x="60" y="124" class="muted head" font-size="12">WHERE THEY LIVE</text>
  <rect class="sunk" x="60" y="140" width="155" height="80" rx="8"/>
  <text x="137.5" y="172" text-anchor="middle" class="ink" font-size="16" font-weight="700">Disk</text>
  <text x="137.5" y="196" text-anchor="middle" class="heatink" font-size="13.5" font-weight="600">the shelf</text>
  <line class="line" x1="218" y1="180" x2="237" y2="180" marker-end="url(#a)"/>
  <rect class="sunk" x="240" y="140" width="155" height="80" rx="8"/>
  <text x="317.5" y="172" text-anchor="middle" class="ink" font-size="16" font-weight="700">Main memory</text>
  <text x="317.5" y="196" text-anchor="middle" class="heatink" font-size="13.5" font-weight="600">the desk</text>
  <line class="line" x1="398" y1="180" x2="417" y2="180" marker-end="url(#a)"/>
  <rect class="accsoft" x="420" y="140" width="155" height="80" rx="8"/>
  <text x="497.5" y="172" text-anchor="middle" class="accink" font-size="16" font-weight="700">GPU memory</text>
  <text x="497.5" y="196" text-anchor="middle" class="heatink" font-size="13.5" font-weight="600">the cook's hands</text>
  <text x="320" y="244" text-anchor="middle" class="muted" font-size="13.5">Each step is closer to the chips that do the maths.</text>
  <rect class="card" x="620" y="98" width="540" height="160" rx="10"/>
  <text x="640" y="124" class="muted head" font-size="12">WHY ONE GPU ISN'T ENOUGH</text>
  <text x="640" y="166" class="ink" font-size="14" font-weight="700">Run it</text>
  <rect class="pos" x="720" y="150" width="42.8" height="24" rx="5"/>
  <text x="772.8" y="167" class="posink" font-size="14" font-weight="700">13.5 GB ✓</text>
  <text x="640" y="214" class="ink" font-size="14" font-weight="700">Train it</text>
  <rect class="neg" x="720" y="198" width="342.0" height="24" rx="5"/>
  <text x="1070" y="215" class="negink" font-size="14" font-weight="700">108 GB ✗</text>
  <line class="sheat" stroke-dasharray="5 4" x1="973.3" y1="140" x2="973.3" y2="232"/>
  <text x="973.3" y="248" text-anchor="middle" class="heatink" font-size="13" font-weight="700">one GPU: 80 GB</text>
  <text x="640" y="248" class="muted" font-size="12.5">2 vs 16 bytes per weight</text>
  <text x="40" y="294" class="muted head" font-size="12">FOUR WAYS TO SHARE THE WORK</text>
  <rect class="card" x="40.0" y="306" width="257.5" height="174" rx="10"/>
  <text x="56.0" y="332" class="ink" font-size="16" font-weight="700">Full copies</text>
  <text x="281.5" y="332" text-anchor="end" class="accink mono" font-size="11.5">data parallel</text>
  <rect class="acc" x="56.0" y="346" width="140" height="15" rx="3"/>
  <rect class="acc" x="204.0" y="346" width="40" height="15" rx="3" opacity=".55"/>
  <rect class="acc" x="56.0" y="366" width="140" height="15" rx="3"/>
  <rect class="pos" x="204.0" y="366" width="40" height="15" rx="3" opacity=".55"/>
  <rect class="acc" x="56.0" y="386" width="140" height="15" rx="3"/>
  <rect class="heatfill" x="204.0" y="386" width="40" height="15" rx="3" opacity=".55"/>
  <rect class="acc" x="56.0" y="406" width="140" height="15" rx="3"/>
  <rect class="neg" x="204.0" y="406" width="40" height="15" rx="3" opacity=".55"/>
  <text x="126.0" y="438" text-anchor="middle" class="muted" font-size="11">full model</text><text x="224.0" y="438" text-anchor="middle" class="muted" font-size="11">batch</text>
  <text x="56.0" y="460" class="ink" font-size="13">Each takes ¼ of the batch,</text>
  <text x="56.0" y="476" class="ink" font-size="13">then they average gradients.</text>
  <rect class="card" x="327.5" y="306" width="257.5" height="174" rx="10"/>
  <text x="343.5" y="332" class="ink" font-size="16" font-weight="700">Share it out</text>
  <text x="569.0" y="332" text-anchor="end" class="accink mono" font-size="11.5">sharded</text>
  <rect class="acc" x="343.5" y="346" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="399.5" y="346" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="455.5" y="346" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="511.5" y="346" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="343.5" y="366" width="50" height="15" rx="3"/>
  <rect class="pos" x="399.5" y="366" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="455.5" y="366" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="511.5" y="366" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="343.5" y="386" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="399.5" y="386" width="50" height="15" rx="3"/>
  <rect class="heatfill" x="455.5" y="386" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="511.5" y="386" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="343.5" y="406" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="399.5" y="406" width="50" height="15" rx="3"/>
  <rect class="thin" stroke-dasharray="3 3" x="455.5" y="406" width="50" height="15" rx="3"/>
  <rect class="neg" x="511.5" y="406" width="50" height="15" rx="3"/>
  <text x="456.25" y="438" text-anchor="middle" class="muted" font-size="11">solid = stored · dashed = borrowed</text>
  <text x="343.5" y="460" class="ink" font-size="13">Each stores ¼, borrows</text>
  <text x="343.5" y="476" class="ink" font-size="13">the rest when needed.</text>
  <rect class="card" x="615.0" y="306" width="257.5" height="174" rx="10"/>
  <text x="631.0" y="332" class="ink" font-size="16" font-weight="700">Strips</text>
  <text x="856.5" y="332" text-anchor="end" class="accink mono" font-size="11.5">tensor parallel</text>
  <rect class="acc" x="655.0" y="346" width="40" height="76" rx="3"/>
  <rect class="pos" x="701.0" y="346" width="40" height="76" rx="3"/>
  <rect class="heatfill" x="747.0" y="346" width="40" height="76" rx="3"/>
  <rect class="neg" x="793.0" y="346" width="40" height="76" rx="3"/>
  <text x="743.75" y="438" text-anchor="middle" class="muted" font-size="11">GPU 1 · 2 · 3 · 4</text>
  <text x="631.0" y="460" class="ink" font-size="13">One table cut into strips,</text>
  <text x="631.0" y="476" class="ink" font-size="13">inside one server.</text>
  <rect class="card" x="902.5" y="306" width="257.5" height="174" rx="10"/>
  <text x="918.5" y="332" class="ink" font-size="16" font-weight="700">Stages</text>
  <text x="1144.0" y="332" text-anchor="end" class="accink mono" font-size="11.5">pipeline parallel</text>
  <rect class="acc" x="918.5" y="346" width="80" height="15" rx="3"/>
  <text x="1006.5" y="358" class="ink" font-size="11.5" font-weight="600">GPU 1: layers 1–8</text>
  <rect class="pos" x="918.5" y="366" width="80" height="15" rx="3"/>
  <text x="1006.5" y="378" class="ink" font-size="11.5" font-weight="600">GPU 2: layers 9–16</text>
  <rect class="heatfill" x="918.5" y="386" width="80" height="15" rx="3"/>
  <text x="1006.5" y="398" class="ink" font-size="11.5" font-weight="600">GPU 3: layers 17–24</text>
  <rect class="neg" x="918.5" y="406" width="80" height="15" rx="3"/>
  <text x="1006.5" y="418" class="ink" font-size="11.5" font-weight="600">GPU 4: layers 25–32</text>
  <text x="1031.25" y="438" text-anchor="middle" class="muted" font-size="11">work flows down in chunks</text>
  <text x="918.5" y="460" class="ink" font-size="13">Layers split across GPUs,</text>
  <text x="918.5" y="476" class="ink" font-size="13">like an assembly line.</text>
</svg>
