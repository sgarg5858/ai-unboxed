<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Prompt caching, behind the scenes</title>
  <desc id="d">Three panels. One, where it lives: in the provider’s GPU memory. On an 80 GB H100 serving Llama 3 8B, the weights take about 16 GB, a KV-cache pool of about 56 GB holds both live requests and saved prompt prefixes in blocks of 16 tokens, and a little is working space; if not used for a while it can be offloaded to CPU RAM or SSD and copied back on a hit; when it expires or space is needed it is evicted. Two, how a request finds it: the prompt is cut into blocks, and each block gets a hash of itself plus every block before it. The first two blocks, the shared opening, match saved hashes; the third, your new question, does not. One changed word changes every later hash. The router sends matching prefixes to the same server, where the cache is. Three, how the model uses it: the model only receives the new tokens. In every layer and head, each new token’s query compares with the cached keys plus the new keys, and blends the cached values plus the new values; the new keys and values are appended. The weights are untouched and the result is the same as without caching. A hit skips prefill for the opening, so the reply starts sooner and cached tokens cost less.</desc>
