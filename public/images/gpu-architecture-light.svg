<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Inside a GPU: where the maths happens</title>
  <desc id="d">One GPU inside a server, running Llama 3 8B on an NVIDIA H100; numbers are approximate. Left, a server: a CPU that runs the program, main memory as a loading area, a disk that stores files, and 8 GPUs. One GPU is enlarged on the right. It has three parts. First, GPU memory, 80 GB, where the weights live: Llama 3 8B takes 16 GB, the rest is free space. This is the warehouse. Second, the link from GPU memory to the chip, about 3.3 terabytes per second; weights stream across it every time they are used. This is the conveyor belt. Third, the GPU chip itself: a tiny on-chip memory of a few tens of megabytes, and thousands of compute cores doing about 1,000 trillion calculations a second. These are the workers. Below, two stages. Prefill, the whole prompt at once: each weight that arrives is used for all 1,000 prompt tokens, so the cores stay busy; it is compute-bound, the pause before the first word. Decode, one token at a time: each new token needs all 16 GB to cross the link again, about 5 milliseconds of waiting for about 0.02 milliseconds of maths; it is memory-bound and the cores are mostly idle.</desc>
