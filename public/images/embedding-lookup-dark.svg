    <rect class="acc" x="500" y="250" width="50" height="22" rx="6" opacity="0.31"/>
  <rect class="heatfill" x="554" y="250" width="50" height="22" rx="6" opacity="0.51"/>
  <rect class="acc" x="608" y="250" width="50" height="22" rx="6" opacity="0.73"/>
  <rect class="acc" x="662" y="250" width="50" height="22" rx="6" opacity="0.20"/>
  <rect class="heatfill" x="716" y="250" width="50" height="22" rx="6" opacity="0.29"/>
