  <text x="436" y="294" class="muted mono" font-size="13" font-weight="400">8416</text>
    <rect class="acc" x="500" y="278" width="50" height="22" rx="6" opacity="0.22"/>
  <rect class="heatfill" x="554" y="278" width="50" height="22" rx="6" opacity="0.36"/>
