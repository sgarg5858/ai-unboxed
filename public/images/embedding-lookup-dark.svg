  <text x="1050.0" y="183.0" text-anchor="middle" class="ink mono" font-size="13">0.21</text>
  <rect class="heatfill" x="990" y="194" width="120" height="24" rx="6" opacity="0.51"/>
  <text x="1050.0" y="211.0" text-anchor="middle" class="ink mono" font-size="13">−0.53</text>
  <rect class="acc" x="990" y="222" width="120" height="24" rx="6" opacity="0.73"/>
  <text x="1050.0" y="239.0" text-anchor="middle" class="ink mono" font-size="13">0.88</text>
  <rect class="acc" x="990" y="250" width="120" height="24" rx="6" opacity="0.20"/>
  <text x="1050.0" y="267.0" text-anchor="middle" class="ink mono" font-size="13">0.04</text>
  <text x="1050" y="294" text-anchor="middle" class="muted" font-size="16">⋮</text>
  <text x="1050" y="322" text-anchor="middle" class="ink" font-size="12.5">768 numbers in GPT-2 small</text>
  <text x="1050" y="342" text-anchor="middle" class="muted" font-size="12.5">12,288 in GPT-3</text>
  <text x="40" y="400" class="muted head">AFTER TRAINING: SIMILAR WORDS GET SIMILAR ROWS</text>
  <text x="40" y="445" class="accink mono" font-size="16" font-weight="700">␣cat</text>
