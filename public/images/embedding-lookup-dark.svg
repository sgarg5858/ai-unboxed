<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">From token ID to vector</title>
  <desc id="d">The token space-cat has ID 8415. The ID picks row 8415 of the embedding table, which has one row per vocabulary entry. That row is a list of numbers, the token's vector: 768 numbers in GPT-2 small, 12,288 in GPT-3. After training, similar words have similar rows: cat and kitten have nearly the same pattern of numbers, while carpet looks completely different. The numbers shown are illustrative.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="640" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">From token ID to vector</text>
  <text x="40" y="78" class="muted" font-size="15">The embedding table is a lookup: the ID picks a row, and that row is the token's vector.</text>

  <g text-anchor="middle">
    <rect class="card" x="40" y="168" width="150" height="96" rx="12"/>
    <text x="115" y="196" class="muted head">1 · TOKEN</text>
    <text x="115" y="240" class="accink mono" font-size="24" font-weight="700">␣cat</text>
    <rect class="card" x="226" y="168" width="150" height="96" rx="12"/>
    <text x="301" y="196" class="muted head">2 · TOKEN ID</text>
    <text x="301" y="240" class="ink mono" font-size="24" font-weight="700">8415</text>
  </g>
  <g class="line">
    <line x1="194" y1="216" x2="220" y2="216" marker-end="url(#a)"/>
    <line x1="380" y1="216" x2="410" y2="216" marker-end="url(#a)"/>
  </g>
  <text x="416" y="108" class="muted head">3 · EMBEDDING TABLE</text>
  <rect class="card" x="416" y="120" width="478" height="216" rx="12"/>
  <text x="436" y="148" class="muted" font-size="12">row</text>
  <text x="512" y="148" class="muted" font-size="12">one number per column (d columns)</text>
  <text x="446" y="172" text-anchor="middle" class="muted" font-size="16">⋮</text>
  <text x="436" y="210" class="muted mono" font-size="13" font-weight="400">8413</text>
    <rect class="acc" x="500" y="194" width="50" height="22" rx="6" opacity="0.43"/>
