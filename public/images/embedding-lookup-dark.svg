  <text x="446" y="318" text-anchor="middle" class="muted" font-size="16">⋮</text>
  <text x="655" y="358" text-anchor="middle" class="muted" font-size="12.5">~100,000 rows: one for every token in the vocabulary</text>
  <g class="line"><path d="M898 261 H934" marker-end="url(#a)"/></g>
  <text x="940" y="108" class="muted head">4 · THE TOKEN'S VECTOR</text>
  <rect class="accsoft" x="940" y="120" width="220" height="244" rx="12"/>
  <text x="1050" y="152" text-anchor="middle" class="accink mono" font-size="15" font-weight="700">␣cat =</text>
