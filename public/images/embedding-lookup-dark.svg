  <rect class="acc" x="546" y="472" width="62" height="34" rx="6" opacity="0.55"/>
  <text x="577.0" y="494.0" text-anchor="middle" class="ink mono" font-size="13">0.59</text>
  <text x="636" y="495" class="posink" font-size="15" font-weight="600">almost the same pattern → close in meaning</text>
  <text x="40" y="545" class="accink mono" font-size="16" font-weight="700">␣carpet</text>
