<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Training vs inference</title>
  <desc id="d">Left, a comparison. Training runs the forward pass, the backward pass and the update; inference runs only the forward pass. In training the weights change every step; in inference they are frozen. Training takes weeks to months, once; inference takes a moment, for every request. Training needs thousands of GPUs working together; inference needs a few GPUs per reply. Right, distributed training: four GPUs each process part of the batch, then share and average their gradients, and every GPU applies the same update. Big models are also split across GPUs, layer by layer.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="460" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Training vs inference</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Training is the expensive, one-off part. Inference is using the finished model.</text>
  <rect class="card" x="40" y="100" width="620" height="340" rx="10"/>
  <text x="300" y="132" text-anchor="middle" class="accink" font-size="17" font-weight="700">Training</text>
  <text x="535" y="132" text-anchor="middle" class="ink" font-size="17" font-weight="700">Inference</text>
  <rect class="sunk" x="60" y="150" width="580" height="58" rx="8"/>
  <text x="76" y="184" text-anchor="start" class="muted" font-size="13" font-weight="600">Runs</text>
  <text x="300" y="184" text-anchor="middle" class="ink" font-size="14" font-weight="700">forward + backward + update</text>
  <text x="535" y="184" text-anchor="middle" class="ink" font-size="14" font-weight="500">forward pass only</text>
  <rect class="sunk" x="60" y="220" width="580" height="58" rx="8"/>
  <text x="76" y="254" text-anchor="start" class="muted" font-size="13" font-weight="600">Weights</text>
  <text x="300" y="254" text-anchor="middle" class="ink" font-size="14" font-weight="700">change every step</text>
  <text x="535" y="254" text-anchor="middle" class="ink" font-size="14" font-weight="500">frozen</text>
  <rect class="sunk" x="60" y="290" width="580" height="58" rx="8"/>
  <text x="76" y="324" text-anchor="start" class="muted" font-size="13" font-weight="600">Time</text>
  <text x="300" y="324" text-anchor="middle" class="ink" font-size="14" font-weight="700">weeks to months, once</text>
  <text x="535" y="324" text-anchor="middle" class="ink" font-size="14" font-weight="500">a moment, every request</text>
  <rect class="sunk" x="60" y="360" width="580" height="58" rx="8"/>
  <text x="76" y="394" text-anchor="start" class="muted" font-size="13" font-weight="600">Hardware</text>
  <text x="300" y="394" text-anchor="middle" class="ink" font-size="14" font-weight="700">thousands of GPUs together</text>
  <text x="535" y="394" text-anchor="middle" class="ink" font-size="14" font-weight="500">a few GPUs per reply</text>
  <rect class="card" x="680" y="100" width="480" height="340" rx="10"/>
  <text x="700" y="130" text-anchor="start" class="accink head" font-size="12">DISTRIBUTED TRAINING</text>
  <rect class="accsoft" x="700" y="150" width="100" height="70" rx="8"/>
  <text x="750" y="180" text-anchor="middle" class="accink" font-size="14" font-weight="700">GPU 1</text>
  <text x="750" y="204" text-anchor="middle" class="muted" font-size="12">batch part 1</text>
  <path class="line" d="M750 222 V 256" fill="none" marker-end="url(#a)"/>
  <rect class="accsoft" x="812" y="150" width="100" height="70" rx="8"/>
  <text x="862" y="180" text-anchor="middle" class="accink" font-size="14" font-weight="700">GPU 2</text>
  <text x="862" y="204" text-anchor="middle" class="muted" font-size="12">batch part 2</text>
  <path class="line" d="M862 222 V 256" fill="none" marker-end="url(#a)"/>
  <rect class="accsoft" x="924" y="150" width="100" height="70" rx="8"/>
  <text x="974" y="180" text-anchor="middle" class="accink" font-size="14" font-weight="700">GPU 3</text>
  <text x="974" y="204" text-anchor="middle" class="muted" font-size="12">batch part 3</text>
  <path class="line" d="M974 222 V 256" fill="none" marker-end="url(#a)"/>
  <rect class="accsoft" x="1036" y="150" width="100" height="70" rx="8"/>
  <text x="1086" y="180" text-anchor="middle" class="accink" font-size="14" font-weight="700">GPU 4</text>
  <text x="1086" y="204" text-anchor="middle" class="muted" font-size="12">batch part 4</text>
  <path class="line" d="M1086 222 V 256" fill="none" marker-end="url(#a)"/>
  <rect class="heat" x="700" y="262" width="436" height="50" rx="8" stroke-width="1.5"/>
  <text x="918" y="293" text-anchor="middle" class="heatink" font-size="15" font-weight="700">share and average the gradients</text>
  <path class="line" d="M918 314 V 340" fill="none" marker-end="url(#a)"/>
  <rect class="possoft" x="700" y="346" width="436" height="50" rx="8" stroke-width="1.5"/>
  <text x="918" y="377" text-anchor="middle" class="posink" font-size="15" font-weight="700">every GPU applies the same update</text>
  <text x="700" y="424" text-anchor="start" class="muted" font-size="12.5">Big models are also split across GPUs, layer by layer.</text>
</svg>
