<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">A GPT-style transformer, in one picture</title>
  <desc id="d">A GPT-style transformer from text to the next token. Text, "The cat sat", goes to the tokenizer, which gives token IDs 791, 8415, 7731 (Tokens chapter). Each ID gets a token embedding, what the word is, plus a position, where it sits, giving a matrix of 3 tokens by 768 numbers; 768 is the embedding size d, fixed by the model, GPT-2 here (slides 4 and 5). Then a transformer block, repeated N times (12 in GPT-2, 32 in Llama 3 8B): norm, then multi-head causal self-attention, whose output is added back to the main line; then norm, then feed-forward, added back again (slides 7, 8 and 9; feed-forward in The transformer block). Each layer takes 3 by 768 in and gives 3 by 768 out, adding an update. Then a final norm, a linear layer giving a score for every token in the vocabulary: 50,257 scores, because GPT-2’s vocabulary has 50,257 tokens (Output &amp; inference chapter), and softmax, which turns scores into probabilities for the next token, for example "on" 61%, "down" 20%. Pick one, append it, and repeat (slide 1, the loop). Probabilities are illustrative.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="800" rx="18"/>
  <text x="40" y="50" text-anchor="start" class="ink" font-size="26" font-weight="700">A GPT-style transformer, in one picture</text>
  <text x="40" y="76" text-anchor="start" class="muted" font-size="15">From text to the next token. Labels on the right show where each part is explained.</text>
  <rect class="card" x="330" y="100" width="460" height="44" rx="10" stroke-width="1.4"/>
  <text x="560.0" y="127.0" text-anchor="middle" class="ink" font-size="14" font-weight="700">Text: “The cat sat”</text>
  <line class="line" x1="560" y1="144" x2="560" y2="166" marker-end="url(#a)"/>
  <rect class="sunk" x="330" y="170" width="460" height="44" rx="10" stroke-width="1.4"/>
  <text x="560.0" y="197.0" text-anchor="middle" class="ink" font-size="14" font-weight="700">Tokenizer → token IDs</text>
  <text x="300" y="197" text-anchor="end" class="muted mono" font-size="12" font-weight="600">791 · 8415 · 7731</text>
  <rect class="hit" x="840" y="177" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="193" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">2.2</text>
  <text x="910" y="193" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Tokens chapter</text>
  <line class="line" x1="560" y1="214" x2="560" y2="236" marker-end="url(#a)"/>
  <rect class="hit" x="330" y="240" width="205" height="44" rx="10" stroke-width="1.4"/>
  <text x="432.5" y="259" text-anchor="middle" class="accink" font-size="14" font-weight="700">Token embedding</text>
  <text x="432.5" y="276" text-anchor="middle" class="muted" font-size="12">what the word is</text>
  <circle class="card" cx="560" cy="262" r="14" stroke-width="2"/>
  <text x="560" y="269" text-anchor="middle" class="ink" font-size="20" font-weight="700">+</text>
  <rect class="heat" x="585" y="240" width="205" height="44" rx="10" stroke-width="1.4"/>
  <text x="687.5" y="259" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Position</text>
  <text x="687.5" y="276" text-anchor="middle" class="muted" font-size="12">where it sits</text>
  <text x="300" y="251" text-anchor="end" class="muted mono" font-size="12" font-weight="600">3 tokens × 768 numbers</text>
  <text x="300" y="268" text-anchor="end" class="muted" font-size="12" font-weight="600">768 = embedding size (d),</text>
  <text x="300" y="284" text-anchor="end" class="muted" font-size="12" font-weight="600">set by the model: GPT-2</text>
  <rect class="hit" x="840" y="241" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="257" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">4</text>
  <text x="910" y="257" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Token + position</text>
  <rect class="hit" x="840" y="267" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="283" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">5</text>
  <text x="910" y="283" text-anchor="start" class="ink" font-size="13.5" font-weight="600">RoPE (modern models)</text>
  <rect class="card" x="310" y="318" width="500" height="250" rx="14" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="802" y="342" text-anchor="end" class="muted" font-size="12">12 in GPT-2 · 32 in Llama 3 8B</text>
  <text x="382" y="342" text-anchor="start" class="accink mono" font-size="12" font-weight="700">TRANSFORMER BLOCK × N</text>
  <path class="line" d="M560 284 V300 H360 V354" marker-end="url(#a)"/>
  <line class="stream" x1="360" y1="358" x2="360" y2="554"/>
  <line class="line" x1="360" y1="384" x2="406" y2="384" marker-end="url(#a)"/>
  <rect class="heat" x="410" y="362" width="90" height="44" rx="10" stroke-width="1.4"/>
  <text x="455.0" y="389.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Norm</text>
  <line class="line" x1="502" y1="384" x2="526" y2="384" marker-end="url(#a)"/>
  <rect class="hit" x="530" y="362" width="260" height="44" rx="10" stroke-width="1.4"/>
  <text x="660.0" y="389.0" text-anchor="middle" class="accink" font-size="14" font-weight="700">Multi-head causal self-attention</text>
  <path class="line" d="M790 384 H798 V432 H378" marker-end="url(#a)"/>
  <circle class="card" cx="360" cy="432" r="14" stroke-width="2"/>
  <text x="360" y="439" text-anchor="middle" class="ink" font-size="20" font-weight="700">+</text>
  <rect class="hit" x="840" y="361" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="377" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">7</text>
  <text x="910" y="377" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Layer normalization</text>
  <rect class="hit" x="840" y="383" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="399" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">8</text>
  <text x="910" y="399" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Multi-head attention</text>
  <line class="line" x1="360" y1="480" x2="406" y2="480" marker-end="url(#a)"/>
  <rect class="heat" x="410" y="458" width="90" height="44" rx="10" stroke-width="1.4"/>
  <text x="455.0" y="485.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Norm</text>
  <line class="line" x1="502" y1="480" x2="526" y2="480" marker-end="url(#a)"/>
  <rect class="hit" x="530" y="458" width="260" height="44" rx="10" stroke-width="1.4"/>
  <text x="660.0" y="485.0" text-anchor="middle" class="accink" font-size="14" font-weight="700">Feed-forward</text>
  <path class="line" d="M790 480 H798 V528 H378" marker-end="url(#a)"/>
  <circle class="card" cx="360" cy="528" r="14" stroke-width="2"/>
  <text x="360" y="535" text-anchor="middle" class="ink" font-size="20" font-weight="700">+</text>
  <rect class="hit" x="840" y="457" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="473" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">2.6</text>
  <text x="910" y="473" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Feed-forward → The transformer block</text>
  <rect class="hit" x="840" y="513" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="529" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">9</text>
  <text x="910" y="529" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Residual (skip) connections</text>
  <text x="300" y="439" text-anchor="end" class="muted mono" font-size="12" font-weight="600">3 × 768 in,</text>
  <text x="300" y="457" text-anchor="end" class="muted mono" font-size="12" font-weight="600">3 × 768 out</text>
  <text x="300" y="489" text-anchor="end" class="muted" font-size="12" font-weight="600">each layer adds</text>
  <text x="300" y="505" text-anchor="end" class="muted" font-size="12" font-weight="600">an update</text>
  <path class="line" d="M360 556 V580 H560 V594" marker-end="url(#a)"/>
  <rect class="heat" x="330" y="598" width="460" height="44" rx="10" stroke-width="1.4"/>
  <text x="560.0" y="625.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Final norm</text>
  <rect class="hit" x="840" y="605" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="621" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">7</text>
  <text x="910" y="621" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Layer normalization</text>
  <line class="line" x1="560" y1="642" x2="560" y2="660" marker-end="url(#a)"/>
  <rect class="hit" x="330" y="664" width="460" height="44" rx="10" stroke-width="1.4"/>
  <text x="560.0" y="691.0" text-anchor="middle" class="accink" font-size="14" font-weight="700">Linear: a score for every token in the vocabulary</text>
  <text x="300" y="675" text-anchor="end" class="muted mono" font-size="12" font-weight="600">50,257 scores</text>
  <text x="300" y="692" text-anchor="end" class="muted" font-size="12" font-weight="600">one per token in the vocabulary;</text>
  <text x="300" y="708" text-anchor="end" class="muted" font-size="12" font-weight="600">GPT-2 knows 50,257 tokens</text>
  <rect class="hit" x="840" y="671" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="687" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">2.7</text>
  <text x="910" y="687" text-anchor="start" class="ink" font-size="13.5" font-weight="600">Output &amp; inference</text>
  <line class="line" x1="560" y1="708" x2="560" y2="726" marker-end="url(#a)"/>
  <rect class="possoft" x="330" y="730" width="460" height="44" rx="10" stroke-width="1.4"/>
  <text x="560.0" y="749" text-anchor="middle" class="posink" font-size="14" font-weight="700">Softmax → probabilities</text>
  <text x="560.0" y="766" text-anchor="middle" class="muted" font-size="12">next token: “on” 61% · “down” 20% · …</text>
  <text x="300" y="757" text-anchor="end" class="muted mono" font-size="12" font-weight="600">pick one, append, repeat</text>
  <rect class="hit" x="840" y="737" width="58" height="22" rx="11" stroke-width="1.2"/>
  <text x="869" y="753" text-anchor="middle" class="accink mono" font-size="11.5" font-weight="700">1</text>
  <text x="910" y="753" text-anchor="start" class="ink" font-size="13.5" font-weight="600">The loop</text>
</svg>
