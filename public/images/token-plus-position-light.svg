<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Token embedding plus position embedding</title>
  <desc id="d">For the text "The cat sat", each token gets two lookups. Token embedding, what the word is: The = [0.5, 0.1, −0.3, 0.2], cat = [0.2, −0.4, 0.7, 0.1], sat = [−0.1, 0.6, 0.2, −0.5]. Position embedding, where it sits: position 0 = [0.0, 0.5, 0.1, 0.3], position 1 = [0.1, 0.3, −0.2, 0.4], position 2 = [−0.3, 0.2, 0.4, 0.1]. Adding them number by number gives the input vectors: The = [0.5, 0.6, −0.2, 0.5], cat = [0.3, −0.1, 0.5, 0.5], sat = [−0.4, 0.8, 0.6, −0.4]. The rows are stacked into a 3 by 4 input matrix that goes into transformer layer 1, which reads all rows at once. Bottom: the same word in a different seat. cat in position 1 gives [0.3, −0.1, 0.5, 0.5]; cat in position 5 gives [0.6, −0.7, 0.8, −0.1]; they differ, so the model can tell where the word is. Values are illustrative.</desc>
