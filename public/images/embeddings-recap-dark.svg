<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Embeddings in one picture</title>
  <desc id="d">The path: 1, token IDs from the tokenizer, such as 40, 3021, 8325 for "I love Apple". 2, the embedding table, vocab by d, with one learned row per token; each ID picks its row. 3, vectors of d numbers each, with no context yet. 4, position is added so word order counts: dog bites man is not man bites dog; modern models use RoPE. 5, the result is a matrix with one row per token, the residual stream, which is the input to attention. Next, attention mixes in context, so "Apple" after "I love" differs from "Apple shares fell". What this means: relationships, not definitions, since a vector means something by where it sits and no single number has its own meaning; width is a design choice, 768 in GPT-2 and 12,288 in GPT-3; close means similar, measured by cosine similarity, but similar is not the same as true, safe or correct; token vs sentence embeddings, one vector per token as LLM input versus one vector per text for search and RAG; order is added separately, with RoPE in modern models; and bias comes along from human text, so test for it.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="630" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Embeddings in one picture</text>
  <text x="40" y="78" class="muted" font-size="15">How token IDs become vectors the model can work with, and what that means for you.</text>
    <rect class="card" x="40" y="104" width="192" height="128" rx="12"/>
    <text x="136" y="132" text-anchor="middle" class="muted head" font-size="12.5">1 · TOKEN IDS</text>
    <text x="136" y="170" text-anchor="middle" class="ink mono" font-size="18" font-weight="700">40 3021 8325</text>
    <text x="136" y="194" text-anchor="middle" class="accink mono" font-size="13">I · ␣love · ␣Apple</text>
    <text x="136" y="218" text-anchor="middle" class="muted" font-size="12">from the tokenizer</text>
    <rect class="accsoft" x="272" y="104" width="192" height="128" rx="12" stroke-width="2"/>
    <text x="368" y="132" text-anchor="middle" class="accink head" font-size="12.5">2 · EMBEDDING TABLE</text>
    <text x="368" y="170" text-anchor="middle" class="ink mono" font-size="18" font-weight="700">vocab × d</text>
    <text x="368" y="194" text-anchor="middle" class="ink" font-size="13">one learned row per token</text>
    <text x="368" y="218" text-anchor="middle" class="muted" font-size="12">each ID picks its row</text>
    <line class="line" x1="236" y1="168" x2="266" y2="168" marker-end="url(#a)"/>
    <rect class="card" x="504" y="104" width="192" height="128" rx="12"/>
    <text x="600" y="132" text-anchor="middle" class="muted head" font-size="12.5">3 · VECTORS</text>
    <text x="600" y="170" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">[0.12, −0.48, …]</text>
    <text x="600" y="194" text-anchor="middle" class="ink" font-size="13">d numbers each</text>
    <text x="600" y="218" text-anchor="middle" class="muted" font-size="12">no context yet</text>
    <line class="line" x1="468" y1="168" x2="498" y2="168" marker-end="url(#a)"/>
    <rect class="card" x="736" y="104" width="192" height="128" rx="12"/>
    <text x="832" y="132" text-anchor="middle" class="muted head" font-size="12.5">4 · + POSITION</text>
    <text x="832" y="170" text-anchor="middle" class="ink" font-size="17" font-weight="700">word order</text>
    <text x="832" y="194" text-anchor="middle" class="ink" font-size="13">RoPE in modern models</text>
    <text x="832" y="218" text-anchor="middle" class="muted" font-size="12">dog bites man ≠ man bites dog</text>
    <line class="line" x1="700" y1="168" x2="730" y2="168" marker-end="url(#a)"/>
    <rect class="card" x="968" y="104" width="192" height="128" rx="12"/>
    <text x="1064" y="132" text-anchor="middle" class="muted head" font-size="12.5">5 · MATRIX [n, d]</text>
    <text x="1064" y="170" text-anchor="middle" class="ink" font-size="17" font-weight="700">residual stream</text>
    <text x="1064" y="194" text-anchor="middle" class="ink" font-size="13">one row per token</text>
    <text x="1064" y="218" text-anchor="middle" class="muted" font-size="12">input to attention</text>
    <line class="line" x1="932" y1="168" x2="962" y2="168" marker-end="url(#a)"/>
    <path class="line" d="M1064 236 V 254 H 136 V 236" fill="none"/>
    <text x="600" y="276" text-anchor="middle" class="muted" font-size="13">Next, attention mixes in context: “Apple” after “I love” vs “Apple shares fell”.</text>
    <text x="40" y="316" text-anchor="start" class="muted head" font-size="13">WHAT THIS MEANS</text>
    <rect class="card" x="40" y="334" width="360" height="124" rx="12"/>
    <text x="60" y="366" text-anchor="start" class="ink" font-size="16" font-weight="700">Relationships, not definitions</text>
    <text x="60" y="392" text-anchor="start" class="muted" font-size="13.5">A vector means something by where it</text>
    <text x="60" y="411" text-anchor="start" class="muted" font-size="13.5">sits. Related words land close. No single</text>
    <text x="60" y="430" text-anchor="start" class="muted" font-size="13.5">number has its own meaning.</text>
    <rect class="card" x="420" y="334" width="360" height="124" rx="12"/>
    <text x="440" y="366" text-anchor="start" class="ink" font-size="16" font-weight="700">Width is a design choice</text>
    <text x="440" y="392" text-anchor="start" class="muted" font-size="13.5">d is set before training: 768 in GPT-2,</text>
    <text x="440" y="411" text-anchor="start" class="muted" font-size="13.5">12,288 in GPT-3. Wider can capture more,</text>
    <text x="440" y="430" text-anchor="start" class="muted" font-size="13.5">but costs more memory and compute.</text>
    <rect class="card" x="800" y="334" width="360" height="124" rx="12"/>
    <text x="820" y="366" text-anchor="start" class="ink" font-size="16" font-weight="700">Close = similar</text>
    <text x="820" y="392" text-anchor="start" class="muted" font-size="13.5">Cosine similarity compares direction:</text>
    <text x="820" y="411" text-anchor="start" class="muted" font-size="13.5">1 same, 0 unrelated. Similar is not the</text>
    <text x="820" y="430" text-anchor="start" class="muted" font-size="13.5">same as true, safe or correct.</text>
    <rect class="card" x="40" y="474" width="360" height="124" rx="12"/>
    <text x="60" y="506" text-anchor="start" class="ink" font-size="16" font-weight="700">Token vs sentence</text>
    <text x="60" y="532" text-anchor="start" class="muted" font-size="13.5">LLM input: one vector per token, no</text>
    <text x="60" y="551" text-anchor="start" class="muted" font-size="13.5">context. Search and RAG: one vector per</text>
    <text x="60" y="570" text-anchor="start" class="muted" font-size="13.5">text, from a whole embedding model.</text>
    <rect class="card" x="420" y="474" width="360" height="124" rx="12"/>
    <text x="440" y="506" text-anchor="start" class="ink" font-size="16" font-weight="700">Order is added separately</text>
    <text x="440" y="532" text-anchor="start" class="muted" font-size="13.5">Vectors alone are a bag of words.</text>
    <text x="440" y="551" text-anchor="start" class="muted" font-size="13.5">Position tells the model which came</text>
    <text x="440" y="570" text-anchor="start" class="muted" font-size="13.5">first. Modern models use RoPE.</text>
    <rect class="heat" x="800" y="474" width="360" height="124" rx="12" stroke-width="2"/>
    <text x="820" y="506" text-anchor="start" class="heatink" font-size="16" font-weight="700">Bias comes along</text>
    <text x="820" y="532" text-anchor="start" class="ink" font-size="13.5">Learned from human text, stereotypes</text>
    <text x="820" y="551" text-anchor="start" class="ink" font-size="13.5">included. It doesn't fix itself: test</text>
    <text x="820" y="570" text-anchor="start" class="ink" font-size="13.5">for it in what you build.</text>
</svg>
