  <text x="210" y="550" text-anchor="middle" class="ink" font-size="15">24 layers × 12 × 1,856²</text>
  <text x="210" y="574" text-anchor="middle" class="accink" font-size="16" font-weight="700">≈ 0.99 billion parameters</text>

