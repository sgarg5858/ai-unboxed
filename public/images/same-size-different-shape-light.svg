  <text x="570" y="550" text-anchor="middle" class="ink" font-size="15">48 layers × 12 × 1,312²</text>
  <text x="570" y="574" text-anchor="middle" class="accink" font-size="16" font-weight="700">≈ 0.99 billion parameters</text>

  <rect class="card" x="780" y="104" width="380" height="486" rx="14"/>
  <text x="800" y="134" class="muted head">AFTER TRAINING ON THE SAME DATA</text>
  <text x="800" y="174" class="ink" font-size="15" font-weight="600">A · wide</text>
  <rect class="sunk" x="900" y="160" width="236" height="20" rx="6"/>
  <rect class="pos" x="900" y="160" width="196" height="20" rx="6"/>
  <text x="800" y="210" class="ink" font-size="15" font-weight="600">B · deep</text>
  <rect class="sunk" x="900" y="196" width="236" height="20" rx="6"/>
  <rect class="pos" x="900" y="196" width="199" height="20" rx="6"/>
  <text x="800" y="252" class="posink" font-size="22" font-weight="700">Almost the same quality</text>
  <g class="muted" font-size="14.5">
    <text x="800" y="282">In scaling-law studies (Kaplan et al., 2020),</text>
    <text x="800" y="302">models of the same size with very different</text>
    <text x="800" y="322">shapes ended up within a few percent of</text>
    <text x="800" y="342">each other. Total size and data matter most.</text>
  </g>
  <line x1="800" y1="372" x2="1140" y2="372" class="thin"/>
  <text x="800" y="402" class="negink head">ONLY EXTREMES HURT</text>
  <rect class="negsoft" x="800" y="420" width="340" height="12" rx="2" stroke-width="1.5"/>
  <rect class="negsoft" x="800" y="436" width="340" height="12" rx="2" stroke-width="1.5"/>
  <text x="970" y="472" text-anchor="middle" class="ink mono" font-size="13">2 layers, d = 6,450 → also ≈ 1B</text>
  <g class="muted" font-size="14.5">
    <text x="800" y="504">Same size again, but too few layers to build</text>
    <text x="800" y="524">up meaning. The opposite extreme, tiny</text>
    <text x="800" y="544">vectors and hundreds of layers, squeezes</text>
    <text x="800" y="564">too much into each token's vector.</text>
  </g>

  <text x="40" y="620" class="muted" font-size="11.5">Counts use 12 × d² per layer and leave out the embedding table. Quality bars are illustrative.</text>
</svg>
