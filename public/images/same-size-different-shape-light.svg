  <text x="60" y="134" class="muted head">A · WIDE AND SHALLOW</text>
  <g class="thin" stroke-width="1.5"><path d="M60 166 v12 M360 166 v12 M60 172 H360"/></g>
  <text x="210" y="160" text-anchor="middle" class="accink mono" font-size="14" font-weight="700">d = 1,856</text>
    <rect class="acc" x="60" y="184.0" width="300" height="11.0" rx="2" opacity="0.55"/>
    <rect class="acc" x="60" y="198.0" width="300" height="11.0" rx="2" opacity="0.55"/>
