<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Same size, different shape</title>
  <desc id="d">Two models with the same number of parameters but different shapes. Model A is wide and shallow: 24 layers, each 1,856 numbers wide. Model B is narrow and deep: 48 layers, each 1,312 numbers wide. Each comes to about 0.99 billion parameters, using 12 times d squared per layer. After training on the same data, both reach almost the same quality. In scaling-law studies (Kaplan et al., 2020), models of the same size with very different shapes ended up within a few percent of each other. Only extreme shapes hurt: for example 2 layers with d = 6,450 is also about 1 billion parameters, but has too few layers to build up meaning. Quality bars are illustrative.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <rect class="bg" width="1200" height="640" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Same size, different shape</text>
  <text x="40" y="78" class="muted" font-size="15">Two ways to spend about 1 billion parameters on layers. Each bar is one layer; its width is d.</text>

