<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The training loop</title>
  <desc id="d">Left: a loop of four steps. 1, forward pass: guess the next words. 2, loss: score the guesses. 3, backprop: find every gradient. 4, update: step every weight. Then the next batch starts the loop again. Right, the words you will hear, with an example: dataset, all the training text, say 1,000,000 sentences. Batch, the examples handled together, 32 sentences. Step, one lap of the loop, one update. Epoch, one full pass over the dataset, 31,250 steps.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="460" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">The training loop</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Four steps, repeated millions of times. Each lap uses a new batch of text.</text>
  <rect class="card" x="40" y="100" width="640" height="340" rx="10"/>
  <text x="60" y="130" text-anchor="start" class="accink head" font-size="12">ONE TRAINING STEP</text>
  <rect class="sunk" x="265" y="132" width="190" height="68" rx="10"/>
  <text x="360" y="161" text-anchor="middle" class="ink" font-size="15" font-weight="700">1  Forward pass</text>
  <text x="360" y="184" text-anchor="middle" class="muted" font-size="12.5">guess the next words</text>
  <rect class="sunk" x="465" y="234" width="190" height="68" rx="10"/>
  <text x="560" y="263" text-anchor="middle" class="ink" font-size="15" font-weight="700">2  Loss</text>
  <text x="560" y="286" text-anchor="middle" class="muted" font-size="12.5">score the guesses</text>
  <rect class="sunk" x="265" y="336" width="190" height="68" rx="10"/>
  <text x="360" y="365" text-anchor="middle" class="ink" font-size="15" font-weight="700">3  Backprop</text>
  <text x="360" y="388" text-anchor="middle" class="muted" font-size="12.5">find every gradient</text>
  <rect class="sunk" x="65" y="234" width="190" height="68" rx="10"/>
  <text x="160" y="263" text-anchor="middle" class="ink" font-size="15" font-weight="700">4  Update</text>
  <text x="160" y="286" text-anchor="middle" class="muted" font-size="12.5">step every weight</text>
  <path class="line" d="M456 166 Q 560 166 560 231" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M560 305 Q 560 370 458 370" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M262 370 Q 160 370 160 305" fill="none" marker-end="url(#a)"/>
  <path class="sacc" d="M160 231 Q 160 166 262 166" fill="none" marker-end="url(#aa)"/>
  <text x="228" y="206" text-anchor="middle" class="accink" font-size="12.5" font-weight="700">next batch</text>
  <text x="360" y="275" text-anchor="middle" class="muted" font-size="14" font-weight="600">repeat</text>
  <rect class="card" x="700" y="100" width="460" height="340" rx="10"/>
  <text x="720" y="130" text-anchor="start" class="muted head" font-size="12">THE WORDS YOU WILL HEAR</text>
  <rect class="sunk" x="720" y="148" width="420" height="60" rx="8"/>
  <text x="736" y="174" text-anchor="start" class="ink" font-size="16" font-weight="700">Dataset</text>
  <text x="736" y="195" text-anchor="start" class="muted" font-size="13">all the training text</text>
  <text x="1124" y="185" text-anchor="end" class="accink" font-size="14" font-weight="700">1,000,000 sentences</text>
  <rect class="sunk" x="720" y="218" width="420" height="60" rx="8"/>
  <text x="736" y="244" text-anchor="start" class="ink" font-size="16" font-weight="700">Batch</text>
  <text x="736" y="265" text-anchor="start" class="muted" font-size="13">examples handled together</text>
  <text x="1124" y="255" text-anchor="end" class="accink" font-size="14" font-weight="700">32 sentences</text>
  <rect class="sunk" x="720" y="288" width="420" height="60" rx="8"/>
  <text x="736" y="314" text-anchor="start" class="ink" font-size="16" font-weight="700">Step</text>
  <text x="736" y="335" text-anchor="start" class="muted" font-size="13">one lap of the loop</text>
  <text x="1124" y="325" text-anchor="end" class="accink" font-size="14" font-weight="700">1 update</text>
  <rect class="sunk" x="720" y="358" width="420" height="60" rx="8"/>
  <text x="736" y="384" text-anchor="start" class="ink" font-size="16" font-weight="700">Epoch</text>
  <text x="736" y="405" text-anchor="start" class="muted" font-size="13">one full pass over the dataset</text>
  <text x="1124" y="395" text-anchor="end" class="accink" font-size="14" font-weight="700">31,250 steps</text>
</svg>
