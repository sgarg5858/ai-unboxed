<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Residual connections</title>
  <desc id="d">Residual connections inside a transformer block, repeated N times. The input x goes through layer norm and multi-head attention (causal: looks back only); meanwhile a residual line copies x around them and adds it back at a plus sign. Then the result goes through layer norm and feed-forward (each token on its own), and a second residual line copies it around and adds it back. The output goes to the next block. As numbers: "it" goes into attention as [1, 2, 3]; attention’s update is [0.2, −0.5, 0.7]; adding gives [1.2, 1.5, 3.7]: 1 + 0.2, 2 − 0.5, 3 + 0.7. The old vector, nudged.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="50" text-anchor="start" class="ink" font-size="26" font-weight="700">Residual connections: add, don’t replace</text>
  <text x="40" y="76" text-anchor="start" class="muted" font-size="15">Each step’s output is added onto the vector that went in. The vector is a running total.</text>
  <rect class="card" x="40.0" y="96.0" width="500.0" height="474.0" rx="14" stroke-width="1.2"/>
  <rect class="sunk" x="60.0" y="112.0" width="460.0" height="442.0" rx="12"/>
  <text x="78" y="138" text-anchor="start" class="accink mono" font-size="12" font-weight="700">TRANSFORMER BLOCK × N</text>
  <line class="line" x1="250" y1="116" x2="250" y2="160" />
  <text x="260" y="132" text-anchor="start" class="muted" font-size="12" font-weight="600">x in</text>
  <circle class="pos" cx="250" cy="160" r="3.5"/>
  <path class="spos" d="M250 160 H450 V304 H269" marker-end="url(#ap)"/>
  <text x="370.0" y="153" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Residual (copy x)</text>
  <line class="line" x1="250" y1="160" x2="250" y2="172" marker-end="url(#a)"/>
  <rect class="heat" x="140.0" y="176.0" width="220.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="199.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Layer norm</text>
  <line class="line" x1="250" y1="212" x2="250" y2="226" marker-end="url(#a)"/>
  <rect class="hit" x="140.0" y="230.0" width="220.0" height="46.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="251" text-anchor="middle" class="accink" font-size="14" font-weight="700">Multi-head attention</text>
  <text x="250" y="268" text-anchor="middle" class="muted" font-size="12">causal: looks back only</text>
  <line class="line" x1="250" y1="276" x2="250" y2="285" marker-end="url(#a)"/>
  <circle class="card" cx="250" cy="304" r="15" stroke-width="2"/>
  <text x="250" y="311" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <line class="line" x1="250" y1="319" x2="250" y2="332"/>
  <circle class="pos" cx="250" cy="332" r="3.5"/>
  <path class="spos" d="M250 332 H450 V476 H269" marker-end="url(#ap)"/>
  <text x="370.0" y="325" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Residual</text>
  <line class="line" x1="250" y1="332" x2="250" y2="344" marker-end="url(#a)"/>
  <rect class="heat" x="140.0" y="348.0" width="220.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="371.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Layer norm</text>
  <line class="line" x1="250" y1="384" x2="250" y2="398" marker-end="url(#a)"/>
  <rect class="hit" x="140.0" y="402.0" width="220.0" height="46.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="423" text-anchor="middle" class="accink" font-size="14" font-weight="700">Feed-forward</text>
  <text x="250" y="440" text-anchor="middle" class="muted" font-size="12">each token on its own</text>
  <line class="line" x1="250" y1="448" x2="250" y2="457" marker-end="url(#a)"/>
  <circle class="card" cx="250" cy="476" r="15" stroke-width="2"/>
  <text x="250" y="483" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <line class="line" x1="250" y1="491" x2="250" y2="520" marker-end="url(#a)"/>
  <text x="260" y="516" text-anchor="start" class="muted" font-size="12" font-weight="600">x out → next block</text>
  <text x="78" y="540" text-anchor="start" class="muted" font-size="12">Green: the input is copied around each step and added back at +.</text>
  <rect class="card" x="580.0" y="96.0" width="580.0" height="474.0" rx="14" stroke-width="1.2"/>
  <text x="600" y="124" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">THE SAME ADDITION, AS NUMBERS</text>
  <text x="600" y="152" text-anchor="start" class="ink" font-size="14" font-weight="600">“it” going into attention:  [1, 2, 3]</text>
  <text x="600" y="174" text-anchor="start" class="accink" font-size="14" font-weight="600">attention’s update:  [0.2, −0.5, 0.7]</text>
  <rect class="card" x="670.0" y="390.0" width="70.0" height="80.0" rx="4" stroke-width="1.4"/>
  <rect class="acc" x="670.0" y="374.0" width="70.0" height="16.0" rx="4"/>
  <text x="705.0" y="364.0" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">1.2</text>
  <text x="705.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">1 + 0.2</text>
  <rect class="card" x="830.0" y="310.0" width="70.0" height="160.0" rx="4" stroke-width="1.4"/>
  <rect class="negsoft" x="830.0" y="310.0" width="70.0" height="40.0" rx="4" stroke-width="1.4"/>
  <text x="865.0" y="300" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">1.5</text>
  <text x="865.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">2 − 0.5</text>
  <rect class="card" x="990.0" y="230.0" width="70.0" height="240.0" rx="4" stroke-width="1.4"/>
  <rect class="acc" x="990.0" y="174.0" width="70.0" height="56.0" rx="4"/>
  <text x="1025.0" y="164.0" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">3.7</text>
  <text x="1025.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">3 + 0.7</text>
  <line class="thin" x1="650" y1="470" x2="1140" y2="470"/>
  <rect class="card" x="600.0" y="516.0" width="14.0" height="14.0" rx="3" stroke-width="1.4"/>
  <text x="620" y="528" text-anchor="start" class="muted" font-size="12.5">what it already had</text>
  <rect class="acc" x="780.0" y="516.0" width="14.0" height="14.0" rx="3"/>
  <text x="800" y="528" text-anchor="start" class="muted" font-size="12.5">added</text>
  <rect class="negsoft" x="880.0" y="516.0" width="14.0" height="14.0" rx="3" stroke-width="1.4"/>
  <text x="900" y="528" text-anchor="start" class="muted" font-size="12.5">taken away</text>
  <text x="600" y="552" text-anchor="start" class="ink" font-size="13.5" font-weight="700">Result: [1.2, 1.5, 3.7], the old vector, nudged.</text>
</svg>
