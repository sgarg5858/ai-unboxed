  <text x="58" y="252" class="accink mono" font-size="17" font-weight="700">␣cat</text>
  <text x="232" y="252" text-anchor="end" class="ink mono" font-size="16">8415</text>
  <g class="line"><line x1="254" y1="245" x2="292" y2="245" marker-end="url(#a)"/></g>
  <rect class="acc" x="300" y="228" width="54" height="34" rx="6" opacity="0.31"/>
  <text x="327.0" y="250.0" text-anchor="middle" class="ink mono" font-size="12">0.21</text>
