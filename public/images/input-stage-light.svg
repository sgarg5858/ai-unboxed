  <text x="598" y="252" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <text x="626" y="252" class="muted mono" font-size="12">p1</text>
  <rect class="acc" x="650" y="228" width="40" height="34" rx="6" opacity="0.33"/>
  <rect class="acc" x="694" y="228" width="40" height="34" rx="6" opacity="0.28"/>
  <rect class="acc" x="738" y="228" width="40" height="34" rx="6" opacity="0.18"/>
  <text x="802.0" y="250.0" text-anchor="middle" class="muted" font-size="16">…</text>
  <rect class="acc" x="826" y="228" width="40" height="34" rx="6" opacity="0.37"/>
  <g class="line"><line x1="868" y1="245" x2="896" y2="245" marker-end="url(#a)"/></g>
  <rect class="acc" x="904" y="228" width="46" height="34" rx="6" opacity="0.47"/>
