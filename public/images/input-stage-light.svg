  <rect class="heatfill" x="954" y="228" width="46" height="34" rx="6" opacity="0.41"/>
  <text x="977.0" y="250.0" text-anchor="middle" class="ink mono" font-size="11.5">−0.37</text>
  <rect class="acc" x="1004" y="228" width="46" height="34" rx="6" opacity="0.73"/>
  <text x="1027.0" y="250.0" text-anchor="middle" class="ink mono" font-size="11.5">0.88</text>
  <text x="1077.0" y="250.0" text-anchor="middle" class="muted" font-size="16">…</text>
  <rect class="acc" x="1104" y="228" width="46" height="34" rx="6" opacity="0.78"/>
  <text x="1127.0" y="250.0" text-anchor="middle" class="ink mono" font-size="11.5">0.96</text>
  <rect class="card" x="40" y="290" width="210" height="50" rx="10"/>
  <text x="58" y="322" class="accink mono" font-size="17" font-weight="700">␣sat</text>
  <text x="232" y="322" text-anchor="end" class="ink mono" font-size="16">7731</text>
  <g class="line"><line x1="254" y1="315" x2="292" y2="315" marker-end="url(#a)"/></g>
  <rect class="heatfill" x="300" y="298" width="54" height="34" rx="6" opacity="0.43"/>
  <text x="327.0" y="320.0" text-anchor="middle" class="ink mono" font-size="12">−0.40</text>
  <rect class="acc" x="358" y="298" width="54" height="34" rx="6" opacity="0.35"/>
  <text x="385.0" y="320.0" text-anchor="middle" class="ink mono" font-size="12">0.27</text>
  <rect class="acc" x="416" y="298" width="54" height="34" rx="6" opacity="0.30"/>
  <text x="443.0" y="320.0" text-anchor="middle" class="ink mono" font-size="12">0.19</text>
  <text x="501.0" y="320.0" text-anchor="middle" class="muted" font-size="16">…</text>
  <rect class="heatfill" x="532" y="298" width="54" height="34" rx="6" opacity="0.50"/>
  <text x="559.0" y="320.0" text-anchor="middle" class="ink mono" font-size="12">−0.51</text>
  <text x="598" y="322" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <text x="626" y="322" class="muted mono" font-size="12">p2</text>
  <rect class="acc" x="650" y="298" width="40" height="34" rx="6" opacity="0.35"/>
