  <g class="line"><line x1="868" y1="315" x2="896" y2="315" marker-end="url(#a)"/></g>
  <rect class="heatfill" x="904" y="298" width="46" height="34" rx="6" opacity="0.26"/>
  <text x="927.0" y="320.0" text-anchor="middle" class="ink mono" font-size="11.5">−0.13</text>
