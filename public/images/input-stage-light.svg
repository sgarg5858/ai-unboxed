  <text x="232" y="182" text-anchor="end" class="ink mono" font-size="16">791</text>
  <g class="line"><line x1="254" y1="175" x2="292" y2="175" marker-end="url(#a)"/></g>
  <rect class="acc" x="300" y="158" width="54" height="34" rx="6" opacity="0.38"/>
