  <text x="977.0" y="320.0" text-anchor="middle" class="ink mono" font-size="11.5">0.15</text>
  <rect class="acc" x="1004" y="298" width="46" height="34" rx="6" opacity="0.30"/>
  <text x="1027.0" y="320.0" text-anchor="middle" class="ink mono" font-size="11.5">0.20</text>
  <text x="1077.0" y="320.0" text-anchor="middle" class="muted" font-size="16">…</text>
  <rect class="heatfill" x="1104" y="298" width="46" height="34" rx="6" opacity="0.31"/>
  <text x="1127.0" y="320.0" text-anchor="middle" class="ink mono" font-size="11.5">−0.21</text>
  <rect class="dash" x="896" y="150" width="268" height="190" rx="12" fill="none"/>
  <text x="1030" y="364" text-anchor="middle" class="ink" font-size="13">3 rows (n tokens) × d columns</text>
  <text x="300" y="364" class="muted" font-size="13">one row of the embedding table per token</text>
  <text x="650" y="364" class="muted" font-size="13">a position pattern for slot 0, 1, 2…</text>
  <rect class="sunk" x="40" y="396" width="1120" height="132" rx="12"/>
  <text x="64" y="428" class="ink" font-size="16" font-weight="700">What each step gives the model</text>
  <text x="64" y="458" class="ink" font-size="15">• <tspan font-weight="700">Embeddings</tspan> give each token a meaning: similar words get similar rows.</text>
  <text x="64" y="484" class="ink" font-size="15">• <tspan font-weight="700">Position</tspan> tells it word order, so "dog bites man" ≠ "man bites dog". (With RoPE, this happens later, inside attention.)</text>
  <text x="64" y="510" class="ink" font-size="15">• The <tspan font-weight="700">residual stream</tspan> keeps this [n, d] shape through every layer. Context (which "bank"?) is added by attention next.</text>
  <text x="1160" y="548" text-anchor="end" class="muted" font-size="11">IDs are GPT-4's real ones (cl100k_base). Vector values are illustrative.</text>
</svg>
