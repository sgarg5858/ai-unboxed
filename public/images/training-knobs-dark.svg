<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Learning = turning knobs</title>
  <desc id="d">Left, before training: six knobs pointing in random directions, and the model completes “The sky is …” with “banana”, which is wrong. An arrow labelled “training, many small turns” leads to the right: the same knobs, now set carefully, and the model answers “blue”, which is right. Each knob is one parameter, a weight or a bias. GPT-3 has 175 billion of them.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="450" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Learning = turning knobs</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">A model is a huge set of numbers. Training adjusts them until the guesses come out right.</text>
  <rect class="card" x="40" y="100" width="480" height="260" rx="10"/>
  <text x="60" y="130" text-anchor="start" class="muted head" font-size="12">BEFORE TRAINING</text>
  <circle class="card" cx="100" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="100" y1="190" x2="85.3" y2="198.5" stroke-linecap="round"/>
  <circle class="arrowhead" cx="100" cy="190" r="4"/>
  <circle class="card" cx="172" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="172" y1="190" x2="182.9" y2="177.0" stroke-linecap="round"/>
  <circle class="arrowhead" cx="172" cy="190" r="4"/>
  <circle class="card" cx="244" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="244" y1="190" x2="252.5" y2="204.7" stroke-linecap="round"/>
  <circle class="arrowhead" cx="244" cy="190" r="4"/>
  <circle class="card" cx="316" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="316" y1="190" x2="307.5" y2="175.3" stroke-linecap="round"/>
  <circle class="arrowhead" cx="316" cy="190" r="4"/>
  <circle class="card" cx="388" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="388" y1="190" x2="404.9" y2="191.5" stroke-linecap="round"/>
  <circle class="arrowhead" cx="388" cy="190" r="4"/>
  <circle class="card" cx="460" cy="190" r="24" stroke-width="2"/>
  <line class="line" x1="460" y1="190" x2="454.2" y2="206.0" stroke-linecap="round"/>
  <circle class="arrowhead" cx="460" cy="190" r="4"/>
  <text x="280" y="245" text-anchor="middle" class="muted" font-size="13">random settings</text>
  <rect class="negsoft" x="70" y="270" width="420" height="60" rx="10" stroke-width="1.5"/>
  <text x="280" y="306" text-anchor="middle" class="negink" font-size="17" font-weight="700">“The sky is …” → banana ✗</text>
  <rect class="card" x="680" y="100" width="480" height="260" rx="10"/>
  <text x="700" y="130" text-anchor="start" class="accink head" font-size="12">AFTER TRAINING</text>
  <circle class="card" cx="740" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="740" y1="190" x2="748.5" y2="175.3" stroke-linecap="round"/>
  <circle class="acc" cx="740" cy="190" r="4"/>
  <circle class="card" cx="812" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="812" y1="190" x2="800.0" y2="178.0" stroke-linecap="round"/>
  <circle class="acc" cx="812" cy="190" r="4"/>
  <circle class="card" cx="884" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="884" y1="190" x2="898.7" y2="181.5" stroke-linecap="round"/>
  <circle class="acc" cx="884" cy="190" r="4"/>
  <circle class="card" cx="956" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="956" y1="190" x2="959.0" y2="173.3" stroke-linecap="round"/>
  <circle class="acc" cx="956" cy="190" r="4"/>
  <circle class="card" cx="1028" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="1028" y1="190" x2="1011.3" y2="187.0" stroke-linecap="round"/>
  <circle class="acc" cx="1028" cy="190" r="4"/>
  <circle class="card" cx="1100" cy="190" r="24" stroke-width="2"/>
  <line class="sacc" x1="1100" y1="190" x2="1112.0" y2="178.0" stroke-linecap="round"/>
  <circle class="acc" cx="1100" cy="190" r="4"/>
  <text x="920" y="245" text-anchor="middle" class="muted" font-size="13">tuned settings</text>
  <rect class="possoft" x="710" y="270" width="420" height="60" rx="10" stroke-width="1.5"/>
  <text x="920" y="306" text-anchor="middle" class="posink" font-size="17" font-weight="700">“The sky is …” → blue ✓</text>
  <text x="600" y="210" text-anchor="middle" class="accink" font-size="15" font-weight="700">training</text>
  <path class="sacc" d="M535 225 H 665" fill="none" marker-end="url(#aa)"/>
  <text x="600" y="250" text-anchor="middle" class="muted" font-size="12.5">many small turns</text>
  <rect class="accsoft" x="40" y="380" width="1120" height="44" rx="8" stroke-width="1.5"/>
  <text x="600" y="408" text-anchor="middle" class="accink" font-size="15" font-weight="700">Each knob is one parameter: a weight or a bias. GPT-3 has 175 billion of them.</text>
</svg>
