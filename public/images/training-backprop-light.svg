<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Backpropagation: who is to blame?</title>
  <desc id="d">Top arrow, left to right: the forward pass takes “The sky is” through layers A, B and C and guesses “banana”, with loss 3.00. Bottom arrow, right to left: the backward pass goes from the loss back through layer C, then B, then A, and finds each weight’s gradient. In layer C, weight 1 has gradient +2.0, so turn it down, and weight 2 has −0.4, so turn it up. Layer B has +0.9 and −1.1; layer A has +0.1 and −0.3. A gradient of +2.0 means raising this weight raises the loss, so it should go down. A bigger number means more blame.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="440" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Backpropagation: who is to blame?</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Start at the loss and walk backwards, working out how much each weight contributed to the mistake.</text>
  <rect class="accsoft" x="40" y="170" width="130" height="110" rx="10"/>
  <text x="105" y="220" text-anchor="middle" class="accink" font-size="15" font-weight="700">“The sky</text>
  <text x="105" y="242" text-anchor="middle" class="accink" font-size="15" font-weight="700">is”</text>
  <rect class="card" x="210" y="160" width="190" height="130" rx="10"/>
  <text x="305" y="188" text-anchor="middle" class="ink" font-size="15" font-weight="700">Layer A</text>
  <text x="228" y="222" text-anchor="start" class="muted mono" font-size="13">w1</text>
  <text x="262" y="222" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">+0.1</text>
  <text x="310" y="222" text-anchor="start" class="muted" font-size="12.5">→ turn down</text>
  <text x="228" y="252" text-anchor="start" class="muted mono" font-size="13">w2</text>
  <text x="262" y="252" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">−0.3</text>
  <text x="310" y="252" text-anchor="start" class="muted" font-size="12.5">→ turn up</text>
  <rect class="card" x="440" y="160" width="190" height="130" rx="10"/>
  <text x="535" y="188" text-anchor="middle" class="ink" font-size="15" font-weight="700">Layer B</text>
  <text x="458" y="222" text-anchor="start" class="muted mono" font-size="13">w1</text>
  <text x="492" y="222" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">+0.9</text>
  <text x="540" y="222" text-anchor="start" class="muted" font-size="12.5">→ turn down</text>
  <text x="458" y="252" text-anchor="start" class="muted mono" font-size="13">w2</text>
  <text x="492" y="252" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">−1.1</text>
  <text x="540" y="252" text-anchor="start" class="muted" font-size="12.5">→ turn up</text>
  <rect class="card" x="670" y="160" width="190" height="130" rx="10"/>
  <text x="765" y="188" text-anchor="middle" class="ink" font-size="15" font-weight="700">Layer C</text>
  <text x="688" y="222" text-anchor="start" class="muted mono" font-size="13">w1</text>
  <text x="722" y="222" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">+2.0</text>
  <text x="770" y="222" text-anchor="start" class="muted" font-size="12.5">→ turn down</text>
  <text x="688" y="252" text-anchor="start" class="muted mono" font-size="13">w2</text>
  <text x="722" y="252" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">−0.4</text>
  <text x="770" y="252" text-anchor="start" class="muted" font-size="12.5">→ turn up</text>
  <rect class="negsoft" x="900" y="170" width="110" height="110" rx="10" stroke-width="1.5"/>
  <text x="955" y="222" text-anchor="middle" class="negink" font-size="16" font-weight="700">banana</text>
  <text x="955" y="246" text-anchor="middle" class="negink" font-size="16" font-weight="700">✗</text>
  <rect class="negsoft" x="1040" y="170" width="120" height="110" rx="10" stroke-width="1.5"/>
  <text x="1100" y="212" text-anchor="middle" class="negink" font-size="14">loss</text>
  <text x="1100" y="244" text-anchor="middle" class="negink" font-size="24" font-weight="700">3.00</text>
  <path class="line" d="M172 225 H 206" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M402 225 H 436" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M632 225 H 666" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M862 225 H 896" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M1012 225 H 1036" fill="none" marker-end="url(#a)"/>
  <path class="sacc" d="M60 130 H 1140" fill="none" marker-end="url(#aa)"/>
  <text x="600" y="120" text-anchor="middle" class="accink" font-size="14" font-weight="700">forward pass: make a guess</text>
  <path class="sheat" d="M1140 320 H 62" fill="none" marker-end="url(#ah)"/>
  <text x="600" y="346" text-anchor="middle" class="heatink" font-size="14" font-weight="700">backward pass: from the loss back through C, then B, then A, find each weight’s gradient</text>
  <rect class="sunk" x="40" y="370" width="1120" height="48" rx="8"/>
  <text x="600" y="400" text-anchor="middle" class="ink" font-size="14.5" font-weight="600">Gradient +2.0: raising this weight raises the loss. So it should go down. Bigger number, bigger blame.</text>
</svg>
