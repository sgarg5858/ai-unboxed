<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Search engine vs LLM: finding vs generating</title>
  <desc id="d">Two ways to answer “Why is the sky blue?”. A search engine finds: crawlers visit pages ahead of time, an index maps each word to the pages it appears on, and ranking picks the matching pages, best first. The result is a list of links to pages that already exist, so it is up to date and every source can be opened, but you read and combine them yourself. An LLM generates: it is trained once on trillions of tokens, stores patterns as numbers called weights rather than copies of pages, and predicts the next token again and again. The result is new text, such as “Air scatters blue light more than red, so blue reaches your eyes from every part of the sky.” It can explain, summarise and write, but it can be fluent and still wrong. An assistant does both: search finds fresh sources, then the LLM reads them and writes the answer with citations.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Finding vs generating</text>
  <text x="40" y="78" class="muted" font-size="15">Same question, two very different machines.</text>
  <rect class="card" x="40" y="100" width="540" height="380" rx="14"/>
  <text x="60" y="130" class="heatink head" font-size="13">SEARCH ENGINE · FINDS</text>
  <rect class="hit" x="70" y="144" width="480" height="38" rx="10" stroke-width="1.5"/>
  <text x="310" y="168" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">“Why is the sky blue?”</text>
  <rect class="sunk" x="70" y="196" width="480" height="42" rx="10"/>
  <text x="88" y="222" class="ink" font-size="14.5" font-weight="700">1 · Crawl</text>
  <text x="200" y="222" class="muted" font-size="13.5">bots visit pages ahead of time</text>
  <rect class="sunk" x="70" y="246" width="480" height="42" rx="10"/>
  <text x="88" y="272" class="ink" font-size="14.5" font-weight="700">2 · Index</text>
  <text x="200" y="272" class="muted" font-size="13.5">each word → the pages it appears on</text>
  <rect class="sunk" x="70" y="296" width="480" height="42" rx="10"/>
  <text x="88" y="322" class="ink" font-size="14.5" font-weight="700">3 · Rank</text>
  <text x="200" y="322" class="muted" font-size="13.5">pick the matching pages, best first</text>
  <text x="70" y="368" class="muted head" font-size="11.5">RESULT: LINKS TO PAGES THAT ALREADY EXIST</text>
  <rect class="card" x="70" y="378" width="480" height="22" rx="5" stroke-width="1"/>
  <text x="82" y="393.5" class="heatink mono" font-size="12">space-facts.example</text>
  <text x="228.7" y="393.5" class="muted mono" font-size="12">› why-is-the-sky-blue</text>
  <rect class="card" x="70" y="404" width="480" height="22" rx="5" stroke-width="1"/>
  <text x="82" y="419.5" class="heatink mono" font-size="12">physics-for-all.example</text>
  <text x="257.9" y="419.5" class="muted mono" font-size="12">› light › scattering</text>
  <rect class="card" x="70" y="430" width="480" height="22" rx="5" stroke-width="1"/>
  <text x="82" y="445.5" class="heatink mono" font-size="12">weather-school.example</text>
  <text x="250.6" y="445.5" class="muted mono" font-size="12">› sky-colour</text>
  <text x="70" y="474" class="posink" font-size="13" font-weight="700">✓</text>
  <text x="88" y="474" class="ink" font-size="13">Up to date, with sources you can open</text>
  <text x="372" y="474" class="negink" font-size="13" font-weight="700">✕</text>
  <text x="390" y="474" class="ink" font-size="13">You read and combine</text>
  <rect class="card" x="620" y="100" width="540" height="380" rx="14"/>
  <text x="640" y="130" class="accink head" font-size="13">LLM · GENERATES</text>
  <rect class="hit" x="650" y="144" width="480" height="38" rx="10" stroke-width="1.5"/>
  <text x="890" y="168" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">“Why is the sky blue?”</text>
  <rect class="sunk" x="650" y="196" width="480" height="42" rx="10"/>
  <text x="668" y="222" class="ink" font-size="14.5" font-weight="700">1 · Train</text>
  <text x="780" y="222" class="muted" font-size="13.5">read trillions of tokens, once</text>
  <rect class="sunk" x="650" y="246" width="480" height="42" rx="10"/>
  <text x="668" y="272" class="ink" font-size="14.5" font-weight="700">2 · Weights</text>
  <text x="780" y="272" class="muted" font-size="13.5">patterns stored as numbers, not pages</text>
  <rect class="sunk" x="650" y="296" width="480" height="42" rx="10"/>
  <text x="668" y="322" class="ink" font-size="14.5" font-weight="700">3 · Predict</text>
  <text x="780" y="322" class="muted" font-size="13.5">the next token, again and again</text>
  <text x="650" y="368" class="muted head" font-size="11.5">RESULT: NEW TEXT, ONE TOKEN AT A TIME</text>
  <rect class="accsoft" x="650" y="378" width="38" height="22" rx="5" stroke-width="1"/>
  <text x="669" y="393.5" text-anchor="middle" class="accink mono" font-size="12">Air</text>
  <rect class="accsoft" x="694.2" y="378" width="75" height="22" rx="5" stroke-width="1"/>
  <text x="732" y="393.5" text-anchor="middle" class="accink mono" font-size="12">scatters</text>
  <rect class="accsoft" x="775.4000000000001" y="378" width="46" height="22" rx="5" stroke-width="1"/>
  <text x="798" y="393.5" text-anchor="middle" class="accink mono" font-size="12">blue</text>
  <rect class="accsoft" x="827.0000000000001" y="378" width="53" height="22" rx="5" stroke-width="1"/>
  <text x="854" y="393.5" text-anchor="middle" class="accink mono" font-size="12">light</text>
  <rect class="accsoft" x="886.0000000000001" y="378" width="46" height="22" rx="5" stroke-width="1"/>
  <text x="909" y="393.5" text-anchor="middle" class="accink mono" font-size="12">more</text>
  <rect class="accsoft" x="937.6000000000001" y="378" width="23" height="22" rx="5" stroke-width="1"/>
  <text x="949" y="393.5" text-anchor="middle" class="accink mono" font-size="12">…</text>
  <rect class="possoft" x="650" y="408" width="480" height="48" rx="10" stroke-width="1.5"/>
  <text x="890" y="428" text-anchor="middle" class="ink" font-size="13.5" font-weight="600">“Air scatters blue light more than red, so blue</text>
  <text x="890" y="447" text-anchor="middle" class="ink" font-size="13.5" font-weight="600">reaches your eyes from every part of the sky.”</text>
  <text x="650" y="474" class="posink" font-size="13" font-weight="700">✓</text>
  <text x="668" y="474" class="ink" font-size="13">Explains, summarises, writes</text>
  <text x="880" y="474" class="negink" font-size="13" font-weight="700">✕</text>
  <text x="898" y="474" class="ink" font-size="13">Can be fluent and still wrong</text>
  <rect class="accsoft" x="40" y="496" width="1120" height="56" rx="12" stroke-width="1.5"/>
  <text x="600" y="530" text-anchor="middle" class="ink" font-size="16" font-weight="700">An assistant does both: search finds fresh sources → the LLM reads them and writes the answer, with citations.</text>
  <text x="40" y="582" class="muted" font-size="11.5">The website names are made up for illustration.</text>
</svg>
