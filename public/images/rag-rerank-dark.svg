<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Retrieve many, then rerank</title>
  <desc id="d">Left, a funnel: the index holds 1,000,000 chunks. Stage 1, vector plus keyword search, takes milliseconds and narrows them to 50 candidates. Stage 2, a reranker, scores each candidate together with the question and keeps the 5 best chunks, which go into the prompt. Right, two kinds of model. An embedding model, or bi-encoder, used in stage 1, reads the question and each chunk separately and compares their vectors by cosine similarity. Chunk vectors are computed once ahead of time, so it is fast enough for millions, but question and chunk never see each other. A reranker, or cross-encoder, used in stage 2, reads the question and chunk together and outputs a relevance score, for example 0.93. It is more accurate but must run once per pair, so it is too slow for millions.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
  </defs>
  <rect class="bg" width="1200" height="580" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Retrieve many, then rerank</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">A cheap search narrows millions of chunks to a shortlist; a slower, smarter model picks the best few.</text>
  <rect class="card" x="40" y="100" width="560" height="440" rx="14"/>
  <text x="60" y="130" text-anchor="start" class="accink head" font-size="13">A FUNNEL: FAST FIRST, CAREFUL SECOND</text>
  <rect class="acc" x="60.0" y="150" width="520" height="56" rx="10" opacity="0.35"/>
  <text x="320" y="185" text-anchor="middle" class="ink" font-size="19" font-weight="800">1,000,000 chunks</text>
  <line class="line" x1="320" y1="210" x2="320" y2="256" marker-end="url(#a)"/>
  <text x="336" y="230" text-anchor="start" class="muted" font-size="12.5">stage 1: vector + keyword</text>
  <text x="336" y="247" text-anchor="start" class="muted" font-size="12.5">search, in milliseconds</text>
  <rect class="acc" x="140.0" y="260" width="360" height="56" rx="10" opacity="0.65"/>
  <text x="320" y="295" text-anchor="middle" class="ink" font-size="19" font-weight="800">50 candidates</text>
  <line class="line" x1="320" y1="320" x2="320" y2="366" marker-end="url(#a)"/>
  <text x="336" y="340" text-anchor="start" class="muted" font-size="12.5">stage 2: a reranker scores</text>
  <text x="336" y="357" text-anchor="start" class="muted" font-size="12.5">each one with the question</text>
  <rect class="pos" x="220.0" y="370" width="200" height="56" rx="10" opacity="1"/>
  <text x="320" y="405" text-anchor="middle" class="onacc" font-size="19" font-weight="800">5 best chunks</text>
  <line class="line" x1="320" y1="476" x2="320" y2="500" marker-end="url(#a)"/>
  <text x="320" y="522" text-anchor="middle" class="posink" font-size="14" font-weight="700">→ into the prompt</text>
  <rect class="card" x="620" y="100" width="540" height="440" rx="14"/>
  <text x="640" y="130" text-anchor="start" class="muted head" font-size="13">TWO KINDS OF MODEL</text>
  <text x="640" y="162" text-anchor="start" class="accink" font-size="15" font-weight="700">Embedding model (bi-encoder): stage 1</text>
  <rect class="hit" x="660" y="176" width="200" height="32" rx="8" stroke-width="1.5"/>
  <text x="760" y="197" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">question</text>
  <line class="line" x1="760" y1="211" x2="760" y2="229" marker-end="url(#a)"/>
  <rect class="sunk" x="690" y="233" width="140" height="30" rx="8"/>
  <text x="760" y="253" text-anchor="middle" class="ink" font-size="13" font-weight="600">encoder</text>
  <line class="line" x1="760" y1="266" x2="760" y2="284" marker-end="url(#a)"/>
  <text x="760" y="302" text-anchor="middle" class="muted" font-size="12.5" font-weight="600">vector</text>
  <rect class="hit" x="900" y="176" width="200" height="32" rx="8" stroke-width="1.5"/>
  <text x="1000" y="197" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">chunk</text>
  <line class="line" x1="1000" y1="211" x2="1000" y2="229" marker-end="url(#a)"/>
  <rect class="sunk" x="930" y="233" width="140" height="30" rx="8"/>
  <text x="1000" y="253" text-anchor="middle" class="ink" font-size="13" font-weight="600">encoder</text>
  <line class="line" x1="1000" y1="266" x2="1000" y2="284" marker-end="url(#a)"/>
  <text x="1000" y="302" text-anchor="middle" class="muted" font-size="12.5" font-weight="600">vector (stored)</text>
  <path class="dash" d="M800 298 C 830 320, 870 320, 900 298"/>
  <text x="880" y="336" text-anchor="middle" class="accink" font-size="12.5" font-weight="700">compare: cosine</text>
  <text x="640" y="362" text-anchor="start" class="muted" font-size="12.5">Each text is read alone, so chunk vectors are computed once,</text>
  <text x="640" y="379" text-anchor="start" class="muted" font-size="12.5">ahead of time. Fast enough for millions; but question and</text>
  <text x="640" y="396" text-anchor="start" class="muted" font-size="12.5">chunk never see each other.</text>
  <text x="640" y="428" text-anchor="start" class="posink" font-size="15" font-weight="700">Reranker (cross-encoder): stage 2</text>
  <rect class="possoft" x="660" y="442" width="300" height="32" rx="8" stroke-width="1.5"/>
  <text x="810" y="463" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">question + chunk, together</text>
  <line class="line" x1="964" y1="458" x2="990" y2="458" marker-end="url(#a)"/>
  <rect class="sunk" x="994" y="444" width="150" height="30" rx="8"/>
  <text x="1069" y="464" text-anchor="middle" class="ink mono" font-size="13" font-weight="700">relevance 0.93</text>
  <text x="640" y="498" text-anchor="start" class="muted" font-size="12.5">Reads both at once, so it catches what one vector misses.</text>
  <text x="640" y="515" text-anchor="start" class="muted" font-size="12.5">More accurate, but must run per pair: too slow for millions.</text>
  <text x="40" y="562" text-anchor="start" class="muted" font-size="11.5">Counts are typical, not fixed: many systems retrieve 20 to 100 candidates and keep 3 to 10.</text>
</svg>
