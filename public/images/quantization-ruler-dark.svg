  <text x="60" y="192" text-anchor="start" class="ink mono" font-size="17" font-weight="700">£4.99 → £5.00</text>
  <text x="60" y="236" text-anchor="start" class="ink" font-size="13" font-weight="600">16 bits (bf16): ~65,000 values</text>
