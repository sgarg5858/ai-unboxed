  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="470" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">How 4-bit quantization works</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Store each weight with less detail: round it to the nearest of 16 marks.</text>
