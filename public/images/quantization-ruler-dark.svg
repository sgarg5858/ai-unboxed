<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How 4-bit quantization works</title>
  <desc id="d">Left: like rounding a price from £4.99 to £5.00. A 16-bit (bf16) number has about 65,000 possible values, drawn as a ruler with very many fine marks; a 4-bit number has just 16 marks, and each weight is rounded to the nearest one. Right: one group of weights gets its own ruler with marks 0.06 apart, numbered −8 to 7. The weights 0.42, −0.13, 0.08 and −0.22 snap to marks 7, −2, 1 and −4; multiplied back by 0.06 they become 0.42, −0.12, 0.06 and −0.24, each off by at most 0.02. Bottom: a 7B model needs about 14 GB in bf16 and about 3.5 GB at 4 bits; the tiny errors mostly cancel out, so it stays almost as good.</desc>
