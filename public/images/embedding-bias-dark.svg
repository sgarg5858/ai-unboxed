<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Embeddings learn our stereotypes</title>
  <desc id="d">Left: occupation words placed along a "he" to "she" direction found in word vectors trained on Google News. Captain, philosopher, architect, financier and warrior lean towards "he"; homemaker, nurse, receptionist, librarian and hairdresser lean towards "she". Job titles should sit near the middle, with no lean. Above, the analogy "man is to computer programmer as woman is to ?" was answered "homemaker". Nobody programmed this: news text mentions these jobs with "he" or "she" at different rates, and the vectors learned that pattern along with the meaning. Right: where it comes from, human-written text with its stereotypes; where it shows up, search and ranking, CV screening, recommendations, moderation and the chunks RAG retrieves; what helps, swap tests that change only a name or gender and compare results, measuring per group, and keeping humans on high-stakes decisions. Positions are illustrative; word lists and the analogy are from Bolukbasi et al., 2016.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="580" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Embeddings learn our stereotypes</text>
  <text x="40" y="78" class="muted" font-size="15">A stereotype in the training text becomes a direction in the vectors.</text>
    <rect class="card" x="40" y="104" width="700" height="430" rx="14"/>
    <text x="60" y="134" text-anchor="start" class="accink head" font-size="13">OCCUPATIONS ON A “HE ↔ SHE” DIRECTION</text>
    <rect class="sunk" x="60" y="152" width="660" height="54" rx="10"/>
    <text x="390" y="176" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">man : computer programmer  ::  woman : ?</text>
    <text x="390" y="197" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">The vectors answered “homemaker”.</text>
    <line class="line" x1="100" y1="330" x2="680" y2="330" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="100" y="360" text-anchor="start" class="accink" font-size="14" font-weight="700">← “he”</text>
    <text x="680" y="360" text-anchor="end" class="heatink" font-size="14" font-weight="700">“she” →</text>
    <line class="dash" x1="390.0" y1="234" x2="390.0" y2="400"/>
    <text x="390.0" y="418" text-anchor="middle" class="muted" font-size="12.5">job titles should sit near here: no lean</text>
    <line class="thin" x1="135" y1="306" x2="135" y2="323"/>
    <circle class="acc" cx="135" cy="330" r="7"/>
    <text x="135" y="300" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">captain</text>
    <line class="thin" x1="181" y1="274" x2="181" y2="323"/>
    <circle class="acc" cx="181" cy="330" r="7"/>
    <text x="181" y="268" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">philosopher</text>
    <line class="thin" x1="228" y1="306" x2="228" y2="323"/>
    <circle class="acc" cx="228" cy="330" r="7"/>
    <text x="228" y="300" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">architect</text>
    <line class="thin" x1="274" y1="274" x2="274" y2="323"/>
    <circle class="acc" cx="274" cy="330" r="7"/>
    <text x="274" y="268" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">financier</text>
    <line class="thin" x1="320" y1="306" x2="320" y2="323"/>
    <circle class="acc" cx="320" cy="330" r="7"/>
    <text x="320" y="300" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">warrior</text>
    <line class="thin" x1="645" y1="274" x2="645" y2="323"/>
    <circle class="heatfill" cx="645" cy="330" r="7"/>
    <text x="645" y="268" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">homemaker</text>
    <line class="thin" x1="599" y1="306" x2="599" y2="323"/>
    <circle class="heatfill" cx="599" cy="330" r="7"/>
    <text x="599" y="300" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">nurse</text>
    <line class="thin" x1="552" y1="274" x2="552" y2="323"/>
    <circle class="heatfill" cx="552" cy="330" r="7"/>
    <text x="552" y="268" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">receptionist</text>
    <line class="thin" x1="506" y1="306" x2="506" y2="323"/>
    <circle class="heatfill" cx="506" cy="330" r="7"/>
    <text x="506" y="300" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">librarian</text>
    <line class="thin" x1="460" y1="274" x2="460" y2="323"/>
    <circle class="heatfill" cx="460" cy="330" r="7"/>
    <text x="460" y="268" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">hairdresser</text>
    <rect class="heat" x="60" y="448" width="660" height="70" rx="10" stroke-width="1.5"/>
    <text x="78" y="474" text-anchor="start" class="ink" font-size="13.5">Nobody programmed this. News text mentions these jobs with “he” or “she” at</text>
    <text x="78" y="494" text-anchor="start" class="ink" font-size="13.5">different rates, and the vectors learned that pattern along with the meaning.</text>
    <rect class="card" x="760" y="104" width="400" height="430" rx="14"/>
    <rect class="sunk" x="780" y="124" width="360" height="97" rx="10"/>
    <text x="798" y="150" text-anchor="start" class="muted head" font-size="12.5">WHERE IT COMES FROM</text>
    <text x="798" y="174" text-anchor="start" class="ink" font-size="13.5">Human-written text, with its</text>
    <text x="798" y="193" text-anchor="start" class="ink" font-size="13.5">stereotypes. Vectors copy which</text>
    <text x="798" y="212" text-anchor="start" class="ink" font-size="13.5">words appear together.</text>
    <rect class="sunk" x="780" y="235" width="360" height="97" rx="10"/>
    <text x="798" y="261" text-anchor="start" class="negink head" font-size="12.5">WHERE IT SHOWS UP</text>
    <text x="798" y="285" text-anchor="start" class="ink" font-size="13.5">Search and ranking, CV screening,</text>
    <text x="798" y="304" text-anchor="start" class="ink" font-size="13.5">recommendations, moderation,</text>
    <text x="798" y="323" text-anchor="start" class="ink" font-size="13.5">and the chunks RAG retrieves.</text>
    <rect class="sunk" x="780" y="346" width="360" height="116" rx="10"/>
    <text x="798" y="372" text-anchor="start" class="posink head" font-size="12.5">WHAT HELPS</text>
    <text x="798" y="396" text-anchor="start" class="ink" font-size="13.5">Swap tests: change only a name or</text>
    <text x="798" y="415" text-anchor="start" class="ink" font-size="13.5">gender and compare the results.</text>
    <text x="798" y="434" text-anchor="start" class="ink" font-size="13.5">Measure per group. Keep humans</text>
    <text x="798" y="453" text-anchor="start" class="ink" font-size="13.5">on high-stakes decisions.</text>
    <text x="40" y="562" text-anchor="start" class="muted" font-size="11.5">Positions are illustrative. Word lists and the analogy are from Bolukbasi et al. (2016), word2vec vectors trained on Google News.</text>
</svg>
