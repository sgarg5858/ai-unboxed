<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 170" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Where layer normalization sits</title>
  <desc id="d">Where layer normalization sits: input matrix, norm, attention, norm, feed-forward; that layer is repeated N times, 12 in GPT-2 and 32 in Llama 3 8B; then a final norm, then predict the next token.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="sunk" width="1120" height="170" rx="14"/>
  <g transform="translate(-40,0)">
  <text x="64" y="34" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">WHERE IT SITS: BEFORE EACH MAIN STEP, AND ONCE AT THE END</text>
  <rect class="card" x="64" y="66" width="130" height="46" rx="10" stroke-width="1.4"/>
  <text x="129.0" y="94" text-anchor="middle" class="ink" font-size="14" font-weight="700">Input matrix</text>
  <rect class="heat" x="228" y="66" width="82" height="46" rx="10" stroke-width="1.4"/>
  <text x="269.0" y="94" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Norm</text>
  <rect class="hit" x="344" y="66" width="120" height="46" rx="10" stroke-width="1.4"/>
  <text x="404.0" y="94" text-anchor="middle" class="accink" font-size="14" font-weight="700">Attention</text>
  <rect class="heat" x="498" y="66" width="82" height="46" rx="10" stroke-width="1.4"/>
  <text x="539.0" y="94" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Norm</text>
  <rect class="hit" x="614" y="66" width="130" height="46" rx="10" stroke-width="1.4"/>
  <text x="679.0" y="94" text-anchor="middle" class="accink" font-size="14" font-weight="700">Feed-forward</text>
  <rect class="heat" x="778" y="66" width="110" height="46" rx="10" stroke-width="1.4"/>
  <text x="833.0" y="94" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Final norm</text>
  <rect class="card" x="922" y="66" width="170" height="46" rx="10" stroke-width="1.4"/>
  <text x="1007.0" y="94" text-anchor="middle" class="ink" font-size="14" font-weight="700">Predict next token</text>
  <line class="line" x1="197" y1="89" x2="224" y2="89" marker-end="url(#a)"/>
  <line class="line" x1="313" y1="89" x2="340" y2="89" marker-end="url(#a)"/>
  <line class="line" x1="467" y1="89" x2="494" y2="89" marker-end="url(#a)"/>
  <line class="line" x1="583" y1="89" x2="610" y2="89" marker-end="url(#a)"/>
  <line class="line" x1="747" y1="89" x2="774" y2="89" marker-end="url(#a)"/>
  <line class="line" x1="891" y1="89" x2="918" y2="89" marker-end="url(#a)"/>
  <path class="thin" d="M228 126 L228 134 L744 134 L744 126"/>
  <text x="486.0" y="152" text-anchor="middle" class="muted" font-size="12.5" font-weight="600">one transformer layer, repeated N times (12 in GPT-2, 32 in Llama 3 8B)</text>
  </g>
</svg>
