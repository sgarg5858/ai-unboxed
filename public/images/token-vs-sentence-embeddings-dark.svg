<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Token embeddings vs a sentence embedding</title>
  <desc id="d">Two kinds of embedding compared. First, token embeddings: the tokens The, cat and sat each look up their own row in the embedding table, giving three vectors, one per token. They carry no context, so the token cat gets exactly the same vector in every sentence. They are the LLM's input. Second, a sentence embedding: the whole text "The cat sat on the mat" goes through an embedding model, a transformer whose attention mixes context into every token. That gives six context-aware vectors, which are averaged into one vector for the whole text. That vector is compared with other texts by cosine similarity: "A cat was sitting on a rug" scores 0.91 and "Where did the cat sit?" 0.78, while "Stock prices fell today" scores 0.06. Sentence embeddings are used for search, RAG, clustering and recommendations. Vector values and scores are illustrative.</desc>
