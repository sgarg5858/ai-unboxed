  <text x="705" y="530" text-anchor="middle" class="accink" font-size="15" font-weight="700">1 vector for the whole text</text>
  <text x="880" y="176" class="muted head">COMPARED WITH OTHER TEXTS</text>
  <rect class="possoft" x="880" y="196" width="260" height="48" rx="10" stroke-width="1.5"/>
  <text x="894" y="225" class="ink" font-size="13.5">A cat was sitting on a rug</text>
  <text x="1128" y="226" text-anchor="end" class="posink mono" font-size="15" font-weight="700">0.91</text>
  <rect class="possoft" x="880" y="258" width="260" height="48" rx="10" stroke-width="1.5"/>
  <text x="894" y="287" class="ink" font-size="13.5">Where did the cat sit?</text>
  <text x="1128" y="288" text-anchor="end" class="posink mono" font-size="15" font-weight="700">0.78</text>
  <rect class="negsoft" x="880" y="320" width="260" height="48" rx="10" stroke-width="1.5"/>
  <text x="894" y="349" class="ink" font-size="13.5">Stock prices fell today</text>
  <text x="1128" y="350" text-anchor="end" class="negink mono" font-size="15" font-weight="700">0.06</text>
  <g class="line" stroke-width="1.5"><path d="M736 468 H858 V282 H872" marker-end="url(#a)"/></g>
  <text x="1010" y="408" text-anchor="middle" class="muted" font-size="13">cosine similarity: similar</text>
  <text x="1010" y="426" text-anchor="middle" class="muted" font-size="13">meaning scores close to 1</text>
  <text x="1010" y="476" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">Used for: search, RAG,</text>
  <text x="1010" y="494" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">clustering, recommendations</text>
  <text x="40" y="580" class="muted" font-size="11.5">Vectors drawn with 6 numbers; real ones have hundreds to thousands. Some models take one special token's vector instead of averaging. Scores are illustrative.</text>
</svg>
