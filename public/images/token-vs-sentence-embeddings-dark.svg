  <rect class="acc" x="790" y="367" width="24" height="10" rx="3" opacity="0.53"/>
  <text x="705" y="396" text-anchor="middle" class="muted" font-size="12.5">6 tokens → 6 vectors, now with context</text>
  <g class="line"><line x1="705" y1="404" x2="705" y2="424" marker-end="url(#a)"/></g>
  <text x="716" y="418" class="heatink" font-size="12.5" font-weight="700">average them</text>
  <rect class="hit" x="681" y="428" width="48" height="77" rx="7" stroke-width="2"/>
  <rect class="acc" x="685" y="432" width="40" height="9" rx="3" opacity="0.47"/>
  <rect class="heatfill" x="685" y="444" width="40" height="9" rx="3" opacity="0.53"/>
  <rect class="acc" x="685" y="456" width="40" height="9" rx="3" opacity="0.38"/>
  <rect class="heatfill" x="685" y="468" width="40" height="9" rx="3" opacity="0.57"/>
