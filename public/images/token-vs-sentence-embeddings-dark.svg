    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Token embeddings vs a sentence embedding</text>
  <text x="40" y="78" class="muted" font-size="15">Same word, two different things: one vector per token from a table, or one vector per text from a whole model.</text>
  <rect class="card" x="40" y="104" width="470" height="440" rx="14"/>
  <text x="60" y="134" class="muted head">1 · TOKEN EMBEDDINGS: A LOOKUP</text>
  <rect class="hit" x="90.0" y="156" width="100" height="34" rx="8" stroke-width="1.5"/>
  <text x="140" y="178" text-anchor="middle" class="accink mono" font-size="15" font-weight="700">The</text>
  <g class="line"><line x1="140" y1="194" x2="140" y2="222" marker-end="url(#a)"/></g>
  <rect class="hit" x="225.0" y="156" width="100" height="34" rx="8" stroke-width="1.5"/>
  <text x="275" y="178" text-anchor="middle" class="accink mono" font-size="15" font-weight="700">␣cat</text>
  <g class="line"><line x1="275" y1="194" x2="275" y2="222" marker-end="url(#a)"/></g>
  <rect class="hit" x="360.0" y="156" width="100" height="34" rx="8" stroke-width="1.5"/>
  <text x="410" y="178" text-anchor="middle" class="accink mono" font-size="15" font-weight="700">␣sat</text>
  <g class="line"><line x1="410" y1="194" x2="410" y2="222" marker-end="url(#a)"/></g>
  <rect class="sunk" x="70" y="228" width="410" height="44" rx="10"/>
  <text x="275" y="255" text-anchor="middle" class="ink" font-size="14.5" font-weight="600">embedding table: each ID picks its row</text>
  <g class="line"><line x1="140" y1="276" x2="140" y2="302" marker-end="url(#a)"/></g>
  <rect class="heatfill" x="120" y="308" width="40" height="15" rx="3" opacity="0.43"/>
