  <rect class="heatfill" x="255" y="344" width="40" height="15" rx="3" opacity="0.78"/>
  <rect class="heatfill" x="255" y="362" width="40" height="15" rx="3" opacity="0.30"/>
  <rect class="heatfill" x="255" y="380" width="40" height="15" rx="3" opacity="0.74"/>
  <rect class="heatfill" x="255" y="398" width="40" height="15" rx="3" opacity="0.71"/>
  <g class="line"><line x1="410" y1="276" x2="410" y2="302" marker-end="url(#a)"/></g>
  <rect class="heatfill" x="390" y="308" width="40" height="15" rx="3" opacity="0.31"/>
  <rect class="acc" x="390" y="326" width="40" height="15" rx="3" opacity="0.61"/>
  <rect class="heatfill" x="390" y="344" width="40" height="15" rx="3" opacity="0.67"/>
  <rect class="heatfill" x="390" y="362" width="40" height="15" rx="3" opacity="0.55"/>
  <rect class="acc" x="390" y="380" width="40" height="15" rx="3" opacity="0.37"/>
  <rect class="acc" x="390" y="398" width="40" height="15" rx="3" opacity="0.76"/>
  <text x="275" y="452" text-anchor="middle" class="ink" font-size="15" font-weight="700">3 tokens → 3 vectors</text>
  <text x="275" y="476" text-anchor="middle" class="muted" font-size="13.5">No context yet: “cat” gets this exact vector</text>
  <text x="275" y="494" text-anchor="middle" class="muted" font-size="13.5">in every sentence it appears in.</text>
  <text x="275" y="524" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">Used as: the LLM's input</text>
  <rect class="card" x="530" y="104" width="630" height="440" rx="14"/>
  <text x="550" y="134" class="muted head">2 · SENTENCE EMBEDDING: A WHOLE MODEL</text>
  <rect class="hit" x="560" y="156" width="290" height="34" rx="8" stroke-width="1.5"/>
  <text x="705" y="178" text-anchor="middle" class="accink mono" font-size="14.5" font-weight="700">The cat sat on the mat</text>
  <g class="line"><line x1="705" y1="194" x2="705" y2="222" marker-end="url(#a)"/></g>
  <rect class="accsoft" x="560" y="228" width="290" height="44" rx="10"/>
  <text x="705" y="248" text-anchor="middle" class="accink" font-size="14" font-weight="700">embedding model (a transformer)</text>
  <text x="705" y="264" text-anchor="middle" class="ink" font-size="12.5">attention mixes context into every token</text>
  <g class="line"><line x1="705" y1="276" x2="705" y2="296" marker-end="url(#a)"/></g>
  <rect class="acc" x="590" y="302" width="24" height="10" rx="3" opacity="0.31"/>
