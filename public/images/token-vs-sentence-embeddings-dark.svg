  <rect class="acc" x="750" y="302" width="24" height="10" rx="3" opacity="0.57"/>
  <rect class="acc" x="750" y="315" width="24" height="10" rx="3" opacity="0.46"/>
  <rect class="heatfill" x="750" y="328" width="24" height="10" rx="3" opacity="0.53"/>
  <rect class="acc" x="750" y="341" width="24" height="10" rx="3" opacity="0.31"/>
