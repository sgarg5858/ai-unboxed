<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Residual connections</title>
  <desc id="d">Residual connections in one transformer layer. The vector comes in and runs straight down a main line, the skip path. A copy branches off, goes through a norm and attention, and attention’s update is added back onto the main line. A second copy goes through a norm and the feed-forward step, and its update is added back too. The vector goes out. As numbers: "it" goes into attention as [1, 2, 3]; attention’s update is [0.2, −0.5, 0.7]; adding gives [1.2, 1.5, 3.7]: 1 + 0.2, 2 − 0.5, 3 + 0.7. The old vector, nudged.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="50" text-anchor="start" class="ink" font-size="26" font-weight="700">Residual connections: add, don’t replace</text>
  <text x="40" y="76" text-anchor="start" class="muted" font-size="15">Each step’s output is added onto the vector that went in. The vector is a running total.</text>
  <rect class="card" x="40.0" y="96.0" width="500.0" height="474.0" rx="14" stroke-width="1.2"/>
  <text x="60" y="124" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">ONE TRANSFORMER LAYER</text>
  <rect class="sunk" x="70.0" y="140.0" width="160.0" height="40.0" rx="10"/>
  <text x="150" y="165" text-anchor="middle" class="ink" font-size="14" font-weight="700">vector in</text>
  <line class="stream" x1="150" y1="182" x2="150" y2="500"/>
  <line class="sacc" x1="150" y1="182" x2="150" y2="508" marker-end="url(#aa)"/>
  <line class="line" x1="150" y1="225" x2="226" y2="225" marker-end="url(#a)"/>
  <rect class="heat" x="230.0" y="207.0" width="80.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="270" y="230" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">Norm</text>
  <line class="line" x1="312" y1="225" x2="334" y2="225" marker-end="url(#a)"/>
  <rect class="hit" x="338.0" y="207.0" width="150.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="413" y="230" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">Attention</text>
  <path class="line" d="M490 225 L510 225 L510 290 L169 290" marker-end="url(#a)"/>
  <text x="400" y="282" text-anchor="middle" class="muted" font-size="12" font-weight="600">update</text>
  <circle class="card" cx="150" cy="290" r="15" stroke-width="2"/>
  <text x="150" y="297" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <line class="line" x1="150" y1="360" x2="226" y2="360" marker-end="url(#a)"/>
  <rect class="heat" x="230.0" y="342.0" width="80.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="270" y="365" text-anchor="middle" class="heatink" font-size="13.5" font-weight="700">Norm</text>
  <line class="line" x1="312" y1="360" x2="334" y2="360" marker-end="url(#a)"/>
  <rect class="hit" x="338.0" y="342.0" width="150.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="413" y="365" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">Feed-forward</text>
  <path class="line" d="M490 360 L510 360 L510 425 L169 425" marker-end="url(#a)"/>
  <text x="400" y="417" text-anchor="middle" class="muted" font-size="12" font-weight="600">update</text>
  <circle class="card" cx="150" cy="425" r="15" stroke-width="2"/>
  <text x="150" y="432" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <rect class="possoft" x="70.0" y="512.0" width="160.0" height="40.0" rx="10" stroke-width="1.4"/>
  <text x="150" y="537" text-anchor="middle" class="posink" font-size="14" font-weight="700">vector out</text>
  <text x="136" y="470" text-anchor="end" class="accink" font-size="12.5" font-weight="700">skip</text>
  <text x="136" y="486" text-anchor="end" class="accink" font-size="12.5" font-weight="700">path</text>
  <text x="350" y="480" text-anchor="start" class="muted" font-size="12.5">The main line never stops: each step</text>
  <text x="350" y="497" text-anchor="start" class="muted" font-size="12.5">reads it, then adds its update back.</text>
  <rect class="card" x="580.0" y="96.0" width="580.0" height="474.0" rx="14" stroke-width="1.2"/>
  <text x="600" y="124" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">THE SAME ADDITION, AS NUMBERS</text>
  <text x="600" y="152" text-anchor="start" class="ink" font-size="14" font-weight="600">“it” going into attention:  [1, 2, 3]</text>
  <text x="600" y="174" text-anchor="start" class="accink" font-size="14" font-weight="600">attention’s update:  [0.2, −0.5, 0.7]</text>
  <rect class="card" x="670.0" y="390.0" width="70.0" height="80.0" rx="4" stroke-width="1.4"/>
  <rect class="acc" x="670.0" y="374.0" width="70.0" height="16.0" rx="4"/>
  <text x="705.0" y="364.0" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">1.2</text>
  <text x="705.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">1 + 0.2</text>
  <rect class="card" x="830.0" y="310.0" width="70.0" height="160.0" rx="4" stroke-width="1.4"/>
  <rect class="negsoft" x="830.0" y="310.0" width="70.0" height="40.0" rx="4" stroke-width="1.4"/>
  <text x="865.0" y="300" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">1.5</text>
  <text x="865.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">2 − 0.5</text>
  <rect class="card" x="990.0" y="230.0" width="70.0" height="240.0" rx="4" stroke-width="1.4"/>
  <rect class="acc" x="990.0" y="174.0" width="70.0" height="56.0" rx="4"/>
  <text x="1025.0" y="164.0" text-anchor="middle" class="ink mono" font-size="15" font-weight="700">3.7</text>
  <text x="1025.0" y="492" text-anchor="middle" class="muted mono" font-size="13" font-weight="600">3 + 0.7</text>
  <line class="thin" x1="650" y1="470" x2="1140" y2="470"/>
  <rect class="card" x="600.0" y="516.0" width="14.0" height="14.0" rx="3" stroke-width="1.4"/>
  <text x="620" y="528" text-anchor="start" class="muted" font-size="12.5">what it already had</text>
  <rect class="acc" x="780.0" y="516.0" width="14.0" height="14.0" rx="3"/>
  <text x="800" y="528" text-anchor="start" class="muted" font-size="12.5">added</text>
  <rect class="negsoft" x="880.0" y="516.0" width="14.0" height="14.0" rx="3" stroke-width="1.4"/>
  <text x="900" y="528" text-anchor="start" class="muted" font-size="12.5">taken away</text>
  <text x="600" y="552" text-anchor="start" class="ink" font-size="13.5" font-weight="700">Result: [1.2, 1.5, 3.7], the old vector, nudged.</text>
</svg>
