  <text x="40" y="460" class="muted head" font-size="12">FIVE PROBLEMS THAT COME WITH SCALE</text>
  <rect class="card" x="40" y="472" width="208" height="96" rx="10"/>
  <text x="54" y="498" class="accink" font-size="15" font-weight="700">Network</text>
  <text x="54" y="526" class="ink" font-size="12.5">GPUs swap results constantly:</text><text x="54" y="546" class="ink" font-size="12.5">send while computing</text>
  <rect class="card" x="268" y="472" width="208" height="96" rx="10"/>
  <text x="282" y="498" class="negink" font-size="15" font-weight="700">Failures</text>
  <text x="282" y="526" class="ink" font-size="12.5">466 interruptions in 54 days:</text><text x="282" y="546" class="ink" font-size="12.5">checkpoint, then restart</text>
