  <text x="460" y="410" text-anchor="middle" class="ink" font-size="12.5" font-weight="700">× 16: layers in 16 stages (one row = one copy) · × 128 copies</text>
  <text x="720" y="333" class="posink" font-size="13" font-weight="700">← one full copy = 16 servers</text>
  <text x="720" y="364" class="muted" font-size="13">… 128 copies in all,</text><text x="720" y="382" class="muted" font-size="13">each reading different text</text>
  <rect class="heat" x="960" y="326" width="180" height="70" rx="10" stroke-width="1.5"/>
