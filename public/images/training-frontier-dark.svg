<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Training a frontier model</title>
  <desc id="d">Training Meta's Llama 3.1, with 405 billion weights. Top left, why one GPU can't do it: training needs about 6.5 TB of memory, but one GPU holds 80 GB, 80 times too small; and about 31 million GPU hours, which is about 3,500 years on one GPU or about two and a half months on 16,384. Top right, the machine: 16,384 GPUs in 2,048 servers of 8, joined by one network, reading about 15 trillion tokens. Middle, splitting the work: inside each server the 8 GPUs share every big table, cut into strips; the 126 layers are split into 16 stages, one server each, so 16 servers hold one full copy; and that copy is repeated 128 times, each reading different text. 8 times 16 times 128 is 16,384 GPUs. Bottom, five distributed-systems problems: the network (overlap sending with computing), failures (466 interruptions in 54 days, so save checkpoints and restart), stragglers (one slow GPU makes thousands wait, so swap it out), loss spikes (go back to a checkpoint and skip the bad batches), and power (tens of megawatts, with sudden swings).</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="600" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Training a frontier model: a distributed-systems problem</text>
  <text x="40" y="78" class="muted" font-size="15">Meta's Llama 3.1, 405 billion weights. Figures are approximate.</text>
  <rect class="card" x="40" y="96" width="560" height="170" rx="10"/>
  <text x="60" y="122" class="muted head" font-size="12">WHY ONE GPU CAN'T DO IT</text>
  <text x="60" y="148" class="ink" font-size="13.5" font-weight="700">Memory to train</text>
  <rect class="neg" x="60" y="156" width="400" height="20" rx="4"/><text x="70" y="171" class="onacc" font-size="12.5" font-weight="700">≈ 6.5 TB needed</text>
  <rect class="acc" x="60" y="182" width="5" height="20" rx="2"/><text x="74" y="197" class="accink" font-size="12.5" font-weight="700">one GPU: 80 GB</text>
  <text x="472" y="190" class="negink" font-size="16" font-weight="700">80× too small</text>
  <text x="60" y="230" class="ink" font-size="13.5" font-weight="700">Time (≈ 31 million GPU hours)</text>
  <text x="60" y="252" class="ink" font-size="13.5">One GPU: <tspan class="negink" font-weight="700">≈ 3,500 years</tspan> · 16,384 GPUs: <tspan class="posink" font-weight="700">≈ 2½ months</tspan></text>
  <rect class="card" x="620" y="96" width="540" height="170" rx="10"/>
  <text x="640" y="122" class="muted head" font-size="12">THE MACHINE</text>
  <rect class="accsoft" x="640" y="136" width="245" height="54" rx="8"/>
  <text x="654" y="161" class="accink" font-size="20" font-weight="700">16,384</text><text x="654" y="180" class="muted" font-size="12.5">H100 GPUs</text>
  <rect class="accsoft" x="895" y="136" width="245" height="54" rx="8"/>
  <text x="909" y="161" class="accink" font-size="20" font-weight="700">2,048</text><text x="909" y="180" class="muted" font-size="12.5">servers × 8 GPUs</text>
  <rect class="accsoft" x="640" y="198" width="245" height="54" rx="8"/>
  <text x="654" y="223" class="accink" font-size="20" font-weight="700">1</text><text x="654" y="242" class="muted" font-size="12.5">network joins them all</text>
  <rect class="accsoft" x="895" y="198" width="245" height="54" rx="8"/>
  <text x="909" y="223" class="accink" font-size="20" font-weight="700">~15 trillion</text><text x="909" y="242" class="muted" font-size="12.5">tokens of text</text>
  <rect class="card" x="40" y="282" width="1120" height="150" rx="10"/>
