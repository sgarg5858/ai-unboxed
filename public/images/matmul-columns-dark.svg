<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How 768 numbers become 64</title>
  <desc id="d">Left, the size rule: a 1 × 768 token times a 768 × 64 table gives a 1 × 64 result; the inner sizes must match and the outer sizes are what you get. Middle, a tiny example: the token [1, 0, 2, 1] next to a 4 × 2 table. Column 1 is [1, 0, 0, 1]; multiplying pair by pair and adding gives 1·1 + 0·0 + 2·0 + 1·1 = 2. Column 2 gives 3, so the result is [2, 3]: one number per column. Right, GPT-2, one head: 64 columns of 768 numbers each, so 64 comparisons and 64 numbers out; each column asks one small question about the token.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="430" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">How 768 numbers become 64</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Multiplying a vector by a table: one number per column.</text>
  <rect class="card" x="40" y="100" width="420" height="300" rx="10"/>
  <text x="60" y="130" text-anchor="start" class="accink head" font-size="12">THE SIZE RULE</text>
  <text x="250" y="190" text-anchor="middle" class="ink mono" font-size="22" font-weight="700">(1 × 768) × (768 × 64)</text>
  <text x="250" y="232" text-anchor="middle" class="posink mono" font-size="24" font-weight="700">= (1 × 64)</text>
  <path class="sheat" d="M157 202 Q 218 226 280 202" fill="none"/>
  <text x="218" y="262" text-anchor="middle" class="heatink" font-size="14" font-weight="700">inner sizes must match</text>
  <text x="60" y="316" text-anchor="start" class="muted" font-size="13.5">token: 1 row of 768 numbers</text>
  <text x="60" y="340" text-anchor="start" class="muted" font-size="13.5">table: 768 rows × 64 columns</text>
  <text x="60" y="364" text-anchor="start" class="posink" font-size="13.5" font-weight="700">result: 1 row of 64 numbers</text>
  <rect class="card" x="480" y="100" width="400" height="300" rx="10"/>
  <text x="500" y="130" text-anchor="start" class="accink head" font-size="12">TINY EXAMPLE · 4 IN, 2 OUT</text>
  <text x="519" y="164" text-anchor="middle" class="muted" font-size="12">token</text>
  <text x="625" y="160" text-anchor="middle" class="heatink" font-size="12" font-weight="700">col 1</text>
  <text x="673" y="160" text-anchor="middle" class="muted" font-size="12">col 2</text>
  <rect class="accsoft" x="500" y="172" width="38" height="38" rx="7"/>
  <text x="519" y="197" text-anchor="middle" class="accink mono" font-size="17" font-weight="700">1</text>
  <rect class="heat" x="606" y="172" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="625" y="197" text-anchor="middle" class="heatink mono" font-size="17" font-weight="700">1</text>
  <rect class="card" x="654" y="172" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="673" y="197" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">1</text>
  <rect class="accsoft" x="500" y="216" width="38" height="38" rx="7"/>
  <text x="519" y="241" text-anchor="middle" class="accink mono" font-size="17" font-weight="700">0</text>
  <rect class="heat" x="606" y="216" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="625" y="241" text-anchor="middle" class="heatink mono" font-size="17" font-weight="700">0</text>
  <rect class="card" x="654" y="216" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="673" y="241" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">1</text>
  <rect class="accsoft" x="500" y="260" width="38" height="38" rx="7"/>
  <text x="519" y="285" text-anchor="middle" class="accink mono" font-size="17" font-weight="700">2</text>
  <rect class="heat" x="606" y="260" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="625" y="285" text-anchor="middle" class="heatink mono" font-size="17" font-weight="700">0</text>
  <rect class="card" x="654" y="260" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="673" y="285" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">1</text>
  <rect class="accsoft" x="500" y="304" width="38" height="38" rx="7"/>
  <text x="519" y="329" text-anchor="middle" class="accink mono" font-size="17" font-weight="700">1</text>
  <rect class="heat" x="606" y="304" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="625" y="329" text-anchor="middle" class="heatink mono" font-size="17" font-weight="700">1</text>
  <rect class="card" x="654" y="304" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="673" y="329" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">0</text>
  <rect x="600" y="166" width="50" height="182" rx="9" fill="none" class="sheat"/>
  <text x="560" y="375" text-anchor="start" class="ink mono" font-size="14" font-weight="700">1·1 + 0·0 + 2·0 + 1·1 = 2</text>
  <text x="758" y="190" text-anchor="middle" class="muted" font-size="12">result</text>
  <rect class="possoft" x="722" y="200" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="741" y="225" text-anchor="middle" class="posink mono" font-size="17" font-weight="700">2</text>
  <rect class="possoft" x="766" y="200" width="38" height="38" rx="7" stroke-width="1.5"/>
  <text x="785" y="225" text-anchor="middle" class="posink mono" font-size="17" font-weight="700">3</text>
  <text x="760" y="264" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">one number</text>
  <text x="760" y="282" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">per column</text>
  <rect class="possoft" x="900" y="100" width="260" height="300" rx="10" stroke-width="1.5"/>
  <text x="920" y="130" text-anchor="start" class="posink head" font-size="12">GPT-2 · ONE HEAD</text>
  <text x="920" y="180" text-anchor="start" class="ink" font-size="17" font-weight="700">64 columns</text>
  <text x="920" y="214" text-anchor="start" class="ink" font-size="17" font-weight="700">× 768 numbers each</text>
  <text x="920" y="248" text-anchor="start" class="heatink" font-size="17" font-weight="700">= 64 comparisons</text>
  <text x="920" y="282" text-anchor="start" class="posink" font-size="17" font-weight="700">→ 64 numbers out</text>
  <text x="920" y="350" text-anchor="start" class="muted" font-size="13.5">each column asks one</text>
  <text x="920" y="370" text-anchor="start" class="muted" font-size="13.5">small question</text>
  <rect class="sunk" x="40" y="412" width="1120" height="0.01" rx="0"/>
</svg>
