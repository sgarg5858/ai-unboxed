  <line class="dash" x1="426.0" y1="165" x2="426.0" y2="404"/>
  <text x="434" y="182" text-anchor="start" class="accink" font-size="13" font-weight="700">stop here</text>
  <text x="434" y="200" text-anchor="start" class="muted" font-size="12.5">overfitting starts</text>
  <text x="640" y="401.971" text-anchor="end" class="accink" font-size="13" font-weight="700">training text</text>
  <text x="640" y="303.53" text-anchor="end" class="heatink" font-size="13" font-weight="700">new text</text>
  <rect class="card" x="720" y="100" width="440" height="340" rx="10"/>
  <text x="740" y="130" text-anchor="start" class="muted head" font-size="12">TRAINED ONLY ON SUNNY DAYS</text>
  <rect class="accsoft" x="740" y="148" width="400" height="44" rx="8"/>
  <text x="940" y="176" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">New: “On a stormy night, the sky is …”</text>
  <rect class="negsoft" x="740" y="210" width="400" height="100" rx="8" stroke-width="1.5"/>
  <text x="760" y="238" text-anchor="start" class="ink" font-size="15" font-weight="700">Memorised</text>
  <text x="1120" y="238" text-anchor="end" class="negink" font-size="16" font-weight="700">blue ✗</text>
  <text x="760" y="264" text-anchor="start" class="muted" font-size="13">learned the exact sentences:</text>
  <text x="760" y="284" text-anchor="start" class="muted" font-size="13">“the sky is” is always “blue”</text>
  <rect class="possoft" x="740" y="324" width="400" height="100" rx="8" stroke-width="1.5"/>
  <text x="760" y="352" text-anchor="start" class="ink" font-size="15" font-weight="700">Generalised</text>
  <text x="1120" y="352" text-anchor="end" class="posink" font-size="16" font-weight="700">dark ✓</text>
  <text x="760" y="378" text-anchor="start" class="muted" font-size="13">learned the pattern:</text>
  <text x="760" y="398" text-anchor="start" class="muted" font-size="13">the sky’s colour depends on the scene</text>
</svg>
