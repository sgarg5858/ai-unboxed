<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The generation loop</title>
  <desc id="d">The generation loop for "The pizza is ready". Run 1: the model reads The, pizza, is, ready and predicts " for" at 42%, next best " to" at 31%; " for" is appended. Run 2: it reads the text plus " for" and predicts " you" at 58%; appended. Run 3: it reads the longer text and predicts "!" at 47%; appended. Run 4: it reads "The pizza is ready for you!" and predicts the special end token at 81%, so generation stops and the reply is finished. Finishing is just one more prediction: answers in training ended with a special end token, so the model learns to predict it once a reply is complete. Apps also stop at a length limit. Probabilities are illustrative.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text x="40" y="50" class="ink" font-size="26" font-weight="700">The loop: append the prediction, run again</text>
  <text x="40" y="76" class="muted" font-size="15">The model only ever predicts one token. A reply is this loop, repeated until the end token wins.</text>
  <text x="40" y="140" text-anchor="start" class="muted mono" font-size="12" font-weight="700">RUN 1</text>
  <rect class="card" x="118" y="122" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="140.8" y="141" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">The</text>
  <rect class="card" x="169.6" y="122" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="206.2" y="141" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣pizza</text>
  <rect class="card" x="248.79999999999998" y="122" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="271.59999999999997" y="141" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣is</text>
  <rect class="card" x="300.4" y="122" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="337.0" y="141" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣ready</text>
  <line class="line" x1="383.59999999999997" y1="136" x2="684" y2="136" marker-end="url(#a)"/>
  <rect class="sunk" x="690" y="118" width="86" height="36" rx="8"/>
  <text x="733" y="141" text-anchor="middle" class="ink" font-size="14" font-weight="700">LLM</text>
  <line class="line" x1="780" y1="136" x2="794" y2="136" marker-end="url(#a)"/>
  <rect class="heat" x="800" y="116" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text x="812" y="135" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">␣for</text>
  <text x="938" y="135" text-anchor="end" class="heatink mono" font-size="12.5" font-weight="700">42%</text>
  <text x="812" y="150" text-anchor="start" class="muted mono" font-size="10.5">next best: ␣to 31%</text>
  <text x="960" y="135" text-anchor="start" class="accink" font-size="12" font-weight="700">append ↓</text>
  <text x="40" y="244" text-anchor="start" class="muted mono" font-size="12" font-weight="700">RUN 2</text>
  <rect class="card" x="118" y="226" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="140.8" y="245" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">The</text>
  <rect class="card" x="169.6" y="226" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="206.2" y="245" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣pizza</text>
  <rect class="card" x="248.79999999999998" y="226" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="271.59999999999997" y="245" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣is</text>
  <rect class="card" x="300.4" y="226" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="337.0" y="245" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣ready</text>
  <rect class="hit" x="379.59999999999997" y="226" width="54.8" height="28" rx="14" stroke-width="1.5"/>
  <text x="406.99999999999994" y="245" text-anchor="middle" class="accink mono" font-size="13" font-weight="700">␣for</text>
  <path class="dash" d="M840 156 C 840 200, 406.99999999999994 188, 406.99999999999994 223" fill="none" marker-end="url(#aa)"/>
  <line class="line" x1="444.4" y1="240" x2="684" y2="240" marker-end="url(#a)"/>
  <rect class="sunk" x="690" y="222" width="86" height="36" rx="8"/>
  <text x="733" y="245" text-anchor="middle" class="ink" font-size="14" font-weight="700">LLM</text>
  <line class="line" x1="780" y1="240" x2="794" y2="240" marker-end="url(#a)"/>
  <rect class="heat" x="800" y="220" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text x="812" y="239" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">␣you</text>
  <text x="938" y="239" text-anchor="end" class="heatink mono" font-size="12.5" font-weight="700">58%</text>
  <text x="812" y="254" text-anchor="start" class="muted mono" font-size="10.5">next best: ␣in 11%</text>
  <text x="960" y="239" text-anchor="start" class="accink" font-size="12" font-weight="700">append ↓</text>
  <text x="40" y="348" text-anchor="start" class="muted mono" font-size="12" font-weight="700">RUN 3</text>
  <rect class="card" x="118" y="330" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="140.8" y="349" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">The</text>
  <rect class="card" x="169.6" y="330" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="206.2" y="349" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣pizza</text>
  <rect class="card" x="248.79999999999998" y="330" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="271.59999999999997" y="349" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣is</text>
  <rect class="card" x="300.4" y="330" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="337.0" y="349" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣ready</text>
  <rect class="card" x="379.59999999999997" y="330" width="54.8" height="28" rx="14" stroke-width="1"/>
  <text x="406.99999999999994" y="349" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣for</text>
  <rect class="hit" x="440.4" y="330" width="54.8" height="28" rx="14" stroke-width="1.5"/>
  <text x="467.79999999999995" y="349" text-anchor="middle" class="accink mono" font-size="13" font-weight="700">␣you</text>
  <path class="dash" d="M840 260 C 840 304, 467.79999999999995 292, 467.79999999999995 327" fill="none" marker-end="url(#aa)"/>
  <line class="line" x1="505.2" y1="344" x2="684" y2="344" marker-end="url(#a)"/>
  <rect class="sunk" x="690" y="326" width="86" height="36" rx="8"/>
  <text x="733" y="349" text-anchor="middle" class="ink" font-size="14" font-weight="700">LLM</text>
  <line class="line" x1="780" y1="344" x2="794" y2="344" marker-end="url(#a)"/>
  <rect class="heat" x="800" y="324" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text x="812" y="343" text-anchor="start" class="heatink mono" font-size="14" font-weight="700">!</text>
  <text x="938" y="343" text-anchor="end" class="heatink mono" font-size="12.5" font-weight="700">47%</text>
  <text x="812" y="358" text-anchor="start" class="muted mono" font-size="10.5">next best: . 36%</text>
  <text x="960" y="343" text-anchor="start" class="accink" font-size="12" font-weight="700">append ↓</text>
  <text x="40" y="452" text-anchor="start" class="muted mono" font-size="12" font-weight="700">RUN 4</text>
  <rect class="card" x="118" y="434" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="140.8" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">The</text>
  <rect class="card" x="169.6" y="434" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="206.2" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣pizza</text>
  <rect class="card" x="248.79999999999998" y="434" width="45.599999999999994" height="28" rx="14" stroke-width="1"/>
  <text x="271.59999999999997" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣is</text>
  <rect class="card" x="300.4" y="434" width="73.19999999999999" height="28" rx="14" stroke-width="1"/>
  <text x="337.0" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣ready</text>
  <rect class="card" x="379.59999999999997" y="434" width="54.8" height="28" rx="14" stroke-width="1"/>
  <text x="406.99999999999994" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣for</text>
  <rect class="card" x="440.4" y="434" width="54.8" height="28" rx="14" stroke-width="1"/>
  <text x="467.79999999999995" y="453" text-anchor="middle" class="ink mono" font-size="13" font-weight="500">␣you</text>
  <rect class="hit" x="501.2" y="434" width="27.2" height="28" rx="14" stroke-width="1.5"/>
  <text x="514.8" y="453" text-anchor="middle" class="accink mono" font-size="13" font-weight="700">!</text>
  <path class="dash" d="M840 364 C 840 408, 514.8 396, 514.8 431" fill="none" marker-end="url(#aa)"/>
  <line class="line" x1="538.4" y1="448" x2="684" y2="448" marker-end="url(#a)"/>
  <rect class="sunk" x="690" y="430" width="86" height="36" rx="8"/>
  <text x="733" y="453" text-anchor="middle" class="ink" font-size="14" font-weight="700">LLM</text>
  <line class="line" x1="780" y1="448" x2="794" y2="448" marker-end="url(#a)"/>
  <rect class="possoft" x="800" y="428" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text x="812" y="447" text-anchor="start" class="posink mono" font-size="14" font-weight="700">&lt;end&gt;</text>
  <text x="938" y="447" text-anchor="end" class="posink mono" font-size="12.5" font-weight="700">81%</text>
  <text x="812" y="462" text-anchor="start" class="muted mono" font-size="10.5">next best: ␣Enjoy 7%</text>
  <line class="spos" x1="954" y1="448" x2="990" y2="448" marker-end="url(#ap)"/>
  <rect class="possoft" x="996" y="428" width="166" height="40" rx="10" stroke-width="1.5"/>
  <text x="1079" y="445" text-anchor="middle" class="posink" font-size="14" font-weight="700">Stop</text>
  <text x="1079" y="461" text-anchor="middle" class="ink" font-size="11.5">the reply is finished</text>
  <rect class="accsoft" x="40" y="540" width="1120" height="58" rx="12"/>
  <text x="60" y="564" text-anchor="start" class="accink" font-size="14.5" font-weight="700">“Finishing” is just one more prediction.</text>
  <text x="60" y="584" text-anchor="start" class="ink" font-size="13">Answers in training ended with a special end token, so the model learns to predict it once a reply is complete. Apps also stop at a length limit.</text>
  <text x="40" y="612" class="muted" font-size="11.5">Probabilities are illustrative. Each new token (blue) is the previous run’s winner, added to the end of the input.</text>
</svg>
