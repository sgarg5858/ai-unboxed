<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Text is its own answer key</title>
  <desc id="d">Left: the sentence “The sky is blue today” becomes four practice questions. From “The”, guess “sky”. From “The sky”, guess “is”. From “The sky is”, guess “blue”. From “The sky is blue”, guess “today”. Right: labelled data needs a person to tag every example, which is slow and expensive. Self-supervised learning takes the answer from the text itself, the next word, so it is free and scales to trillions of words.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="460" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Text is its own answer key</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Hide the next word, ask the model to guess it, then reveal it. No human labels needed.</text>
  <rect class="card" x="40" y="100" width="720" height="330" rx="10"/>
  <text x="60" y="130" text-anchor="start" class="accink head" font-size="12">ONE SENTENCE → FOUR PRACTICE QUESTIONS</text>
  <text x="80" y="160" text-anchor="start" class="muted" font-size="12.5">what the model sees</text>
  <text x="560" y="160" text-anchor="start" class="muted" font-size="12.5">the answer to guess</text>
  <rect class="accsoft" x="80" y="175" width="58" height="40" rx="8"/>
  <text x="109" y="201" text-anchor="middle" class="accink" font-size="15" font-weight="600">The</text>
  <path class="line" d="M152 195 H 548" fill="none" marker-end="url(#a)"/>
  <rect class="heat" x="560" y="175" width="58" height="40" rx="8" stroke-width="1.5"/>
  <text x="589" y="201" text-anchor="middle" class="heatink" font-size="15" font-weight="700">sky</text>
  <rect class="accsoft" x="80" y="235" width="58" height="40" rx="8"/>
  <text x="109" y="261" text-anchor="middle" class="accink" font-size="15" font-weight="600">The</text>
  <rect class="accsoft" x="146" y="235" width="58" height="40" rx="8"/>
  <text x="175" y="261" text-anchor="middle" class="accink" font-size="15" font-weight="600">sky</text>
  <path class="line" d="M218 255 H 548" fill="none" marker-end="url(#a)"/>
  <rect class="heat" x="560" y="235" width="48" height="40" rx="8" stroke-width="1.5"/>
  <text x="584" y="261" text-anchor="middle" class="heatink" font-size="15" font-weight="700">is</text>
  <rect class="accsoft" x="80" y="295" width="58" height="40" rx="8"/>
  <text x="109" y="321" text-anchor="middle" class="accink" font-size="15" font-weight="600">The</text>
  <rect class="accsoft" x="146" y="295" width="58" height="40" rx="8"/>
  <text x="175" y="321" text-anchor="middle" class="accink" font-size="15" font-weight="600">sky</text>
  <rect class="accsoft" x="212" y="295" width="48" height="40" rx="8"/>
  <text x="236" y="321" text-anchor="middle" class="accink" font-size="15" font-weight="600">is</text>
  <path class="line" d="M274 315 H 548" fill="none" marker-end="url(#a)"/>
  <rect class="heat" x="560" y="295" width="68" height="40" rx="8" stroke-width="1.5"/>
  <text x="594" y="321" text-anchor="middle" class="heatink" font-size="15" font-weight="700">blue</text>
  <rect class="accsoft" x="80" y="355" width="58" height="40" rx="8"/>
  <text x="109" y="381" text-anchor="middle" class="accink" font-size="15" font-weight="600">The</text>
  <rect class="accsoft" x="146" y="355" width="58" height="40" rx="8"/>
  <text x="175" y="381" text-anchor="middle" class="accink" font-size="15" font-weight="600">sky</text>
  <rect class="accsoft" x="212" y="355" width="48" height="40" rx="8"/>
  <text x="236" y="381" text-anchor="middle" class="accink" font-size="15" font-weight="600">is</text>
  <rect class="accsoft" x="268" y="355" width="68" height="40" rx="8"/>
  <text x="302" y="381" text-anchor="middle" class="accink" font-size="15" font-weight="600">blue</text>
  <path class="line" d="M350 375 H 548" fill="none" marker-end="url(#a)"/>
  <rect class="heat" x="560" y="355" width="78" height="40" rx="8" stroke-width="1.5"/>
  <text x="599" y="381" text-anchor="middle" class="heatink" font-size="15" font-weight="700">today</text>
  <rect class="card" x="790" y="100" width="370" height="330" rx="10"/>
  <text x="810" y="130" text-anchor="start" class="muted head" font-size="12">WHO WRITES THE ANSWERS?</text>
  <rect class="sunk" x="810" y="150" width="330" height="118" rx="8"/>
  <text x="830" y="178" text-anchor="start" class="ink" font-size="15" font-weight="700">Labelled data</text>
  <text x="830" y="204" text-anchor="start" class="muted" font-size="13.5">A person tags every photo</text>
  <text x="830" y="224" text-anchor="start" class="muted" font-size="13.5">“cat” or “dog”.</text>
  <text x="830" y="250" text-anchor="start" class="negink" font-size="13.5" font-weight="600">Slow and expensive.</text>
  <rect class="possoft" x="810" y="284" width="330" height="126" rx="8" stroke-width="1.5"/>
  <text x="830" y="312" text-anchor="start" class="ink" font-size="15" font-weight="700">Self-supervised</text>
  <text x="830" y="338" text-anchor="start" class="muted" font-size="13.5">The text itself holds the answer:</text>
  <text x="830" y="358" text-anchor="start" class="muted" font-size="13.5">it is just the next word.</text>
  <text x="830" y="386" text-anchor="start" class="posink" font-size="13.5" font-weight="600">Free, so it scales to trillions.</text>
</svg>
