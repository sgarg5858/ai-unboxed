<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Linear and softmax</title>
  <desc id="d">The output head of a GPT-style model, for “The cat sat” with GPT-2 sizes. 1: only the last token, “sat”, is used: its 768 numbers after the final norm. 2: a linear layer, a table of 768 by 50,257 numbers, takes one dot product per vocabulary word. 3: the result is 50,257 scores, called logits, for example on 6.0, down 4.9, in 4.0, there 3.3, and banana −2.1. 4: softmax turns the scores into shares of 100%. 5: probabilities: on 61%, down 20%, in 8%, there 4%, all others together 7%, banana 0.02%. They add up to 100%. Next, a sampling step picks one token, usually a likely one such as “on”; it is appended, giving “The cat sat on”, and the whole model runs again. Values are illustrative.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  </defs>
  <rect class="bg" width="1200" height="540" rx="18"/>
  <text x="40.0" y="50.0" text-anchor="start" class="ink" font-size="26" font-weight="700">Linear &amp; softmax: from a vector to the next token</text>
  <text x="40.0" y="76.0" text-anchor="start" class="muted" font-size="15">Only the last token’s vector is used. Example: “The cat sat” → ? Sizes are GPT-2’s.</text>
  <text x="40.0" y="128.0" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">1 · LAST TOKEN</text>
  <rect class="card" x="40.0" y="144.0" width="56.0" height="30.0" rx="8" stroke-width="1.4"/>
  <text x="68.0" y="164.0" text-anchor="middle" class="muted" font-size="13.5" font-weight="700">The</text>
  <rect class="card" x="102.0" y="144.0" width="56.0" height="30.0" rx="8" stroke-width="1.4"/>
  <text x="130.0" y="164.0" text-anchor="middle" class="muted" font-size="13.5" font-weight="700">cat</text>
  <rect class="hit" x="164.0" y="144.0" width="56.0" height="30.0" rx="8" stroke-width="1.4"/>
  <text x="192.0" y="164.0" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">sat</text>
  <rect class="acc" x="140.0" y="196.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="212.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="228.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="244.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="260.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="276.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="292.0" width="40.0" height="12.0" rx="3"/>
  <rect class="acc" x="140.0" y="308.0" width="40.0" height="12.0" rx="3"/>
  <text x="160.0" y="346.0" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700">768 numbers</text>
  <text x="160.0" y="364.0" text-anchor="middle" class="muted" font-size="12">(after the final norm)</text>
  <line class="line" x1="196" y1="290" x2="244" y2="290" marker-end="url(#a)"/>
  <text x="252.0" y="128.0" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">2 · LINEAR</text>
  <rect class="hit" x="252.0" y="228.0" width="170.0" height="124.0" rx="12" stroke-width="1.5"/>
  <text x="337.0" y="262.0" text-anchor="middle" class="accink" font-size="17" font-weight="700">Linear</text>
  <text x="337.0" y="286.0" text-anchor="middle" class="ink mono" font-size="12" font-weight="700">768 × 50,257 table</text>
  <text x="337.0" y="306.0" text-anchor="middle" class="muted" font-size="12">one dot product</text>
  <text x="337.0" y="322.0" text-anchor="middle" class="muted" font-size="12">per vocabulary word</text>
  <line class="line" x1="426" y1="290" x2="466" y2="290" marker-end="url(#a)"/>
  <text x="474.0" y="128.0" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">3 · SCORES (LOGITS)</text>
  <rect class="card" x="474.0" y="170.0" width="196.0" height="226.0" rx="12" stroke-width="1.2"/>
  <text x="494.0" y="202.0" text-anchor="start" class="ink" font-size="14" font-weight="600">on</text>
  <text x="650.0" y="202.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">6.0</text>
  <text x="494.0" y="236.0" text-anchor="start" class="ink" font-size="14" font-weight="600">down</text>
  <text x="650.0" y="236.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">4.9</text>
  <text x="494.0" y="270.0" text-anchor="start" class="ink" font-size="14" font-weight="600">in</text>
  <text x="650.0" y="270.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">4.0</text>
  <text x="494.0" y="304.0" text-anchor="start" class="ink" font-size="14" font-weight="600">there</text>
  <text x="650.0" y="304.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">3.3</text>
  <text x="494.0" y="338.0" text-anchor="start" class="ink" font-size="14">⋮</text>
  <text x="650.0" y="338.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">⋮</text>
  <text x="494.0" y="372.0" text-anchor="start" class="ink" font-size="14" font-weight="600">banana</text>
  <text x="650.0" y="372.0" text-anchor="end" class="accink mono" font-size="14" font-weight="700">−2.1</text>
  <text x="572.0" y="422.0" text-anchor="middle" class="ink mono" font-size="12" font-weight="700">50,257 scores, one per word</text>
  <line class="line" x1="674" y1="290" x2="712" y2="290" marker-end="url(#a)"/>
  <text x="720.0" y="128.0" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">4 · SOFTMAX</text>
  <rect class="possoft" x="720.0" y="246.0" width="120.0" height="88.0" rx="12" stroke-width="1.5"/>
  <text x="780.0" y="280.0" text-anchor="middle" class="posink" font-size="17" font-weight="700">Softmax</text>
  <text x="780.0" y="304.0" text-anchor="middle" class="ink" font-size="12">scores → shares</text>
  <text x="780.0" y="320.0" text-anchor="middle" class="ink" font-size="12">of 100%</text>
  <line class="line" x1="844" y1="290" x2="876" y2="290" marker-end="url(#a)"/>
  <text x="884.0" y="128.0" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">5 · PROBABILITIES</text>
  <rect class="card" x="884.0" y="170.0" width="276.0" height="226.0" rx="12" stroke-width="1.2"/>
  <text x="904.0" y="202.0" text-anchor="start" class="ink" font-size="14" font-weight="600">on</text>
  <rect class="pos" x="966.0" y="190.0" width="115.9" height="14.0" rx="3"/>
  <text x="1148.0" y="202.0" text-anchor="end" class="posink mono" font-size="13" font-weight="700">61%</text>
  <text x="904.0" y="236.0" text-anchor="start" class="ink" font-size="14" font-weight="600">down</text>
  <rect class="possoft" x="966.0" y="224.0" width="38.0" height="14.0" rx="3" stroke-width="1"/>
  <text x="1148.0" y="236.0" text-anchor="end" class="ink mono" font-size="13" font-weight="700">20%</text>
  <text x="904.0" y="270.0" text-anchor="start" class="ink" font-size="14" font-weight="600">in</text>
  <rect class="possoft" x="966.0" y="258.0" width="15.2" height="14.0" rx="3" stroke-width="1"/>
  <text x="1148.0" y="270.0" text-anchor="end" class="ink mono" font-size="13" font-weight="700">8%</text>
  <text x="904.0" y="304.0" text-anchor="start" class="ink" font-size="14" font-weight="600">there</text>
  <rect class="possoft" x="966.0" y="292.0" width="7.6" height="14.0" rx="3" stroke-width="1"/>
  <text x="1148.0" y="304.0" text-anchor="end" class="ink mono" font-size="13" font-weight="700">4%</text>
  <text x="904.0" y="338.0" text-anchor="start" class="muted" font-size="13">all others: 7%</text>
  <text x="904.0" y="372.0" text-anchor="start" class="ink" font-size="14" font-weight="600">banana</text>
  <rect class="possoft" x="966.0" y="360.0" width="0.0" height="14.0" rx="3" stroke-width="1"/>
  <text x="1148.0" y="372.0" text-anchor="end" class="ink mono" font-size="13" font-weight="700">0.02%</text>
  <text x="1022.0" y="422.0" text-anchor="middle" class="ink mono" font-size="12" font-weight="700">they add up to 100%</text>
  <rect class="sunk" x="40.0" y="452.0" width="1120.0" height="60.0" rx="12"/>
  <text x="60.0" y="488.0" text-anchor="start" class="ink" font-size="14" font-weight="600">Next, a sampling step picks one token, usually a likely one: “on”. It is appended (“The cat sat on”) and the whole model runs again.</text>
</svg>
