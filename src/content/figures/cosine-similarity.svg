<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Cosine similarity</title>
  <desc id="d">Cosine similarity compares the angle between two vectors, not their length. First, two vectors pointing the same way but with different lengths, a short question and a long, detailed version of it, have a cosine of 1. Second, two vectors at right angles have a cosine of 0: unrelated, nothing in common. Third, two vectors pointing in opposite directions have a cosine of minus 1, which is rare with real text. Fourth, the calculation: the dot product divided by both lengths. For a = [3, 4] with length 5 and b = [6, 8] with length 10, the dot product is 50, and 50 divided by 5 times 10 is 1: same direction despite different lengths. Below, a scale from minus 1 to 1 shows where real text pairs land: "How do I reset my password?" against "I forgot my password and I'm locked out of my account. What should I do?" scores 0.86, while "How do I reset my password?" against "What's the weather tomorrow?" scores 0.08. Scores are illustrative.</desc>
  <!--theme-->
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">Cosine similarity: the angle, not the length</text>
  <text x="40" y="78" class="muted" font-size="15">Two texts can differ in length and wording but still point the same way. Cosine similarity measures that direction.</text>
  <rect class="card" x="40" y="104" width="265" height="290" rx="14"/>
  <text x="58" y="132" class="posink head">SAME DIRECTION</text>
  <line class="sacc" x1="80" y1="318" x2="249.6" y2="212.0" marker-end="url(#aa)"/>
  <line class="sheat" x1="80" y1="318" x2="160.6" y2="267.7" marker-end="url(#ah)"/>
  <text x="170.0" y="312.9" text-anchor="start" class="heatink" font-size="13" font-weight="600">short question</text>
  <text x="247.1" y="173.5" text-anchor="end" class="accink" font-size="13" font-weight="600">long, detailed</text>
  <text x="247.1" y="189.5" text-anchor="end" class="accink" font-size="13" font-weight="600">version</text>
  <circle class="ink" cx="80" cy="318" r="4"/>
  <text x="172" y="366" text-anchor="middle" class="posink mono" font-size="20" font-weight="700">cos = 1</text>
  <text x="172" y="384" text-anchor="middle" class="muted" font-size="12.5">different lengths, same meaning</text>
  <rect class="card" x="325" y="104" width="265" height="290" rx="14"/>
  <text x="343" y="132" class="muted head">PERPENDICULAR</text>
  <line class="sacc" x1="435" y1="318" x2="579.9" y2="279.2" marker-end="url(#aa)"/>
  <line class="sheat" x1="435" y1="318" x2="396.2" y2="173.1" marker-end="url(#ah)"/>
  <path class="line" stroke-width="1.5" d="M452.4 313.3 L447.7 296.0 L430.3 300.6"/>
  <circle class="ink" cx="435" cy="318" r="4"/>
  <text x="457" y="366" text-anchor="middle" class="ink mono" font-size="20" font-weight="700">cos = 0</text>
  <text x="457" y="384" text-anchor="middle" class="muted" font-size="12.5">unrelated: nothing in common</text>
  <rect class="card" x="610" y="104" width="265" height="290" rx="14"/>
  <text x="628" y="132" class="negink head">OPPOSITE</text>
  <line class="sacc" x1="742" y1="280" x2="847.0" y2="280.0" marker-end="url(#aa)"/>
  <line class="sheat" x1="742" y1="280" x2="637.0" y2="280.0" marker-end="url(#ah)"/>
  <path class="sneg" d="M776.0 280.0 A34 34 0 0 0 708.0 280.0"/>
  <text x="742" y="236" text-anchor="middle" class="negink mono" font-size="13" font-weight="700">180°</text>
  <circle class="ink" cx="742" cy="280" r="4"/>
  <text x="742" y="366" text-anchor="middle" class="negink mono" font-size="20" font-weight="700">cos = −1</text>
  <text x="742" y="384" text-anchor="middle" class="muted" font-size="12.5">opposite: rare with real text</text>
  <rect class="card" x="895" y="104" width="265" height="290" rx="14"/>
  <text x="913" y="132" class="accink head">THE CALCULATION</text>
  <text x="1027" y="182" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">a · b</text>
  <line class="line" x1="957" y1="192" x2="1097" y2="192"/>
  <text x="1027" y="214" text-anchor="middle" class="ink mono" font-size="17" font-weight="700">|a| × |b|</text>
  <text x="913" y="250" class="muted" font-size="12.5">dot product, divided by both lengths</text>
  <rect class="sunk" x="913" y="264" width="229" height="110" rx="8"/>
  <text x="925" y="288" class="ink mono" font-size="12.5">a = [3, 4]   |a| = 5</text>
  <text x="925" y="312" class="ink mono" font-size="12.5">b = [6, 8]   |b| = 10</text>
  <text x="925" y="336" class="ink mono" font-size="12.5">a · b = 18 + 32 = 50</text>
  <text x="925" y="360" class="posink mono" font-size="12.5" font-weight="700">cos = 50 / (5 × 10) = 1</text>
  <rect class="card" x="40" y="412" width="1120" height="168" rx="14"/>
  <text x="58" y="440" class="muted head">WHERE REAL TEXT PAIRS LAND (ILLUSTRATIVE)</text>
  <line class="thin" x1="120" y1="506" x2="1080" y2="506" stroke-width="3"/>
  <line class="line" x1="120" y1="500" x2="120" y2="512" stroke-width="1.5"/>
  <text x="120" y="530" text-anchor="middle" class="muted mono" font-size="12">−1</text>
  <line class="line" x1="360" y1="500" x2="360" y2="512" stroke-width="1.5"/>
  <text x="360" y="530" text-anchor="middle" class="muted mono" font-size="12">−0.5</text>
  <line class="line" x1="600" y1="500" x2="600" y2="512" stroke-width="1.5"/>
  <text x="600" y="530" text-anchor="middle" class="muted mono" font-size="12">0</text>
  <line class="line" x1="840" y1="500" x2="840" y2="512" stroke-width="1.5"/>
  <text x="840" y="530" text-anchor="middle" class="muted mono" font-size="12">0.5</text>
  <line class="line" x1="1080" y1="500" x2="1080" y2="512" stroke-width="1.5"/>
  <text x="1080" y="530" text-anchor="middle" class="muted mono" font-size="12">1</text>
  <circle class="pos" cx="1013" cy="506" r="8"/>
  <circle class="muted" cx="638" cy="506" r="8"/>
  <text x="1027" y="458" text-anchor="end" class="ink" font-size="13">"How do I reset my password?"  vs  "I forgot my password and I'm</text>
  <text x="1027" y="476" text-anchor="end" class="ink" font-size="13">locked out of my account. What should I do?"   <tspan class="posink mono" font-weight="700">0.86</tspan></text>
  <text x="638" y="554" text-anchor="middle" class="ink" font-size="13">"How do I reset my password?"  vs  "What's the weather tomorrow?"   <tspan class="muted mono" font-weight="700">0.08</tspan></text>
  <text x="40" y="604" class="muted" font-size="11.5">Drawn in 2D. Real embeddings have hundreds to thousands of dimensions, but the angle works the same way. Text-pair scores are illustrative.</text>
</svg>
