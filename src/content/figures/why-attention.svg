<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Why attention: meaning comes from the other words</title>
  <desc id="d">Attention lets a word look at the other words in the same sentence and decide how much each one matters. Thicker lines mean more attention. What does "it" mean? In "The cat sat on the mat, because it was tired", "it" pays most attention to "cat" (0.71), cued by "tired", so it means the cat. In "...because it was cozy", "it" attends most to "mat" (0.66), so it means the mat. In "...because it was cold weather", "it" attends most to "weather" (0.58), so it means the weather. Same word, different meaning: in "I went to the bank to deposit money", "bank" attends to "money" and "deposit", so it is a place for money. In "I sat on the bank of the river", "bank" attends to "river", so it is the side of a river. Weights are illustrative.</desc>
  <!--theme-->
  <rect class="bg" width="1200" height="720" rx="18"/>
  <text x="40" y="50" class="ink" font-size="26" font-weight="700">Which words should each word look at?</text>
  <text x="40" y="76" class="muted" font-size="15">Attention gives a word a weight for every other word in the sentence. Thicker line, more attention.</text>
