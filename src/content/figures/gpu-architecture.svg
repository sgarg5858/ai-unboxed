  <text x="252" y="562" text-anchor="middle" class="muted" font-size="11.5">e.g. 128 × 64</text>
  <line class="line" x1="311" y1="549" x2="329" y2="549" marker-end="url(#a)"/>
  <rect class="card" x="332" y="526" width="112" height="46" rx="8"/>
  <text x="388" y="546" text-anchor="middle" class="ink" font-size="13" font-weight="700">on-chip memory</text>
  <text x="388" y="562" text-anchor="middle" class="muted" font-size="11.5">one tile at a time</text>
  <line class="line" x1="447" y1="549" x2="465" y2="549" marker-end="url(#a)"/>
  <rect class="hit" x="468" y="526" width="102" height="46" rx="8"/>
  <text x="519" y="546" text-anchor="middle" class="accink" font-size="13" font-weight="700">cores</text>
  <text x="519" y="562" text-anchor="middle" class="muted" font-size="11.5">use it, then next</text>
  <text x="60" y="600" class="muted" font-size="13">Each run streams all 16 GB across the link, tile after tile, layer after layer.</text>

  <rect class="card" x="610" y="485" width="550" height="132" rx="12"/>
  <text x="630" y="512" class="accink head">WHY NOT KEEP THE WEIGHTS ON THE CHIP?</text>
  <g><rect class="acc" x="630" y="532" width="13" height="13" rx="3"/><rect class="acc" x="646" y="532" width="13" height="13" rx="3"/><rect class="acc" x="662" y="532" width="13" height="13" rx="3"/><rect class="acc" x="630" y="548" width="13" height="13" rx="3"/><rect class="acc" x="646" y="548" width="13" height="13" rx="3"/><rect class="acc" x="662" y="548" width="13" height="13" rx="3"/></g>
  <text x="712" y="545" class="ink" font-size="14" font-weight="700">On-chip (SRAM): 6 transistors per bit, on costly chip area</text>
  <text x="712" y="563" class="accink" font-size="13" font-weight="600">→ tens of MB, very fast</text>
  <rect class="heatfill" x="630" y="576" width="13" height="13" rx="3"/><circle class="sheat" cx="656" cy="582.5" r="6"/>
  <text x="712" y="586" class="ink" font-size="14" font-weight="700">GPU memory (HBM): 1 transistor + 1 capacitor, stacked</text>
  <text x="712" y="604" class="heatink" font-size="13" font-weight="600">→ 80 GB, slower to reach</text>
</svg>
