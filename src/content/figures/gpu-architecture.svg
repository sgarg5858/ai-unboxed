 width="17" height="17" rx="3"/><rect class="acc" x="922" y="250" width="17" height="17" rx="3"/><rect class="acc" x="944" y="250" width="17" height="17" rx="3"/><rect class="acc" x="966" y="250" width="17" height="17" rx="3"/><rect class="acc" x="988" y="250" width="17" height="17" rx="3"/><rect class="acc" x="1010" y="250" width="17" height="17" rx="3"/><rect class="acc" x="1032" y="250" width="17" height="17" rx="3"/><rect class="acc" x="1054" y="250" width="17" height="17" rx="3"/><rect class="acc" x="1076" y="250" width="17" height="17" rx="3"/><rect class="acc" x="1098" y="250" width="17" height="17" rx="3"/><rect class="acc" x="900" y="272" width="17" height="17" rx="3"/><rect class="acc" x="922" y="272" width="17" height="17" rx="3"/><rect class="acc" x="944" y="272" width="17" height="17" rx="3"/><rect class="acc" x="966" y="272" width="17" height="17" rx="3"/><rect class="acc" x="988" y="272" width="17" height="17" rx="3"/><rect class="acc" x="1010" y="272" width="17" height="17" rx="3"/><rect class="acc" x="1032" y="272" width="17" height="17" rx="3"/><rect class="acc" x="1054" y="272" width="17" height="17" rx="3"/><rect class="acc" x="1076" y="272" width="17" height="17" rx="3"/><rect class="acc" x="1098" y="272" width="17" height="17" rx="3"/><rect class="acc" x="900" y="294" width="17" height="17" rx="3"/><rect class="acc" x="922" y="294" width="17" height="17" rx="3"/><rect class="acc" x="944" y="294" width="17" height="17" rx="3"/><rect class="acc" x="966" y="294" width="17" height="17" rx="3"/><rect class="acc" x="988" y="294" width="17" height="17" rx="3"/><rect class="acc" x="1010" y="294" width="17" height="17" rx="3"/><rect class="acc" x="1032" y="294" width="17" height="17" rx="3"/><rect class="acc" x="1054" y="294" width="17" height="17" rx="3"/><rect class="acc" x="1076" y="294" width="17" height="17" rx="3"/><rect class="acc" x="1098" y="294" width="17" height="17" rx="3"/><rect class="acc" x="900" y="316" width="17" height="17" rx="3"/><rect class="acc" x="922" y="316" width="17" height="17" rx="3"/><rect class="acc" x="944" y="316" width="17" height="17" rx="3"/><rect class="acc" x="966" y="316" width="17" height="17" rx="3"/><rect class="acc" x="988" y="316" width="17" height="17" rx="3"/><rect class="acc" x="1010" y="316" width="17" height="17" rx="3"/><rect class="acc" x="1032" y="316" width="17" height="17" rx="3"/><rect class="acc" x="1054" y="316" width="17" height="17" rx="3"/><rect class="acc" x="1076" y="316" width="17" height="17" rx="3"/><rect class="acc" x="1098" y="316" width="17" height="17" rx="3"/><rect class="acc" x="900" y="338" width="17" height="17" rx="3"/><rect class="acc" x="922" y="338" width="17" height="17" rx="3"/><rect class="acc" x="944" y="338" width="17" height="17" rx="3"/><rect class="acc" x="966" y="338" width="17" height="17" rx="3"/><rect class="acc" x="988" y="338" width="17" height="17" rx="3"/><rect class="acc" x="1010" y="338" width="17" height="17" rx="3"/><rect class="acc" x="1032" y="338" width="17" height="17" rx="3"/><rect class="acc" x="1054" y="338" width="17" height="17" rx="3"/><rect class="acc" x="1076" y="338" width="17" height="17" rx="3"/><rect class="acc" x="1098" y="338" width="17" height="17" rx="3"/>
  <text x="1007" y="384" text-anchor="middle" class="ink" font-size="15" font-weight="700">compute cores <tspan class="muted" font-weight="500">· thousands</tspan></text>
  <text x="1007" y="404" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="600">≈ 1,000 trillion calculations/s</text>

  <text x="465" y="464" text-anchor="middle" class="heatink" font-size="14" font-weight="600">the warehouse</text>
  <text x="667" y="464" text-anchor="middle" class="heatink" font-size="14" font-weight="600">the conveyor belt</text>
  <text x="954" y="464" text-anchor="middle" class="heatink" font-size="14" font-weight="600">the workers</text>

  <rect class="card" x="40" y="485" width="550" height="132" rx="12"/>
  <text x="60" y="512" class="heatink head">HOW THE WEIGHTS REACH THE CORES</text>
  <rect class="heat" x="60" y="526" width="112" height="46" rx="8"/>
  <text x="116" y="546" text-anchor="middle" class="heatink" font-size="13" font-weight="700">one layer</text>
  <text x="116" y="562" text-anchor="middle" class="muted" font-size="11.5">≈ 436 MB</text>
  <line class="line" x1="175" y1="549" x2="193" y2="549" marker-end="url(#a)"/>
  <rect class="heat" x="196" y="526" width="112" height="46" rx="8"/>
