<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Inside a GPU: where the maths happens</title>
  <desc id="d">One GPU inside a server, running Llama 3 8B on an NVIDIA H100; numbers are approximate. Left, a server: a CPU that runs the program, main memory as a loading area, a disk that stores files, and 8 GPUs. One GPU is enlarged on the right. It has three parts. First, GPU memory, 80 GB, where the weights live: Llama 3 8B takes 16 GB, the rest is free space. This is the warehouse. Second, the link from GPU memory to the chip, about 3.3 terabytes per second; weights stream across it every time they are used. This is the conveyor belt. Third, the GPU chip itself: a tiny on-chip memory of a few tens of megabytes, and thousands of compute cores doing about 1,000 trillion calculations a second. These are the workers. Below left, how the weights reach the cores: one layer, about 436 MB, is cut into tiles of about 128 by 64 numbers; each tile is copied into on-chip memory one at a time, used by the cores, then replaced by the next, so each run streams all 16 GB across the link. Below right, why the weights are not kept on the chip: on-chip memory (SRAM) needs 6 transistors per bit on costly chip area, so it holds tens of megabytes and is very fast; GPU memory (HBM) needs 1 transistor and 1 capacitor per bit, stacked beside the chip, so it holds 80 GB but is slower to reach.</desc>
