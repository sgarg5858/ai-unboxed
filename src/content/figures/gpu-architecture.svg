  <rect class="sunk" x="60" y="202" width="210" height="52" rx="8"/>
  <text x="76" y="225" class="ink" font-size="15" font-weight="700">Main memory</text><text x="76" y="244" class="muted" font-size="12.5">a loading area</text>
  <rect class="sunk" x="60" y="262" width="210" height="52" rx="8"/>
  <text x="76" y="285" class="ink" font-size="15" font-weight="700">Disk</text><text x="76" y="304" class="muted" font-size="12.5">stores files</text>
  <text x="60" y="344" class="ink" font-size="13.5" font-weight="700">8 GPUs</text>
