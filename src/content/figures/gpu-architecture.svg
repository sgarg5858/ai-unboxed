  <path class="dash" d="M104 371 L340 104"/><path class="dash" d="M104 371 L340 436"/>

  <rect class="card" x="340" y="100" width="820" height="340" rx="14"/>
  <rect class="sacc" x="340" y="100" width="820" height="340" rx="14"/>
  <text x="362" y="128" class="accink head">ONE GPU</text>

  <rect class="heat" x="365" y="145" width="200" height="270" rx="10"/>
  <text x="465" y="172" text-anchor="middle" class="ink" font-size="17" font-weight="700">GPU memory</text>
  <text x="465" y="192" text-anchor="middle" class="muted" font-size="13">80 GB · where weights live</text>
  <rect class="thin" x="382" y="206" width="166" height="112" rx="8" stroke-dasharray="5 4"/>
