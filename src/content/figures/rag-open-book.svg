<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Closed book vs open book</title>
  <desc id="d">Two ways to answer "Can I get a refund on a laptop I've opened?". Without retrieval, the closed-book way, the LLM answers from memory: it only knows its public training data up to a cutoff date, so it says "Yes, within 30 days, with a receipt", which sounds right but is wrong for this shop, with nothing to check it against. It can't see private or new documents, is frozen at its cutoff, and cites no source. With RAG, the open-book way, the system first searches your documents and finds the line "Opened laptops can be exchanged but not refunded". The LLM reads the question plus that text and answers "No. Opened laptops can be exchanged, but not refunded", citing the returns policy so the reader can check it.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Closed book vs open book</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Retrieval-augmented generation (RAG): look up the relevant text first, then answer from it.</text>
  <rect class="card" x="40" y="100" width="540" height="450" rx="14"/>
  <text x="60" y="130" text-anchor="start" class="negink head" font-size="13">WITHOUT RETRIEVAL: CLOSED BOOK</text>
  <rect class="card" x="620" y="100" width="540" height="450" rx="14"/>
  <text x="640" y="130" text-anchor="start" class="posink head" font-size="13">WITH RAG: OPEN BOOK</text>
  <rect class="hit" x="70" y="148" width="480" height="40" rx="10" stroke-width="1.5"/>
  <text x="310" y="173" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">“Can I get a refund on a laptop I've opened?”</text>
  <rect class="hit" x="650" y="148" width="480" height="40" rx="10" stroke-width="1.5"/>
  <text x="890" y="173" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">“Can I get a refund on a laptop I've opened?”</text>
  <line class="line" x1="310" y1="192" x2="310" y2="222" marker-end="url(#a)"/>
  <rect class="sunk" x="110" y="226" width="400" height="76" rx="10" stroke-width="1.5"/>
  <text x="310.0" y="250.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">LLM, answering from memory</text>
  <text x="310.0" y="269.0" text-anchor="middle" class="muted" font-size="12">knows only its training data: the public web,</text>
  <text x="310.0" y="285.0" text-anchor="middle" class="muted" font-size="12">up to a cutoff date. Not your company's policy.</text>
  <line class="line" x1="310" y1="306" x2="310" y2="336" marker-end="url(#a)"/>
  <rect class="negsoft" x="90" y="340" width="440" height="54" rx="12" stroke-width="1.5"/>
  <text x="310" y="373" text-anchor="middle" class="ink" font-size="15" font-weight="600">“Yes, within 30 days, with a receipt.”</text>
  <text x="310" y="418" text-anchor="middle" class="negink" font-size="13" font-weight="700">Sounds right. Wrong for this shop, and nothing to check it against.</text>
  <text x="96" y="450" text-anchor="start" class="negink" font-size="13" font-weight="700">✕</text>
  <text x="116" y="450" text-anchor="start" class="ink" font-size="13">Can't see private or new documents</text>
  <text x="96" y="472" text-anchor="start" class="negink" font-size="13" font-weight="700">✕</text>
  <text x="116" y="472" text-anchor="start" class="ink" font-size="13">Frozen at its training cutoff</text>
  <text x="96" y="494" text-anchor="start" class="negink" font-size="13" font-weight="700">✕</text>
  <text x="116" y="494" text-anchor="start" class="ink" font-size="13">No source to cite, so no way to verify</text>
  <line class="line" x1="890" y1="192" x2="890" y2="216" marker-end="url(#a)"/>
  <rect class="sunk" x="660" y="220" width="460" height="112" rx="10"/>
  <text x="676" y="242" text-anchor="start" class="accink head" font-size="12">1 · SEARCH YOUR DOCUMENTS</text>
  <rect class="card" x="676" y="252" width="428" height="21" rx="5" stroke-width="1"/>
  <text x="686" y="267" text-anchor="start" class="muted" font-size="11.5" font-weight="700">Returns policy</text>
  <text x="790" y="267" text-anchor="start" class="muted" font-size="11.5">…Most items: 30 days with a receipt…</text>
  <rect class="hit" x="676" y="277" width="428" height="21" rx="5" stroke-width="1.5"/>
  <text x="686" y="292" text-anchor="start" class="accink" font-size="11.5" font-weight="700">Returns policy</text>
  <text x="790" y="292" text-anchor="start" class="ink" font-size="11.5" font-weight="600">…Opened laptops: exchange only, no refund…</text>
  <rect class="card" x="676" y="302" width="428" height="21" rx="5" stroke-width="1"/>
  <text x="686" y="317" text-anchor="start" class="muted" font-size="11.5" font-weight="700">Shipping FAQ</text>
  <text x="790" y="317" text-anchor="start" class="muted" font-size="11.5">…Delivery takes 3 to 5 working days…</text>
  <line class="line" x1="890" y1="336" x2="890" y2="356" marker-end="url(#a)"/>
  <rect class="accsoft" x="700" y="360" width="380" height="50" rx="10" stroke-width="1.5"/>
  <text x="890.0" y="390.0" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">2 · LLM reads the question + that text</text>

  <line class="line" x1="890" y1="414" x2="890" y2="432" marker-end="url(#a)"/>
  <rect class="possoft" x="668" y="436" width="444" height="66" rx="12" stroke-width="1.5"/>
  <text x="890" y="462" text-anchor="middle" class="ink" font-size="15" font-weight="600">“No. Opened laptops can be exchanged,</text>
  <text x="890" y="484" text-anchor="middle" class="ink" font-size="15" font-weight="600">but not refunded.” [1]</text>
  <text x="890" y="528" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">[1] Returns policy: the reader can check it</text>
  <text x="40" y="582" text-anchor="start" class="muted" font-size="11.5">The shop and its policy are made up for illustration.</text>
</svg>
