<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">One transformer block</title>
  <desc id="d">The residual stream of token vectors flows from left to right. First a normalised copy goes through attention and the result is added back to the stream. Then another normalised copy goes through the MLP and that result is added back. The shape stays n by d throughout, and the block is repeated N times with its own weights.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="590" rx="18"/>
  <text x="40" y="52" class="ink" font-size="26" font-weight="700">One transformer block</text>
  <text x="40" y="78" class="muted" font-size="15">The residual stream flows through. Each part reads a normalised copy and <tspan class="ink" font-weight="700">adds</tspan> its result back. Nothing is overwritten.</text>
  <text x="1160" y="52" text-anchor="end" class="accink" font-size="14" font-weight="700">× N blocks (≈ 32)</text>
  <text x="1160" y="72" text-anchor="end" class="muted" font-size="13">same design, own weights</text>

  <!-- stream -->
  <line class="stream" x1="60" y1="380" x2="1110" y2="380" marker-end="url(#b)"/>
  <text x="60" y="414" class="muted" font-size="13">from previous block</text>
  <text x="60" y="432" class="muted mono" font-size="13">[n, d]</text>
  <text x="1140" y="414" text-anchor="end" class="muted" font-size="13">to next block</text>
  <text x="1140" y="432" text-anchor="end" class="muted mono" font-size="13">[n, d]</text>
  <text x="270" y="362" class="accink" font-size="13" font-weight="700">residual stream</text>

  <!-- branch 1: norm + attention -->
  <path class="line" d="M230 372 V238" marker-end="url(#a)"/>
  <rect class="card" x="170" y="172" width="120" height="60" rx="10"/>
  <text x="230" y="199" text-anchor="middle" class="ink" font-size="15" font-weight="700">Norm</text>
  <text x="230" y="218" text-anchor="middle" class="muted" font-size="12">rescale a copy</text>
  <line class="line" x1="292" y1="202" x2="318" y2="202" marker-end="url(#a)"/>
  <rect class="accsoft" x="322" y="160" width="210" height="84" rx="12"/>
  <text x="427" y="194" text-anchor="middle" class="accink" font-size="18" font-weight="700">Attention</text>
  <text x="427" y="216" text-anchor="middle" class="accink" font-size="13">moves information</text>
  <text x="427" y="232" text-anchor="middle" class="accink" font-size="13">between tokens</text>
  <path class="line" d="M534 202 H590 V360" marker-end="url(#a)"/>
  <circle class="card" cx="590" cy="380" r="17"/>
  <text x="590" y="387" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <text x="400" y="470" text-anchor="middle" class="ink mono" font-size="14">x = x + Attention(Norm(x))</text>

  <!-- branch 2: norm + mlp -->
  <path class="line" d="M720 372 V238" marker-end="url(#a)"/>
  <rect class="card" x="660" y="172" width="120" height="60" rx="10"/>
  <text x="720" y="199" text-anchor="middle" class="ink" font-size="15" font-weight="700">Norm</text>
  <text x="720" y="218" text-anchor="middle" class="muted" font-size="12">rescale a copy</text>
  <line class="line" x1="782" y1="202" x2="808" y2="202" marker-end="url(#a)"/>
  <rect class="heat" x="812" y="160" width="210" height="84" rx="12"/>
  <text x="917" y="194" text-anchor="middle" class="heatink" font-size="18" font-weight="700">MLP</text>
  <text x="917" y="216" text-anchor="middle" class="heatink" font-size="13">works on each token alone:</text>
  <text x="917" y="232" text-anchor="middle" class="heatink" font-size="13">expand ×4 → bend → shrink</text>
  <path class="line" d="M1024 202 H1050 V360" marker-end="url(#a)"/>
  <circle class="card" cx="1050" cy="380" r="17"/>
  <text x="1050" y="387" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <text x="880" y="470" text-anchor="middle" class="ink mono" font-size="14">x = x + MLP(Norm(x))</text>

  <!-- notes -->
  <g font-size="14">
    <rect class="card" x="40" y="496" width="360" height="70" rx="12"/>
    <text x="60" y="524" class="ink" font-weight="700">Add, don't replace</text>
    <text x="60" y="546" class="muted">The + gives training a shortcut to early layers.</text>

    <rect class="card" x="420" y="496" width="360" height="70" rx="12"/>
    <text x="440" y="524" class="ink" font-weight="700">Norm keeps numbers steady</text>
    <text x="440" y="546" class="muted">Only the copy going in is rescaled.</text>

    <rect class="card" x="800" y="496" width="360" height="70" rx="12"/>
    <text x="820" y="524" class="ink" font-weight="700">The MLP is the big part</text>
    <text x="820" y="546" class="muted">About two-thirds of all parameters.</text>
  </g>
</svg>
