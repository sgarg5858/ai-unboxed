<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Residual connections</title>
  <desc id="d">Residual connections inside a transformer block, repeated N times. The input x goes through layer norm and multi-head attention (causal: looks back only); meanwhile a residual line copies x around them and adds it back at a plus sign. Then the result goes through layer norm and feed-forward (each token on its own), and a second residual line copies it around and adds it back. The output goes to the next block. As numbers, following “it”: x in is [1, 2, 3]. A copy is kept on the residual line. Layer norm turns a copy into [−1.22, 0, 1.22]; attention reads it and gives an update [0.2, −0.5, 0.7]. At the plus sign, [1, 2, 3] + [0.2, −0.5, 0.7] = [1.2, 1.5, 3.7]. A copy of that is kept; layer norm turns a copy into [−0.84, −0.57, 1.41]; feed-forward gives an update [0.1, 0.3, −0.2]. At the second plus sign, [1.2, 1.5, 3.7] + [0.1, 0.3, −0.2] = [1.3, 1.8, 3.5], which goes to the next block. x only changes at the plus signs; the norms work on copies, so x keeps its full values. Updates are illustrative.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="50" text-anchor="start" class="ink" font-size="26" font-weight="700">Residual connections: add, don’t replace</text>
  <text x="40" y="76" text-anchor="start" class="muted" font-size="15">Each step’s output is added onto the vector that went in. The vector is a running total.</text>
  <rect class="card" x="40.0" y="96.0" width="500.0" height="474.0" rx="14" stroke-width="1.2"/>
  <rect class="sunk" x="60.0" y="112.0" width="460.0" height="442.0" rx="12"/>
  <text x="78" y="138" text-anchor="start" class="accink mono" font-size="12" font-weight="700">TRANSFORMER BLOCK × N</text>
  <line class="line" x1="250" y1="116" x2="250" y2="160" />
  <text x="260" y="132" text-anchor="start" class="muted" font-size="12" font-weight="600">x in</text>
  <circle class="pos" cx="250" cy="160" r="3.5"/>
  <path class="spos" d="M250 160 H450 V304 H269" marker-end="url(#ap)"/>
  <text x="370.0" y="153" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Residual (copy x)</text>
  <line class="line" x1="250" y1="160" x2="250" y2="172" marker-end="url(#a)"/>
  <rect class="heat" x="140.0" y="176.0" width="220.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="199.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Layer norm</text>
  <line class="line" x1="250" y1="212" x2="250" y2="226" marker-end="url(#a)"/>
  <rect class="hit" x="140.0" y="230.0" width="220.0" height="46.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="251" text-anchor="middle" class="accink" font-size="14" font-weight="700">Multi-head attention</text>
  <text x="250" y="268" text-anchor="middle" class="muted" font-size="12">causal: looks back only</text>
  <line class="line" x1="250" y1="276" x2="250" y2="285" marker-end="url(#a)"/>
  <circle class="card" cx="250" cy="304" r="15" stroke-width="2"/>
  <text x="250" y="311" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <line class="line" x1="250" y1="319" x2="250" y2="332"/>
  <circle class="pos" cx="250" cy="332" r="3.5"/>
  <path class="spos" d="M250 332 H450 V476 H269" marker-end="url(#ap)"/>
  <text x="370.0" y="325" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Residual</text>
  <line class="line" x1="250" y1="332" x2="250" y2="344" marker-end="url(#a)"/>
  <rect class="heat" x="140.0" y="348.0" width="220.0" height="36.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="371.0" text-anchor="middle" class="heatink" font-size="14" font-weight="700">Layer norm</text>
  <line class="line" x1="250" y1="384" x2="250" y2="398" marker-end="url(#a)"/>
  <rect class="hit" x="140.0" y="402.0" width="220.0" height="46.0" rx="10" stroke-width="1.4"/>
  <text x="250" y="423" text-anchor="middle" class="accink" font-size="14" font-weight="700">Feed-forward</text>
  <text x="250" y="440" text-anchor="middle" class="muted" font-size="12">each token on its own</text>
  <line class="line" x1="250" y1="448" x2="250" y2="457" marker-end="url(#a)"/>
  <circle class="card" cx="250" cy="476" r="15" stroke-width="2"/>
  <text x="250" y="483" text-anchor="middle" class="ink" font-size="22" font-weight="700">+</text>
  <line class="line" x1="250" y1="491" x2="250" y2="520" marker-end="url(#a)"/>
  <text x="260" y="516" text-anchor="start" class="muted" font-size="12" font-weight="600">x out → next block</text>
  <text x="78" y="540" text-anchor="start" class="muted" font-size="12">Green: the input is copied around each step and added back at +.</text>
  <rect class="card" x="580.0" y="96.0" width="580.0" height="474.0" rx="14" stroke-width="1.2"/>
  <text x="600" y="120" text-anchor="start" class="muted mono" font-size="11.5" font-weight="700">THE SAME BLOCK, AS NUMBERS: FOLLOW “it”</text>
  <text x="600" y="146" text-anchor="start" class="muted" font-size="12.5">x in</text>
  <text x="738" y="146" text-anchor="start" class="ink mono" font-size="13" font-weight="700">[1, 2, 3]</text>
  <text x="600" y="166" text-anchor="start" class="posink" font-size="12.5" font-weight="600">residual copy</text>
  <text x="738" y="166" text-anchor="start" class="posink mono" font-size="13" font-weight="700">[1, 2, 3]</text>
  <line class="thin" x1="468" y1="195" x2="574" y2="195" stroke-dasharray="2 4"/>
  <text x="600" y="199" text-anchor="start" class="muted" font-size="12.5">layer norm (copy)</text>
  <text x="738" y="199" text-anchor="start" class="heatink mono" font-size="13" font-weight="700">[−1.22, 0, 1.22]</text>
  <line class="thin" x1="468" y1="254" x2="574" y2="254" stroke-dasharray="2 4"/>
  <text x="600" y="258" text-anchor="start" class="muted" font-size="12.5">attention update</text>
  <text x="738" y="258" text-anchor="start" class="accink mono" font-size="13" font-weight="700">[0.2, −0.5, 0.7]</text>
  <line class="thin" x1="468" y1="305" x2="574" y2="305" stroke-dasharray="2 4"/>
  <text x="600" y="309" text-anchor="start" class="muted" font-size="12.5">add at +</text>
  <text x="738" y="309" text-anchor="start" class="ink mono" font-size="13" font-weight="700">[1, 2, 3] + [0.2, −0.5, 0.7]</text>
  <text x="600" y="338" text-anchor="start" class="posink" font-size="12.5" font-weight="600">residual copy</text>
  <text x="738" y="338" text-anchor="start" class="posink mono" font-size="13" font-weight="700">[1.2, 1.5, 3.7]</text>
  <line class="thin" x1="468" y1="367" x2="574" y2="367" stroke-dasharray="2 4"/>
  <text x="600" y="371" text-anchor="start" class="muted" font-size="12.5">layer norm (copy)</text>
  <text x="738" y="371" text-anchor="start" class="heatink mono" font-size="13" font-weight="700">[−0.84, −0.57, 1.41]</text>
  <line class="thin" x1="468" y1="426" x2="574" y2="426" stroke-dasharray="2 4"/>
  <text x="600" y="430" text-anchor="start" class="muted" font-size="12.5">feed-forward update</text>
  <text x="738" y="430" text-anchor="start" class="accink mono" font-size="13" font-weight="700">[0.1, 0.3, −0.2]</text>
  <line class="thin" x1="468" y1="477" x2="574" y2="477" stroke-dasharray="2 4"/>
  <text x="600" y="481" text-anchor="start" class="muted" font-size="12.5">add at +</text>
  <text x="738" y="481" text-anchor="start" class="ink mono" font-size="13" font-weight="700">[1.2, 1.5, 3.7] + [0.1, 0.3, −0.2]</text>
  <line class="thin" x1="468" y1="512" x2="574" y2="512" stroke-dasharray="2 4"/>
  <text x="600" y="516" text-anchor="start" class="muted" font-size="12.5">x out</text>
  <text x="738" y="516" text-anchor="start" class="ink mono" font-size="13" font-weight="700">[1.3, 1.8, 3.5]</text>
  <rect class="hit" x="959.2" y="292.0" width="142.6" height="24.0" rx="6" stroke-width="1.2"/>
  <text x="964.2" y="309" text-anchor="start" class="accink mono" font-size="13" font-weight="700">= [1.2, 1.5, 3.7]</text>
  <rect class="hit" x="1006.0" y="464.0" width="142.6" height="24.0" rx="6" stroke-width="1.2"/>
  <text x="1011.0" y="481" text-anchor="start" class="accink mono" font-size="13" font-weight="700">= [1.3, 1.8, 3.5]</text>
  <text x="600" y="548" text-anchor="start" class="ink" font-size="13" font-weight="700">x only changes at +. The norms work on copies, so x keeps its full values.</text>
</svg>
