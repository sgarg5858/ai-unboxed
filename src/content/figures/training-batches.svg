<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How much data per step?</title>
  <desc id="d">Three panels, each a valley seen from above with a path from a start point to the lowest point. Batch gradient descent looks at all 1,000,000 sentences before each update: one update per pass, a smooth path, but slow. Stochastic gradient descent looks at one random sentence per update: 1,000,000 updates per pass, a fast but zig-zagging path. Mini-batch looks at a group of 32: 31,250 updates per pass, a fairly smooth, fast path. This is the one used in practice.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="460" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">How much data per step?</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Three ways to walk down the same valley, for a dataset of 1,000,000 sentences.</text>
  <rect class="card" x="40" y="100" width="360" height="340" rx="10"/>
  <text x="60" y="132" text-anchor="start" class="ink" font-size="18" font-weight="700">Batch</text>
  <ellipse class="thin" cx="220" cy="230" rx="150" ry="70"/>
  <ellipse class="thin" cx="220" cy="230" rx="100" ry="46"/>
  <ellipse class="thin" cx="220" cy="230" rx="50" ry="23"/>
  <circle class="pos" cx="220" cy="230" r="6"/>
  <polyline class="sheat" points="85.0,178.0 134.8,197.2 175.5,212.8 205.3,224.3 220.0,230.0" fill="none" stroke-linejoin="round"/>
  <circle class="heatfill" cx="85" cy="178" r="6"/>
  <text x="60" y="340" text-anchor="start" class="muted" font-size="13">Each update looks at</text>
  <text x="60" y="362" text-anchor="start" class="ink" font-size="15" font-weight="700">all 1,000,000 sentences</text>
  <text x="60" y="392" text-anchor="start" class="muted" font-size="13">Updates per pass:</text>
  <text x="180" y="392" text-anchor="start" class="ink" font-size="15" font-weight="700">1</text>
  <text x="60" y="422" text-anchor="start" class="muted" font-size="14" font-weight="700">steady, but slow</text>
  <rect class="card" x="420" y="100" width="360" height="340" rx="10"/>
  <text x="440" y="132" text-anchor="start" class="ink" font-size="18" font-weight="700">Stochastic (SGD)</text>
  <ellipse class="thin" cx="600" cy="230" rx="150" ry="70"/>
  <ellipse class="thin" cx="600" cy="230" rx="100" ry="46"/>
  <ellipse class="thin" cx="600" cy="230" rx="50" ry="23"/>
  <circle class="pos" cx="600" cy="230" r="6"/>
  <polyline class="sheat" points="465.0,178.0 474.0,207.0 506.9,170.9 507.8,215.4 535.7,186.6 537.6,222.2 560.1,200.7 562.8,227.3 579.8,212.9 583.0,230.4 593.9,223.0 596.7,231.0 600.0,230.0" fill="none" stroke-linejoin="round"/>
  <circle class="heatfill" cx="465" cy="178" r="6"/>
  <text x="440" y="340" text-anchor="start" class="muted" font-size="13">Each update looks at</text>
  <text x="440" y="362" text-anchor="start" class="ink" font-size="15" font-weight="700">1 random sentence</text>
  <text x="440" y="392" text-anchor="start" class="muted" font-size="13">Updates per pass:</text>
  <text x="560" y="392" text-anchor="start" class="ink" font-size="15" font-weight="700">1,000,000</text>
  <text x="440" y="422" text-anchor="start" class="muted" font-size="14" font-weight="700">fast, but jumpy</text>
  <rect class="card" x="800" y="100" width="360" height="340" rx="10" stroke-width="2"/>
  <rect class="possoft" x="800" y="100" width="360" height="340" rx="10" fill-opacity="0.35" stroke-width="2"/>
  <text x="820" y="132" text-anchor="start" class="ink" font-size="18" font-weight="700">Mini-batch</text>
  <ellipse class="thin" cx="980" cy="230" rx="150" ry="70"/>
  <ellipse class="thin" cx="980" cy="230" rx="100" ry="46"/>
  <ellipse class="thin" cx="980" cy="230" rx="50" ry="23"/>
  <circle class="pos" cx="980" cy="230" r="6"/>
  <polyline class="sheat" points="845.0,178.0 868.8,193.7 896.7,192.3 914.8,209.6 936.7,209.6 951.0,221.6 965.9,222.7 974.8,228.9 980.0,230.0" fill="none" stroke-linejoin="round"/>
  <circle class="heatfill" cx="845" cy="178" r="6"/>
  <text x="820" y="340" text-anchor="start" class="muted" font-size="13">Each update looks at</text>
  <text x="820" y="362" text-anchor="start" class="ink" font-size="15" font-weight="700">a group of 32</text>
  <text x="820" y="392" text-anchor="start" class="muted" font-size="13">Updates per pass:</text>
  <text x="940" y="392" text-anchor="start" class="ink" font-size="15" font-weight="700">31,250</text>
  <text x="820" y="422" text-anchor="start" class="posink" font-size="14" font-weight="700">fast and steady enough</text>
</svg>
