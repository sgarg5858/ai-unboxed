<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">From text predictor to assistant</title>
  <desc id="d">You ask “What colour is the sky?”. Left, a base model that has only been pretrained continues the text as if it were a quiz: “What colour is the grass? What colour is the sea? What colour is a banana?”. Right, an assistant after post-training answers: “Usually blue. Sunlight scatters off the air, and blue light scatters the most. At sunset it turns orange and red.” Both have the same knowledge; post-training changes how it is used.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="440" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">From text predictor to assistant</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Pretraining gives a model that continues text. Post-training teaches it to answer.</text>
  <rect class="accsoft" x="40" y="100" width="1120" height="50" rx="8"/>
  <text x="600" y="132" text-anchor="middle" class="accink" font-size="17" font-weight="700">You ask: “What colour is the sky?”</text>
  <rect class="card" x="40" y="170" width="540" height="230" rx="10"/>
  <text x="60" y="200" text-anchor="start" class="muted head" font-size="12">BASE MODEL (PRETRAINING ONLY)</text>
  <rect class="negsoft" x="60" y="216" width="500" height="120" rx="8" stroke-width="1.5"/>
  <text x="80" y="250" text-anchor="start" class="ink" font-size="15" font-weight="500">What colour is the grass?</text>
  <text x="80" y="278" text-anchor="start" class="ink" font-size="15" font-weight="500">What colour is the sea?</text>
  <text x="80" y="306" text-anchor="start" class="ink" font-size="15" font-weight="500">What colour is a banana?</text>
  <text x="60" y="370" text-anchor="start" class="negink" font-size="14.5" font-weight="700">continues the text: it sounds like a quiz</text>
  <rect class="card" x="620" y="170" width="540" height="230" rx="10"/>
  <text x="640" y="200" text-anchor="start" class="muted head" font-size="12">ASSISTANT (AFTER POST-TRAINING)</text>
  <rect class="possoft" x="640" y="216" width="500" height="120" rx="8" stroke-width="1.5"/>
  <text x="660" y="250" text-anchor="start" class="ink" font-size="15" font-weight="500">Usually blue. Sunlight scatters off the air,</text>
  <text x="660" y="278" text-anchor="start" class="ink" font-size="15" font-weight="500">and blue light scatters the most. At sunset</text>
  <text x="660" y="306" text-anchor="start" class="ink" font-size="15" font-weight="500">it turns orange and red.</text>
  <text x="640" y="370" text-anchor="start" class="posink" font-size="14.5" font-weight="700">answers the question, helpfully</text>
  <text x="600" y="424" text-anchor="middle" class="muted" font-size="14">Same knowledge in both. Post-training changes how it is used.</text>
</svg>
