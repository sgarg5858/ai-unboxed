  <text x="375" y="132" text-anchor="middle" class="ink" font-size="15" font-weight="700">sat</text>
  <rect class="card" x="463" y="110" width="104" height="34" rx="8"/>
  <text x="515" y="132" text-anchor="middle" class="ink" font-size="15" font-weight="700">on</text>
  <rect class="card" x="603" y="110" width="104" height="34" rx="8"/>
  <text x="655" y="132" text-anchor="middle" class="ink" font-size="15" font-weight="700">the</text>
  <rect class="card" x="743" y="110" width="104" height="34" rx="8"/>
  <text x="795" y="132" text-anchor="middle" class="ink" font-size="15" font-weight="700">mat</text>
  <rect class="card" x="883" y="110" width="104" height="34" rx="8"/>
  <text x="935" y="132" text-anchor="middle" class="ink" font-size="15" font-weight="700">because</text>
  <rect class="hit" x="1023" y="110" width="104" height="34" rx="8" stroke-width="1.5"/>
  <text x="1075" y="132" text-anchor="middle" class="accink" font-size="15" font-weight="700">it</text>
  <rect class="sunk" x="40" y="170" width="1120" height="92" rx="12"/>
  <text x="60" y="194" text-anchor="start" class="accink head" font-size="12">1 · ATTENTION · between tokens</text>
  <path d="M1075 250 C 1075 204, 235 204, 235 250" fill="none" class="sacc" stroke-width="3"/>
  <path d="M1075 250 C 1075 220, 655 220, 655 250" fill="none" class="thin" stroke-width="1.5"/>
  <path d="M1075 250 C 1075 220, 795 220, 795 250" fill="none" class="thin" stroke-width="1.5"/>
  <text x="1140" y="194" text-anchor="end" class="muted" font-size="12.5">“it” takes in some of “cat”</text>
  <text x="60" y="296" text-anchor="start" class="posink head" font-size="12">2 · THE MLP · each token on its own, the same network for every token</text>
