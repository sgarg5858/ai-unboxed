  <path class="line" d="M1075 396 V 428" fill="none" marker-end="url(#a)"/>
  <circle cx="1075" cy="442" r="12" class="card" stroke-width="1.5"/>
  <text x="1075" y="447" text-anchor="middle" class="ink" font-size="16" font-weight="700">+</text>
  <rect class="accsoft" x="40" y="476" width="1120" height="62" rx="12" stroke-width="1.5"/>
  <text x="60" y="503" text-anchor="start" class="accink" font-size="15" font-weight="700">1 · Expand</text>
  <text x="60" y="525" text-anchor="start" class="ink" font-size="13.5">768 → 3,072 detector scores</text>
  <text x="390" y="513" text-anchor="middle" class="accink" font-size="20" font-weight="700">→</text>
