<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The MLP in one picture</title>
  <desc id="d">One transformer layer for “The cat sat on the mat because it”. First, attention moves information between tokens: “it” looks back and takes in some of “cat”. Then the MLP runs on every token separately, the same small network for each, with no mixing between tokens. Inside it there are three steps: expand the 768 numbers to 3,072 detector scores, bend them with an activation such as GELU so only the detectors that fired stay strong, and shrink back to 768 numbers. The result is added to the token’s vector, and the layer repeats: 12 times in GPT-2. Attention moves information between tokens; the MLP works on each token by itself.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">The MLP in one picture</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Attention moves information between tokens. Then the MLP works on each token by itself.</text>
