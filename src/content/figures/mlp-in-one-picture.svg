  <rect class="card" x="603" y="310" width="104" height="86" rx="10" stroke-width="1"/>
  <text x="655" y="334" text-anchor="middle" class="muted" font-size="13" font-weight="700">MLP</text>
  <path d="M625 372 L643 352 L667 352 L685 372" fill="none" class="thin" stroke-width="1.6"/>
  <path class="line" d="M655 396 V 428" fill="none" marker-end="url(#a)"/>
