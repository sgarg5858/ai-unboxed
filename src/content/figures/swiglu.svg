<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">A plain MLP and SwiGLU</title>
  <desc id="d">Two versions of the MLP. A plain MLP, as in GPT-2: expand the token’s vector to a wider layer, pass every number through GELU, then shrink back. SwiGLU, as in Llama, Mistral and Qwen: expand the vector twice, side by side. One copy goes through SiLU and becomes a gate, the other is the value. Multiply them number by number, so each gate decides how much of its value passes, from fully off to fully on. Then shrink back. Because it has three matrices instead of two, the middle is made narrower to keep the size the same: Llama 3 8B goes from 4,096 to 14,336 and back, 3.5 times wider. Gemma uses the same idea with GELU, called GeGLU.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">A plain MLP, and SwiGLU</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Modern models add a gate: one copy of the expansion decides how much of the other gets through.</text>
  <rect class="card" x="40" y="100" width="500" height="380" rx="10"/>
  <text x="60" y="130" text-anchor="start" class="muted head" font-size="12">PLAIN MLP · GPT-2</text>
  <rect class="sunk" x="170" y="150" width="240" height="46" rx="10"/>
  <text x="290.0" y="170.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">token vector</text>
  <text x="290.0" y="188.0" text-anchor="middle" class="muted" font-size="12">768 numbers</text>
  <path class="line" d="M290 196 V 222" fill="none" marker-end="url(#a)"/>
  <rect class="sunk" x="170" y="226" width="240" height="46" rx="10"/>
  <text x="290.0" y="246.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">expand</text>
  <text x="290.0" y="264.0" text-anchor="middle" class="muted" font-size="12">768 → 3,072</text>
  <path class="line" d="M290 272 V 298" fill="none" marker-end="url(#a)"/>
  <rect class="accsoft" x="170" y="302" width="240" height="46" rx="10" stroke-width="1.5"/>
  <text x="290.0" y="322.0" text-anchor="middle" class="accink" font-size="14.5" font-weight="700">GELU</text>
  <text x="290.0" y="340.0" text-anchor="middle" class="muted" font-size="12">bend each number</text>
  <path class="line" d="M290 348 V 374" fill="none" marker-end="url(#a)"/>
  <rect class="sunk" x="170" y="378" width="240" height="46" rx="10"/>
  <text x="290.0" y="398.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">shrink</text>
  <text x="290.0" y="416.0" text-anchor="middle" class="muted" font-size="12">3,072 → 768</text>
  <text x="290" y="458" text-anchor="middle" class="muted" font-size="13" font-weight="600">2 matrices</text>
  <rect class="card" x="580" y="100" width="580" height="380" rx="10"/>
  <text x="600" y="130" text-anchor="start" class="posink head" font-size="12">SWIGLU · LLAMA, MISTRAL, QWEN</text>
  <rect class="sunk" x="750" y="150" width="240" height="46" rx="10"/>
  <text x="870.0" y="170.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">token vector</text>
  <text x="870.0" y="188.0" text-anchor="middle" class="muted" font-size="12">4,096 numbers</text>
  <path class="line" d="M810 196 L720 226" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M930 196 L1020 226" fill="none" marker-end="url(#a)"/>
  <rect class="possoft spos" x="610" y="230" width="200" height="46" rx="10" stroke-width="1.5"/>
  <text x="710.0" y="250.0" text-anchor="middle" class="posink" font-size="14.5" font-weight="700">expand → SiLU</text>
  <text x="710.0" y="268.0" text-anchor="middle" class="muted" font-size="12">the gate</text>
  <rect class="sunk" x="930" y="230" width="200" height="46" rx="10"/>
  <text x="1030.0" y="250.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">expand</text>
  <text x="1030.0" y="268.0" text-anchor="middle" class="muted" font-size="12">the value</text>
  <path class="line" d="M710 276 L846 312" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M1030 276 L894 312" fill="none" marker-end="url(#a)"/>
  <circle cx="870" cy="326" r="20" class="possoft spos" stroke-width="1.5"/>
  <text x="870" y="332" text-anchor="middle" class="posink" font-size="20" font-weight="700">×</text>
  <text x="900" y="356" text-anchor="start" class="muted" font-size="12.5">gate × value, number by number</text>
  <text x="900" y="372" text-anchor="start" class="muted" font-size="12">(each gate: off → fully on)</text>
  <path class="line" d="M870 346 V 374" fill="none" marker-end="url(#a)"/>
  <rect class="sunk" x="750" y="378" width="240" height="46" rx="10"/>
  <text x="870.0" y="398.0" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">shrink</text>
  <text x="870.0" y="416.0" text-anchor="middle" class="muted" font-size="12">14,336 → 4,096</text>
  <text x="870" y="458" text-anchor="middle" class="muted" font-size="13" font-weight="600">3 matrices · middle 3.5× wide (Llama 3 8B)</text>
  <rect class="accsoft" x="40" y="496" width="1120" height="46" rx="12" stroke-width="1.5"/>
  <text x="600" y="525" text-anchor="middle" class="ink" font-size="14.5" font-weight="600">GELU: GPT-2, BERT · SwiGLU: Llama, Mistral, Qwen · GeGLU (the same gate with GELU): Gemma</text>
</svg>
