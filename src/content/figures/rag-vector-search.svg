<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How a vector database searches fast</title>
  <desc id="d">Left: about 70 stored vectors drawn as dots, each linked to its nearest neighbours. A search for your question starts at one dot and keeps hopping to whichever neighbour is closer to the question, until no neighbour is closer. It reaches the nearest chunk after comparing only 19 of the 70 points; the rest are never compared. This is the idea behind HNSW, the most common index. Right: exact search compares the question with every stored vector, which is always right but grows with the collection: 10 million chunks means 10 million comparisons. Approximate search (ANN) links each vector to its neighbours ahead of time and hops through them, comparing a few thousand out of millions. The trade-off: much faster, but it can occasionally miss the true nearest vector, so you tune speed against recall.</desc>
