  <text x="720" y="130" text-anchor="start" class="muted head" font-size="13">TWO WAYS TO FIND THE NEAREST</text>
  <rect class="sunk" x="720" y="148" width="420" height="120" rx="10"/>
  <text x="738" y="176" text-anchor="start" class="ink" font-size="16" font-weight="700">Exact search</text>
  <text x="738" y="198" text-anchor="start" class="muted" font-size="13">Compare the question with every stored vector.</text>
  <text x="738" y="217" text-anchor="start" class="muted" font-size="13">Always right, but the work grows with the</text>
  <text x="738" y="236" text-anchor="start" class="muted" font-size="13">collection: 10 million chunks, 10 million comparisons.</text>
  <rect class="accsoft" x="720" y="282" width="420" height="150" rx="10"/>
  <text x="738" y="310" text-anchor="start" class="accink" font-size="16" font-weight="700">Approximate search (ANN)</text>
  <text x="738" y="332" text-anchor="start" class="ink" font-size="13">Link each vector to its neighbours ahead of time.</text>
  <text x="738" y="351" text-anchor="start" class="ink" font-size="13">To search, start anywhere and keep hopping to</text>
  <text x="738" y="370" text-anchor="start" class="ink" font-size="13">whichever neighbour is closer to the question.</text>
  <text x="738" y="389" text-anchor="start" class="ink" font-size="13">Here: 19 of 70 points compared. At scale,</text>
  <text x="738" y="408" text-anchor="start" class="ink" font-size="13">a few thousand out of millions.</text>
  <rect class="heat" x="720" y="446" width="420" height="76" rx="10" stroke-width="1.5"/>
  <text x="738" y="472" text-anchor="start" class="heatink" font-size="14.5" font-weight="700">The trade-off</text>
  <text x="738" y="494" text-anchor="start" class="ink" font-size="13">Much faster, but it can occasionally miss the true</text>
  <text x="738" y="512" text-anchor="start" class="ink" font-size="13">nearest vector. You tune speed against recall.</text>
  <text x="40" y="562" text-anchor="start" class="muted" font-size="11.5">Drawn in 2D. Real HNSW adds a few sparse layers on top for long jumps, then refines on the dense bottom layer.</text>
